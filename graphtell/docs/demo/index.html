<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphTell 示例 Demo</title>
<!-- 图渲染用 vis-network，Markdown 渲染用 marked；均走 CDN，页面本身是纯静态的。 -->
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { color-scheme: light; }
  body { margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:#1f2328; }
  header { padding:16px 20px; border-bottom:1px solid #d0d7de; background:#f6f8fa; }
  h1 { margin:0 0 8px; font-size:18px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; padding:5px 8px; }
  .tabs { display:flex; gap:4px; margin-top:12px; }
  .tab { padding:6px 14px; border:1px solid #d0d7de; border-bottom:none; background:#fff;
         cursor:pointer; border-radius:6px 6px 0 0; }
  .tab.active { background:#0969da; color:#fff; border-color:#0969da; }
  main { padding:0 20px 24px; }
  .panel { display:none; border:1px solid #d0d7de; border-top:none; padding:16px; }
  .panel.active { display:block; }
  #graph { height:560px; border:1px solid #e1e4e8; border-radius:6px; background:#fafbfc; }
  table { border-collapse:collapse; width:100%; }
  th,td { border:1px solid #d0d7de; padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#f6f8fa; }
  .sev { display:inline-block; padding:1px 6px; border-radius:10px; font-size:12px; }
  .sev.warning { background:#fff8c5; } .sev.error { background:#ffdce0; }
  .sev.info { background:#ddf4ff; } .sev.critical { background:#ffdce0; font-weight:600; }
  .muted { color:#57606a; font-size:12px; }
  #info { margin-top:10px; padding:10px; background:#f6f8fa; border-radius:6px; min-height:44px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0; font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  pre { background:#f6f8fa; padding:12px; overflow:auto; border-radius:6px; }
  .notice { background:#fff8c5; padding:8px 12px; border-radius:6px; margin-bottom:10px; }
  code { background:#f0f1f3; padding:1px 4px; border-radius:3px; }
  .files { white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<header>
  <h1>GraphTell 示例 Demo</h1>
  <div class="muted" style="margin-bottom:6px">
    纯静态页面（GitHub Pages 托管，免自购域名）：多项目切换 · 图 / 规则检验 / 提示词增强。
    源码与生成脚本见
    <a href="https://github.com/alvinliu87/graphtell" target="_blank" rel="noopener">alvinliu87/graphtell</a>
    （产物由 <code>tools/gen_demo.sh</code> 生成）。
  </div>
  <div class="row">
    <label>项目：
      <select id="project"></select>
    </label>
    <span id="attr" class="muted"></span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="graph">图</div>
    <div class="tab" data-tab="rules">规则检验</div>
    <div class="tab" data-tab="recall">提示词增强</div>
  </div>
</header>

<main>
  <section class="panel active" id="panel-graph">
    <div id="meta" class="muted"></div>
    <div id="trunc" class="notice" style="display:none"></div>
    <div class="legend" id="legend"></div>
    <div id="graph"></div>
    <div id="info" class="muted">点击节点查看细节（类型 / 名称 / 位置）。</div>
  </section>

  <section class="panel" id="panel-rules">
    <div id="rules-meta" class="muted"></div>
    <div class="row" style="margin:8px 0">
      <label>严重度：
        <select id="sevFilter"><option value="">全部</option></select>
      </label>
      <label>规则：
        <select id="ruleFilter"><option value="">全部</option></select>
      </label>
    </div>
    <div id="rules-table"></div>
  </section>

  <section class="panel" id="panel-recall">
    <div id="recall" class="files"></div>
  </section>
</main>

<script>
const KIND_COLORS = {
  HttpContract:'#0969da', Table:'#1a7f37', Class:'#8250df', Service:'#bf3989',
  Dao:'#9a6700', Method:'#bc4c00', Function:'#953800', Cache:'#0969da',
  Queue:'#6e7781', EventBus:'#cf222e', Schedule:'#4d2d8c', Page:'#0a7ea4',
  Store:'#116329', ConfigKey:'#6e7781', Module:'#8250df', CallSite:'#8c959f',
  Middleware:'#6e7781'
};
const colorOf = k => KIND_COLORS[k] || '#8c959f';

let network = null;
let current = { violations: [], graph: null };

async function getJSON(p){ const r = await fetch(p); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
async function getText(p){ const r = await fetch(p); if(!r.ok) throw new Error(p+' '+r.status); return r.text(); }

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  if (t.dataset.tab === 'graph' && network) { network.fit(); }
}));

async function init(){
  const projects = await getJSON('projects.json');
  const sel = document.getElementById('project');
  projects.forEach(p => {
    const o = document.createElement('option');
    o.value = p.slug; o.textContent = `${p.slug}（${p.nodes} 节点 / ${p.violations} 违规）`;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => load(sel.value, projects));
  await load(projects[0].slug, projects);
}

async function load(slug, projects){
  const meta = projects.find(p => p.slug === slug) || {};
  // 署名：第三方样本按各自许可证授权，源码不随本仓库分发。
  document.getElementById('attr').innerHTML =
    `简介：${meta.desc || ''} · 许可证：<b>${meta.license || '—'}</b>` +
    (meta.upstream && meta.upstream !== '—'
      ? ` · 上游：<a href="${meta.upstream}" target="_blank" rel="noopener">${meta.upstream}</a>`
      : '') +
    ` · <span class="muted">样本源码不随本仓库分发</span>`;

  const [g, m, v] = await Promise.all([
    getJSON(`${slug}/graph.json`),
    getJSON(`${slug}/meta.json`),
    getJSON(`${slug}/violations.json`)
  ]);
  let recall = '';
  try { recall = await getText(`${slug}/recall.md`); } catch(e){ recall = '（无召回示例）'; }

  current.violations = (v && v.violations) || [];
  renderGraph(g, m);
  renderRules(current.violations);
  document.getElementById('recall').innerHTML = window.marked ? marked.parse(recall) : `<pre>${recall}</pre>`;
}

function renderGraph(g, m){
  const nodes = new vis.DataSet(g.nodes.map(n => ({
    id: n.id, label: shortLabel(n), title: `${n.kind}: ${n.name || ''}`,
    color: colorOf(n.kind), shape: 'dot', size: nodeSize(n.kind)
  })));
  const edges = new vis.DataSet(g.edges.map((e, i) => ({
    id: i, from: e.from, to: e.to, title: e.kind || '',
    arrows: 'to', color: { color:'#c6cbd1', highlight:'#0969da' }, width: 1
  })));
  const el = document.getElementById('graph');
  network = new vis.Network(el, { nodes, edges }, {
    physics: { stabilization: true, barnesHut: { gravitationalConstant: -8000 } },
    interaction: { hover: true, tooltipDelay: 120 },
    nodes: { font: { size: 12 } },
    edges: { smooth: { type: 'dynamic' } }
  });
  network.on('click', params => {
    if (!params.nodes.length) return;
    const n = g.nodes.find(x => x.id === params.nodes[0]);
    document.getElementById('info').innerHTML = n
      ? `<b>${n.kind}</b> · ${escapeHtml(n.name || '')}` +
        (n.fqn ? `<br><span class="muted">${escapeHtml(n.fqn)}</span>` : '') +
        (n.file ? `<br><span class="muted">${escapeHtml(n.file)}</span>` : '')
      : '';
  });

  document.getElementById('meta').textContent =
    `图规模：全量 ${m.total_nodes} 节点 / ${m.total_edges} 边；本页展示 ${m.shown_nodes} 节点 / ${m.shown_edges} 边。`;
  const tr = document.getElementById('trunc');
  tr.style.display = m.truncated ? 'block' : 'none';
  if (m.truncated) {
    tr.innerHTML = `大工程只展示一个<b>连通子图</b>（从高价值节点 BFS 取到上限），完整规模见上方数字。`;
  }
  const kinds = Object.entries(m.kinds || {}).slice(0, 12);
  document.getElementById('legend').innerHTML =
    kinds.map(([k, c]) => `<span><i class="dot" style="background:${colorOf(k)}"></i>${k} (${c})</span>`).join('');
}

function shortLabel(n){
  const s = n.name || '(未命名)';
  return s.length > 28 ? s.slice(0, 27) + '…' : s;
}
function nodeSize(kind){
  return ['HttpContract','Table','Class'].includes(kind) ? 14 : 8;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderRules(violations){
  const sevSel = document.getElementById('sevFilter');
  const ruleSel = document.getElementById('ruleFilter');
  const sevs = [...new Set(violations.map(v => v.severity))].sort();
  const rules = [...new Set(violations.map(v => v.rule_id))].sort();
  sevSel.innerHTML = '<option value="">全部</option>' + sevs.map(s => `<option>${s}</option>`).join('');
  ruleSel.innerHTML = '<option value="">全部</option>' + rules.map(r => `<option>${escapeHtml(r)}</option>`).join('');
  const draw = () => {
    const s = sevSel.value, r = ruleSel.value;
    const rows = violations.filter(v => (!s || v.severity === s) && (!r || v.rule_id === r));
    document.getElementById('rules-meta').textContent = `共 ${violations.length} 条违规，当前显示 ${rows.length} 条。`;
    document.getElementById('rules-table').innerHTML = rows.length ? `
      <table><thead><tr><th>规则</th><th>严重度</th><th>位置</th><th>信息</th></tr></thead><tbody>
      ${rows.slice(0, 300).map(v => `<tr>
        <td><code>${escapeHtml(v.rule_id || '')}</code></td>
        <td><span class="sev ${escapeHtml(v.severity || '')}">${escapeHtml(v.severity || '')}</span></td>
        <td class="muted">${escapeHtml(v.file || v.node_name || '')}${v.line ? ':' + v.line : ''}</td>
        <td>${escapeHtml(v.message || '')}</td></tr>`).join('')}
      </tbody></table>` : '<p>没有匹配的违规。</p>';
  };
  sevSel.onchange = ruleSel.onchange = draw;
  draw();
}

init().catch(e => {
  document.body.insertAdjacentHTML('afterbegin',
    `<div class="notice">加载失败：${escapeHtml(e.message)}。<br>
     本页需通过 HTTP 访问（GitHub Pages 即可），直接以 file:// 打开无法 fetch 本地 JSON。</div>`);
});
</script>
</body>
</html>
