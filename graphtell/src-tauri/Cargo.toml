[package]
name = "graphtell-desktop"
version = "0.1.0"
description = "GraphTell desktop resident UI (Tauri)"
edition = "2021"
rust-version = "1.77"

# Tauri depends on system libs like webkit2gtk(Linux) / WebView2(Windows),
# so it is declared as a separate workspace here, excluded from the main workspace's daily build and CI.
[workspace]

[lib]
name = "graphtell_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

gt-app = { path = "../crates/gt-app" }
gt-domain = { path = "../crates/gt-domain" }
gt-adapter-http = { path = "../crates/gt-adapter-http" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
