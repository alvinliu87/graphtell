# One-command GraphTell (backend + frontend served same-origin, single port 5177).
#
#   docker compose up -d --build
#   open http://localhost:5177/ in a browser
#
# To use the "lexical-only" image (smaller, no candle/ort compile), change build.args GT_FEATURES to "--no-default-features".
services:
  graphtell:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GT_FEATURES: ""
    image: graphtell:latest
    ports:
      - "5177:5177"
    volumes:
      - graphtell-data:/data
    restart: unless-stopped

volumes:
  graphtell-data:
