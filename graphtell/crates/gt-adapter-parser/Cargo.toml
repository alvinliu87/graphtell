[package]
name = "gt-adapter-parser"
description = "tree-sitter 解析适配器（当前支持 PHP / Java / JavaScript / TypeScript / Python）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-domain = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-language = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-python = { workspace = true }
# TS grammar is a superset of JS: LANGUAGE_TYPESCRIPT parses .js/.ts, LANGUAGE_TSX parses .jsx/.tsx.
# So depending on this one crate covers all frontend JS/TS; tree-sitter-javascript is not needed.
tree-sitter-typescript = "0.23"
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
