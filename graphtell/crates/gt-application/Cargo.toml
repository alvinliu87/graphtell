[package]
name = "gt-application"
description = "GraphTell application layer: use-case orchestration and transaction boundaries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-domain = { workspace = true }
gt-pipeline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json", "tls"] }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# File-change watching (poll-walks the source root, follows .gitignore, skips hidden).
ignore = { workspace = true }

# Real model embedding (feature-gated, off by default; offline builds unaffected).
# After enabling `model-ort`, point `OrtBgeEmbedder` at the bge-m3 ONNX weights pulled and exported via ModelScope
# to get true cross-lingual semantic vectors (see embed_ort.rs).
# Uses tract (pure-Rust ONNX inference engine, zero system deps; avoids onnxruntime's openssl requirement).
tract-onnx = { version = "0.23", optional = true }
tract-core = { version = "0.23", optional = true }
tokenizers = { version = "0.20", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
safetensors = { version = "0.6", optional = true }

[features]
# Real bge-m3 (ONNX + tract) integration.
model-ort = ["dep:tract-onnx", "dep:tract-core", "dep:tokenizers"]
# Real bge-m3 (candle loading safetensors directly) integration, pure Rust, offline-capable.
# Weights: tools/convert_bge_safetensors.py exports from models/bge-m3-ms/pytorch_model.bin.
model-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:safetensors",
]
