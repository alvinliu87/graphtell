[package]
name = "gt-application"
description = "GraphTell 应用层：用例编排与事务边界"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-domain = { workspace = true }
gt-pipeline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json", "tls"] }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# 文件变更监听（轮询遍历源码根，遵循 .gitignore、跳过隐藏）。
ignore = { workspace = true }

# 真实模型嵌入（特征门控，默认不编译；离线构建不受影响）。
# 启用 `model-ort` 后，把经 ModelScope 拉取并转出的 bge-m3 ONNX 权重指给
# `OrtBgeEmbedder` 即可获得真正的跨语言语义向量（见 embed_ort.rs）。
# 选用 tract（纯 Rust ONNX 推理引擎，零系统依赖；避开 onnxruntime 对 openssl 的要求）。
tract-onnx = { version = "0.23", optional = true }
tract-core = { version = "0.23", optional = true }
tokenizers = { version = "0.20", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
safetensors = { version = "0.6", optional = true }

[features]
# 真实 bge-m3（ONNX + tract）接入。
model-ort = ["dep:tract-onnx", "dep:tract-core", "dep:tokenizers"]
# 真实 bge-m3（candle 直接加载 safetensors）接入，纯 Rust、离线可用。
# 权重：tools/convert_bge_safetensors.py 由 models/bge-m3-ms/pytorch_model.bin 转出。
model-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:safetensors",
]
