[package]
name = "gt-app"
description = "GraphTell composition root and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gt-domain = { workspace = true }
gt-application = { workspace = true }
gt-pipeline = { workspace = true }
gt-adapter-fs = { workspace = true }
gt-adapter-parser = { workspace = true }
gt-adapter-fkb = { workspace = true }
gt-adapter-views = { workspace = true }
gt-adapter-rules = { workspace = true }
gt-adapter-sqlite = { workspace = true }
gt-adapter-http = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }

[[bin]]
name = "graphtell"
path = "src/main.rs"

[lib]
name = "gt_app"
path = "src/lib.rs"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }

[features]
default = ["model-candle", "model-ort"]
# End-to-end verification of real-model recall: forwards to gt-application's model-candle (pure Rust bge-m3).
# Set as default so the CLI uses real bge-m3 semantic recall; if you don't want to compile candle, use
# `cargo build -p gt-app --no-default-features` to fall back to the local hash embedder (zero deps).
model-candle = ["gt-application/model-candle"]
# ONNX + tract (pure Rust inference, zero system deps). Combined with candle into a **hybrid embedder**:
# the query side goes through tract (~140ms vs candle ~810ms, about 5.8x faster), while batch node encoding still uses candle
# (~35ms/item vs tract batch 307ms/item). Missing ONNX weights auto-falls back to pure candle, behavior unchanged.
model-ort = ["gt-application/model-ort"]
