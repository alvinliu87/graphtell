# Sample catalog for the integration tests.
#
# This file is the ONLY place where the concrete on-disk directory names of the
# integration-test samples are recorded. Rust sources refer to samples exclusively by the
# generic keys defined here (`sample_project`, `php_alt`, `node_a`, `node_b`, `link`), so no
# specific product name is ever written into source code.
#
# Fields (all optional):
#   dirs      – accepted checkout directory names; discovery uses the first one that exists.
#   inner_dir – the application sub-directory inside the checkout (empty = the checkout root
#               itself is the project root).
#   ns        – PHP namespace prefix the project's composer.json maps onto `inner_dir`.
#
# Discovery can also be pointed at a checkout directly with the `GRAPHTELL_SAMPLE_DIR` env var,
# in which case `dirs` is not consulted at all.

[sample_project]
dirs = ["CRMEB", "CRMEB-master"]
inner_dir = "crmeb"
ns = "crmeb"

[php_alt]
dirs = ["laravel-starter"]

[node_a]
dirs = ["nestjs-realworld-example-app"]

[node_b]
dirs = ["hackathon-starter"]

[link]
dirs = ["frontend-backend-link"]

# Real Java corpus (Spring Boot / MyBatis). The checkout root is the Maven project;
# sources live under `<module>/src/main/java/...`.
[java]
dirs = ["mall"]

# Real Node.js corpus (NestJS). The checkout root is the app; sources live under `src/...`.
[node]
dirs = ["nestjs-realworld-example-app"]

# Real Python corpus: the Django framework source (a real, famous open-source project), vendored from
# PyPI as a pure-python wheel. Its ORM models exercise the parser's Python-specific facts — class-body
# field declarations (`models.CharField` -> `class.field` call sites), class inheritance, `@property`
# decorators, and FQN-restoring imports. The wheel's `django/` package is unpacked under this dir.
[python]
dirs = ["django"]
