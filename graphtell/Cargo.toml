# GraphTell - code-graph analysis platform
#
# Layering (hexagonal architecture):
#   crates/gt-domain            domain core: entities / value objects / port traits (zero external IO deps)
#   crates/gt-application       use-case orchestration: depends only on domain ports
#   crates/gt-pipeline         phase implementations (P0..P7 domain services), depends only on domain ports
#   crates/gt-adapter-*        adapters: file scan / tree-sitter / FKB / SQLite / HTTP / rules
# Tauri depends on system libs like webkit2gtk(Linux) / WebView2(Windows),
# so it is declared as a separate workspace here, excluded from the main workspace's daily build and CI.
[workspace]
resolver = "2"
members = [
    "crates/gt-domain",
    "crates/gt-application",
    "crates/gt-pipeline",
    "crates/gt-adapter-fs",
    "crates/gt-adapter-parser",
    "crates/gt-adapter-fkb",
    "crates/gt-adapter-views",
    "crates/gt-adapter-rules",
    "crates/gt-adapter-sqlite",
    "crates/gt-adapter-http",
    "crates/gt-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/graphtell/graphtell"

[workspace.dependencies]
# --- base ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

# --- runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
async-trait = "0.1"
futures = "0.3"

# --- IO / parsing ---
walkdir = "2"
ignore = "0.4"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"

# --- HTTP ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http-body-util = "0.1"

# --- internal crates ---
gt-domain = { path = "crates/gt-domain" }
gt-application = { path = "crates/gt-application" }
gt-pipeline = { path = "crates/gt-pipeline" }
gt-adapter-fs = { path = "crates/gt-adapter-fs" }
gt-adapter-parser = { path = "crates/gt-adapter-parser" }
gt-adapter-fkb = { path = "crates/gt-adapter-fkb" }
gt-adapter-views = { path = "crates/gt-adapter-views" }
gt-adapter-rules = { path = "crates/gt-adapter-rules" }
gt-adapter-sqlite = { path = "crates/gt-adapter-sqlite" }
gt-adapter-http = { path = "crates/gt-adapter-http" }

[profile.release]
opt-level = 2

# Keep the Tauri binary smaller
[profile.release.package]
tree-sitter = { opt-level = 3 }
