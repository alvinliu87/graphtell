# 视角注册表
#
# 顶部「两级筛选器」的一级选项，以及「点击节点切换视角」的映射规则。
#
# 两类视角语义完全不同，不可混用：
#   mode: object    —— 对象类。**只渲染当前这一个对象**的链路子图，
#                      其它对象的链路边直接不画（不是变暗），
#                      靠 hidden 计数 + unresolved 记账 + 可切换来守住诚实性。
#   mode: aggregate —— 聚合类。**不是单链路**，而是聚合概览（聚类框 / 矩阵）。
#
# 对象类视角**默认折叠**：只渲染"语义节点"（Table / HttpContract / ConfigKey /
# I18nKey / Event / Queue / Cache / Topic / Schedule…）与"语义边"（HandledBy /
# CallsHttp / Triggers / PublishesTo / ReadsDb / WritesDb / MapsTo / ReadsConfig /
# ReadsCache / ResolvesTo），判定权威来自 `gt-domain/src/model/kinds.rs`；语法节点
# （Method / CallSite / Class…）折叠起来，前端点击可展开查看调用链。
#
# 进程外中介（Event / Queue / Cache / Topic）各自是独立种类，视角**直接按种类**
# 显示（事件 / 队列 / 缓存 / 消息 Topic），不再有笼统的"外部系统"伞。
#
# `Middleware` 是**唯一由语法节点晋升而来**的语义节点：P2 先按 `Class` 建出它，
# P14 确认它挂在路由上之后把 kind 改成 `Middleware`（改身份、不新建节点 —— 否则
# 同一份代码在图里出现两次）。因此路由视角里它会作为**第一环邻居**直接出现。
#
# node_views 里**没有**列出的节点种类不会切换顶部筛选器，
# 只打开右侧 Inspector —— 例如 ConfigKey / KeyPattern / Component /
# SecretLocation 这类资产/结构节点没有"单链路"语义。

perspectives:
  # ---------------- 对象类视角（单链路）----------------
  - id: route
    label: 路由视角
    mode: object
    node_kind: HttpContract
    # 路由是"一条 HTTP 入口的调用流"，自顶向下的层 = 跳数，比径向更能体现调用顺序与流向。
    layout: layered
    # 为什么是 4 而不是 2：视图**只渲染语义节点**，中间的语法层（Controller / Services /
    # Dao / Model）全部折叠。四层架构（CRMEB：Controller → Services → Dao → Model → Table）
    # 里第一张表要第 4 跳才出现，depth=2 时路由视角几乎全空 —— 实测 CRMEB 抽样 60 个契约，
    # 「无任何语义邻居」从 43/60 降到 28/60（depth=5 为 26/60，之后饱和）。
    depth: 4
    collapsed_kinds: [Method, Function, CallSite, Property, Const, Namespace, File, Directory, Interface, Trait, Class, HttpContract]
    description: 以一个 HTTP 契约为中心，看它被谁处理、被谁调用、读写了哪些表

  - id: table
    label: 表视角
    mode: object
    node_kind: Table
    layout: radial
    depth: 2
    description: 以一张表为中心的入边汇聚：谁在读写它、PII 与关键度

  - id: event
    label: 事件视角
    mode: object
    node_kind: Event
    # 只收后端领域事件（`side=backend`）：`Event::dispatch` / `Event::listen` 等。
    # 前端组件间事件总线（uni-app `uni.$emit`）合成的是 `EventBus` 节点，被拆到
    # 「前端事件」视角，不再混进这里（与缓存前后端拆分同构）。
    side: backend
    layout: radial
    depth: 2
    description: 后端事件：谁发布、谁监听（Event::dispatch/listen，节点种类 Event，side=backend）

  - id: event_bus
    label: 前端事件
    mode: object
    node_kind: EventBus
    # 只收前端组件间事件总线（`side=frontend`）：`uni.$emit` / `bus.$emit` / `$eventHub.$emit`。
    side: frontend
    layout: radial
    depth: 2
    description: 前端事件总线：谁发射、谁监听（uni.$emit/bus.$emit，节点种类 EventBus，side=frontend）

  - id: queue
    label: 队列视角
    mode: object
    node_kind: Queue
    layout: radial
    depth: 2
    description: 消息队列：谁投递、谁消费（节点种类 Queue）

  - id: cache
    label: 缓存视角
    mode: object
    node_kind: Cache
    # 只收后端缓存（`side=backend`）：`Cache::*` / `Redis::*` / `*CacheService::*`。
    # 前端本地存储被拆到「本地存储」视角，不再混进这里。
    side: backend
    layout: radial
    depth: 2
    description: 后端缓存：谁读、谁写（Cache::/Redis::/*CacheService::，节点种类 Cache，side=backend）

  - id: local_storage
    label: 本地存储
    mode: object
    node_kind: Cache
    # 只收前端本地存储（`side=frontend`）：`uni.getStorageSync` / `localStorage`。
    side: frontend
    layout: radial
    depth: 2
    description: 前端本地存储：谁读、谁写（uni.setStorageSync/localStorage，节点种类 Cache，side=frontend）

  - id: schedule
    label: 计划任务
    mode: object
    node_kind: Schedule
    # 定时任务是"一条执行链路"，自顶向下的层 = 跳数，比径向更能体现执行流向。
    layout: layered
    # 与路由视角同理：定时任务同样是"入口 → 控制器 → 服务 → Dao → 表"的调用流，
    # 折叠掉语法层后要 4 跳才够得着语义资源。
    depth: 4
    description: 定时任务的执行链路（由项目级 FKB 合成 Schedule 节点，如 CRMEB 的 crontab 路由）

  - id: topic
    label: 消息 Topic
    mode: object
    node_kind: Topic
    layout: radial
    depth: 2
    description: 消息 topic 的生产与消费（节点种类 Topic）

  # ---------------- 以下视角 MVP 暂不实现，先注释 ----------------
