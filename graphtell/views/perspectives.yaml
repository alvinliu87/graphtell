# Perspective registry
#
# The level-one options of the top "two-level filter", plus the mapping rules for
# "click a node to switch perspective".
#
# The two kinds of perspective are semantically completely different and must not be mixed:
#   mode: object    — object perspective. **Renders the link subgraph of this one object only**;
#                     link edges of other objects are simply not drawn (not dimmed); honesty is
#                     upheld by the hidden counts + unresolved tally + switchability.
#   mode: aggregate — aggregate perspective. **Not a single link**, but an aggregate overview
#                     (cluster boxes / matrix).
#
# Object perspectives are **folded by default**: only "semantic nodes" (Table / HttpContract /
# ConfigKey / I18nKey / Event / Queue / Cache / Topic / Schedule…) and "semantic edges" (HandledBy /
# CallsHttp / Triggers / PublishesTo / ReadsDb / WritesDb / MapsTo / ReadsConfig / ReadsCache /
# ResolvesToContract) are rendered; the authority for that decision is `gt-domain/src/model/kinds.rs`. Syntax
# nodes (Method / CallSite / Class…) are folded and can be expanded by clicking to inspect the call chain.
#
# Out-of-process mediators (Event / Queue / Cache / Topic) are each their own kind, and perspectives
# **show them directly by kind** (event / queue / cache / message topic); there is no umbrella
# "external system".
#
# `Middleware` is the **only semantic node promoted from a syntax node**: P2 first builds it as a
# `Class`, then P14 — once it is confirmed to be attached to a route — changes its kind to
# `Middleware` (changing identity, not creating a node; otherwise the same code would appear twice
# in the graph). So in the route perspective it shows up directly as a **first-ring neighbour**.
#
# Node kinds **not** listed in `node_views` do not switch the top filter, they only open the
# Inspector on the right — asset / structural nodes such as ConfigKey / KeyPattern / Component /
# SecretLocation have no "single link" semantics.
#
# Filtering by side:
#   side: backend — the node must be **owned** by the backend (`$.side == "backend"`).
#
# `side` is one scalar per node: a node belongs to exactly one sub-project, so exactly one party declares it and
# there is nothing to accumulate. It used to be a `sides` set with a derived `bridge` label, because one node
# could carry several parties' evidence (a contract bridge merged the front end's and the back end's writes onto
# one node) and the label must never depend on which rule happened to run last. Sharing is gone — the two parties
# build their own nodes, joined by a `ResolvesTo` edge — so the set had nothing left to express and was removed.
# Nodes with no side evidence at all match no party, as before.

perspectives:
  # ---------------- object perspectives (single link) ----------------
  - id: route
    label: Route perspective
    mode: object
    node_kind: HttpContract
    # Two sub-projects naming the same endpoint build two nodes now, so without a side filter the dropdown would
    # list the same `POST /api/x` twice (once per owner). This perspective is the **backend's** declaration; the
    # front end's own contracts have their own perspective below, which is also where a call with no matching
    # route ("phantom call") shows up instead of being hidden.
    side: backend
    # After folding the syntax layer, the graph handed to the layout for the route view is an
    # **approximate star** (almost every edge touches the centre; only a few inter-table ForeignKeys
    # are leaf-to-leaf edges) — for a star, top-down layering has no advantage: the
    # "contract → table/cache" edges would have to pass straight through the middleware row
    # (observed in screenshots). The radial entry point adapts to the graph shape: a star takes
    # hub-and-spoke (0 crossings, 0 node penetrations), a genuine multi-layer link takes concentric
    # rings. The schedule perspective keeps layered, because that is a real execution chain.
    layout: radial
    # Why 4 and not 2: the view **renders semantic nodes only**, and the whole intermediate syntax
    # layer (Controller / Services / Dao / Model) is folded. In a four-layer architecture
    # (a real project: Controller → Services → Dao → Model → Table) the first table only appears at hop 4, so
    # with depth=2 the route perspective is almost empty — measured on 60 sampled contracts,
    # "no semantic neighbour at all" drops from 43/60 to 28/60 (depth=5 gives 26/60, then saturates).
    depth: 4
    collapsed_kinds: [Method, Function, CallSite, Property, Const, Namespace, File, Directory, Interface, Trait, Class, HttpContract]
    description: One HTTP contract at the centre — who handles it, who calls it, which tables it reads and writes

  # The front end's half of the bridge: the contract **it** synthesises from `axios.get('/api/x')` /
  # `request.get('/api/x')`. Same kind, other owner — hence its own perspective, exactly like the backend/frontend
  # split for cache and events.
  #
  # What makes it worth a perspective of its own rather than a filter hiding it: a front-end contract with **no**
  # `ResolvesTo` edge is a call to an endpoint this repository does not declare (a phantom call / a typo / a
  # third-party API), and a backend contract with none is a dead endpoint. Both are only visible if each side's
  # nodes are listed somewhere.
  - id: frontend_call
    label: Front-end call perspective
    mode: object
    node_kind: HttpContract
    side: frontend
    layout: radial
    depth: 3
    collapsed_kinds: [Method, Function, CallSite, Property, Const, Namespace, File, Directory, Interface, Trait, Class, HttpContract]
    description: One endpoint as the front end calls it — which call sites reach it, and whether it resolves to a backend route

  - id: table
    label: Table perspective
    mode: object
    node_kind: Table
    layout: radial
    depth: 2
    description: Inbound edges converging on one table — who reads and writes it, PII and criticality

  - id: event
    label: Event perspective
    mode: object
    node_kind: Event
    # Backend domain events only (`side=backend`): `Event::dispatch` / `Event::listen`, etc.
    # Front-end inter-component event buses (uni-app `uni.$emit`) synthesize `EventBus` nodes and were
    # split out into the "front-end events" perspective instead of being mixed in here (same shape as
    # the front-end / back-end split for cache).
    side: backend
    layout: radial
    depth: 2
    description: Backend events — who publishes, who listens (Event::dispatch/listen, node kind Event, side=backend)

  - id: event_bus
    label: Front-end events
    mode: object
    node_kind: EventBus
    # Front-end inter-component event buses only (`side=frontend`): `uni.$emit` / `bus.$emit` / `$eventHub.$emit`.
    side: frontend
    layout: radial
    depth: 2
    description: Front-end event bus — who emits, who listens (uni.$emit/bus.$emit, node kind EventBus, side=frontend)

  - id: queue
    label: Queue perspective
    mode: object
    node_kind: Queue
    layout: radial
    depth: 2
    description: Message queues — who publishes, who consumes (node kind Queue)

  - id: cache
    label: Cache perspective
    mode: object
    node_kind: Cache
    # Backend caches only (`side=backend`): `Cache::*` / `Redis::*` / `*CacheService::*`.
    # Front-end local storage belongs to the "local storage" perspective and is not mixed in here.
    side: backend
    layout: radial
    depth: 2
    description: Backend cache — who reads, who writes (Cache::/Redis::/*CacheService::, node kind Cache, side=backend)

  - id: local_storage
    label: Local storage
    mode: object
    node_kind: Cache
    # Front-end local storage only (`side=frontend`): `uni.getStorageSync` / `localStorage`.
    side: frontend
    layout: radial
    depth: 2
    description: Front-end local storage — who reads, who writes (uni.setStorageSync/localStorage, node kind Cache, side=frontend)

  - id: schedule
    label: Scheduled tasks
    mode: object
    node_kind: Schedule
    # A scheduled task is "one execution chain"; a top-down layer = hops expresses the execution flow
    # better than a radial layout.
    layout: layered
    # Same reasoning as the route perspective: a scheduled task is likewise an
    # "entry → controller → service → dao → table" call flow, and after folding the syntax layer it
    # takes 4 hops to reach the semantic resources.
    depth: 4
    description: Execution chain of scheduled tasks (Schedule nodes are synthesized by project-level FKB, e.g. crontab routes)

  - id: topic
    label: Message topic
    mode: object
    node_kind: Topic
    layout: radial
    depth: 2
    description: Producers and consumers of a message topic (node kind Topic)

  # Middleware: the same shape as the "table perspective" — one centre plus a ring of "who passed through it".
  # The table perspective asks "who reads and writes this table"; the middleware perspective asks
  # "which endpoints pass this guard".
  #
  # `depth` is deliberately **1** and not 2: one auth middleware often guards hundreds of endpoints
  # (a project's AllowOriginMiddleware guards 280), and expanding one more hop would pull in every table /
  # config touched by the endpoints it guards — that is not "who does this middleware guard", it is the
  # whole graph. To see what resources a given endpoint touches afterwards, click the endpoint and
  # switch to the route perspective.
  - id: middleware
    label: Middleware perspective
    mode: object
    node_kind: Middleware
    layout: radial
    depth: 1
    collapsed_kinds: [Method, Function, CallSite, Property, Const, Namespace, File, Directory, Interface, Trait, Class]
    description: One middleware at the centre — which endpoints it guards (for the resources an endpoint touches afterwards, click the endpoint and switch to the route perspective)

  # ---------------- the perspectives below are not implemented in the MVP; commented out for now ----------------
  # - id: page
  #   label: Page perspective
  #   mode: object
  #   node_kind: Page
  #   layout: radial
  #   depth: 2
  #   description: Call chains started by a front-end page (the pipeline does not produce Page nodes yet)
  #
  # - id: domain
  #   label: Domain aggregate
  #   mode: aggregate
  #   layout: compound
  #   group_by: { property: domain }
  #   description: Boxed overview grouped by business domain (gives an honest hint when the graph has no domain property yet)
  #
  # - id: deploy_unit
  #   label: Deployment unit
  #   mode: aggregate
  #   layout: compound
  #   group_by: sub_project
  #   description: Boxed overview grouped by sub-project (deployment unit)
  #
  # - id: platform
  #   label: Multi-end comparison
  #   mode: aggregate
  #   layout: matrix
  #   row_from: sub_project
  #   col_from: node_kind
  #   description: Sub-project x node-kind matrix — which sub-project produces which kind of asset
  #
  # - id: er
  #   label: Table relations / ER
  #   mode: aggregate
  #   layout: er
  #   group_by: node_kind
  #   description: Orthogonal relation view between tables

# Which perspective to switch to when a node is clicked.
# Only kinds that "have a matching perspective in the top filter" are listed here.
node_views:
  HttpContract: route
  Table: table
  # Out-of-process mediators are each their own kind and switch directly to the matching concrete
  # perspective.
  Cache: cache
  Event: event
  EventBus: event_bus
  Queue: queue
  Schedule: schedule
  Topic: topic
  Middleware: middleware
  # Not supported in the MVP: Page / Domain / DeployUnit / Platform are not in the mapping.
