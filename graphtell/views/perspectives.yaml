# 点击节点时切换到哪个视角。
# 只有"在顶部筛选器中有对应视角"的种类才列在这里。
node_views:
  HttpContract: route
  Table: table
  # 进程外中介各自是独立种类，直接切到对应具体视角（不再有"外部系统"伞）。
  Cache: cache
  Event: event
  EventBus: event_bus
  Queue: queue
  Schedule: schedule
  Topic: topic
  # MVP 暂不支持：Page / Domain / DeployUnit / Platform 不入映射。
