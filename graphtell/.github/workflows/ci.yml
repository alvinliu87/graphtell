name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        # `src-tauri` is a separate workspace and intentionally excluded.
        run: cargo test --workspace --no-fail-fast

  test-frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  build-docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # If tests fail, don't waste time building the image; the needed artifacts (frontend/backend) were already verified by the two jobs above.
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # By default (PR / push to main) build the "lexical-only" image (--no-default-features):
      # quickly validate the whole Dockerfile chain (frontend build + backend compile + SPA same-origin wiring),
      # without waiting for candle to recompile. On a v* tag it switches to the default features and builds the full semantic image (with real bge-m3 vectors).
      - name: Decide features
        id: feat
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "gt_features=" >> "$GITHUB_OUTPUT"
          else
            echo "gt_features=--no-default-features" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: graphtell:ci
          build-args: |
            GT_FEATURES=${{ steps.feat.outputs.gt_features }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
