name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        # `src-tauri` is a separate workspace and intentionally excluded.
        run: cargo test --workspace --no-fail-fast

  test-frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  build-docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 测试挂了就不浪费时间构建镜像；所需产物（前端/后端）已由上面两个 job 验证。
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 默认（PR / push 到 main）构建「仅词面」镜像（--no-default-features）：
      # 快速验证 Dockerfile 全链路（前端构建 + 后端编译 + SPA 同源托管接线），
      # 不必等 candle 重编译。打 v* tag 时改为默认 feature，构建完整语义镜像（含真实 bge-m3 向量）。
      - name: Decide features
        id: feat
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "gt_features=" >> "$GITHUB_OUTPUT"
          else
            echo "gt_features=--no-default-features" >> "$GITHUB_OUTPUT"
          fi
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: graphtell:ci
          build-args: |
            GT_FEATURES=${{ steps.feat.outputs.gt_features }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
