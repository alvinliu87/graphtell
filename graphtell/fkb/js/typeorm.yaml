# TypeORM framework knowledge (Node / TypeScript)
#
# Precondition: the JS/TS parser turns a decorator (`@Entity('user')`) into a call site whose callee carries the
# `@` prefix and whose owner is precise to the decorated entity class. This file materialises ORM entities as `Table`
# nodes on that basis.
#
# Relationship to the NestJS FKB: this file only recognises the `typeorm` dependency; a NestJS project using TypeORM
# hits both (route contracts + entity mapping) with no conflict.

id: typeorm
display_name: TypeORM
language: javascript
version_hint: "0.3.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: "typeorm"
    confidence: 0.95

exclude_globs:
  - "**/node_modules/**"
  - "**/dist/**"

# ★ `semantic_kinds: [Column]` / `semantic_edge_kinds: [HasColumn]` are **deliberately not declared** here.
#
# Columns are on the order of "tables x columns" (a few dozen tables x a dozen columns = several hundred nodes):
# once they count as semantic nodes the folded view bursts and they eat the 400-node budget of the reachable
# semantic-node statistic; and `HasColumn` is a **composition relation**, not a resource dependency, so counting it
# as a semantic edge would inflate a table's "N semantic out-edges".
# So both stay non-semantic: column nodes are still built, edges still connected, and impact can still be drilled down
# to field level — they are just **not drawn by default**.
#
# More importantly, **declaring it here could not be scoped to this framework anyway**: `register_semantic_kinds`
# registers unconditionally for every FKB inside `load_dir` (language filtering only happens when selecting rules),
# so if any FKB declares `Column` semantic, columns become semantic in **every project** (including PHP ones).
# Distinguishing by language would first require changing the loading logic to register per language.
#
# `ForeignKey` (table -> table) has `Table` (semantic nodes) at both ends and is a real business-resource dependency,
# so it is declared as a semantic edge.
#
# Side note: `gt-app validate` warns for `Column` that "the node kind is not in the kernel list and the folded view
# will hide it" — **that warning is expected** and is exactly the effect intended above (columns are not drawn by
# default). Do not declare Column semantic just to silence it.
semantic_edge_kinds: [ForeignKey]
# `References` (entity -> entity) has **code nodes** (`Class`) at both ends, not a "both-ends-semantic" business
# resource dependency, so it is declared as a **bridge edge** — isomorphic to FastAPI's `DependsOn`: it can be walked
# along the chain for impact analysis, but is not counted in "N semantic in-edges" and is not a canvas edge, so entity
# classes do not leak into the folding semantics.
bridge_edge_kinds: [References]

rules:
  # ===== P5 Synthesize: entity -> table =====
  # `@Entity('user')` — the table name comes from the first argument (a string literal); `@Entity()` with no argument
  # and the object form `@Entity({ name: 'user' })` have no literal path, so they are skipped ("better missing than guessed").
  # Model class -> table (`MapsTo`, isomorphic to Spring's `@TableName` and SQLAlchemy's declarative mapping).
  - id: typeorm-entity
    phase: Synthesize
    selector:
      kind: call
      callee: "@Entity"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
                - singularize
          link:
            kind: MapsTo
            direction: incoming
            # The decorated entity class (a JS class FQN = the class name)
            to: { owner_class: true, resolve: class_const }
          confidence: 0.85

  # ===== P5 Synthesize: entity field -> table column =====
  # `@Column() body: string` / `@PrimaryGeneratedColumn() id` — a field is a column.
  # It materialises as a `Column` node, and the entity class points at it via `HasColumn` (the entity class already
  # `MapsTo` -> `Table`, so "table -> column" is two hops: table <-MapsTo- entity -HasColumn-> column, and field-level
  # impact can be followed step by step).
  #
  # Identity is `entity class.field` (`owner_class.owner_member`): same-named columns (`id` / `created`) in different
  # entities must count separately, otherwise they would be merged idempotently into a wrong node — hence the entity
  # scope rather than a bare field name.
  # Only **column** decorators are collected; `@ManyToOne` / `@OneToMany` / `@JoinColumn` are **relations** (foreign
  # keys) and are modelled separately by `typeorm-relation` below (so a relation is not mistaken for a column).
  - id: typeorm-column
    phase: Synthesize
    selector:
      kind: call
      callee: "@Column|@PrimaryGeneratedColumn|@CreateDateColumn|@UpdateDateColumn|@DeleteDateColumn"
    binding:
      - Synthesize:
          node: Column
          identity:
            kind: Named
            value:
              path: [{ owner_class: true }, { owner_member: true }]
              join: "."
          link:
            kind: HasColumn
            direction: incoming
            to: { owner_class: true, resolve: class_const }
          confidence: 0.8

  # ===== P5 Synthesize: entity relations (foreign-key holder) =====
  # `@ManyToOne(type => ArticleEntity, …) article: ArticleEntity` — Comment references Article.
  #
  # The target entity is **not** taken from the decorator argument: `type => ArticleEntity` is an arrow function that
  # the parser judges `Unknown` (no literal can be extracted). What is used is the **field type annotation**
  # (`article: ArticleEntity`) — the parser already filled it into `entity` on that field's decorator call site, so
  # this uses the same mechanism as NestJS dependency injection: `{ entity: true }` links straight to the target
  # entity class, creating no new node.
  #
  # **Only the holder side is built** (`ManyToOne` / `ManyToMany` / `OneToOne`): `@OneToMany` is the reverse
  # declaration and describes the same relation as its paired `@ManyToOne`, so building another edge would be a
  # redundant reverse edge (in the real sample `Article.comments` and `Comment.article` are exactly such a pair).
  # Honest gap: a one-directional `@OneToMany` (with no paired ManyToOne) therefore produces no edge.
  - id: typeorm-relation
    phase: Synthesize
    selector:
      kind: call
      callee: "@ManyToOne|@ManyToMany|@OneToOne"
    binding:
      - Link:
          kind: References
          # Referencing side: the entity class declaring the relation
          from: { owner_class: true, resolve: class_const }
          # Referenced side: the field type (the target entity class)
          to: { entity: true, resolve: class_const }
          confidence: 0.75

  # ===== P6 AnnotatePost: project entity relations into **table-level foreign keys** =====
  # The rule above builds "entity class -> entity class"; from the table perspective you want to see "table -> table"
  # foreign keys directly, so dead-table / impact analysis need not detour through entity classes every time.
  #
  # `Project` = walk every `along` out-edge of the matched node, follow each end along its own edge-kind chain to a
  # landing point, and build an edge between the two landing points. Here both ends walk one `MapsTo` hop
  # (entity -> table), so `References` (Comment -> ArticleEntity) is projected into `ForeignKey` (comment -> article).
  #
  # **One-to-many**: an entity with N `@ManyToOne` produces N foreign-key edges — exactly what `Link` cannot do
  # (it can only take one name per end, and with several relations it would silently build just one).
  # If a landing point cannot be reached it is skipped: an entity with a no-argument `@Entity()` has no `Table`
  # (`Comment` in the real sample), so its foreign key is not added — better missing than guessed.
  - id: typeorm-foreign-key
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Class
    binding:
      - Project:
          kind: ForeignKey
          along: References
          from: [MapsTo]
          to: [MapsTo]
          confidence: 0.7
