# Front-end (JS / TS / Vue / React …) language-common knowledge (cross-framework, not tied to one framework)
#
# Design: this FKB declares `apply_without_detection: true`, so **its rules apply to sub-projects of the same
# language whether the project is detected as uni-app / Vue / React / another front-end framework** — semantics
# shared across frameworks (HTTP calls, local storage, config, i18n) are written once, and adding a front-end
# framework needs no copy-paste.
#
# Division of labour with `fkb/js/uni-app.yaml`:
#   * this file holds spellings **common across front-end frameworks** (axios / fetch / localStorage / i18n / config);
#   * `uni-app.yaml` holds only **uni-app-specific** spellings (`uni.request`, `uni.setStorageSync`,
#     `$store`, `pages.json`, `uni.navigateTo`, `uni.$emit` …), so uni-app knowledge is never used to explain
#     a Vue / React project.
#
# How the member-call form avoids misfiring on same-shaped different things like `cache.get()` / `$store.get()`:
# ① the parser normalises a call site into `{ url, method }` arguments only when the receiver is a member of the
#    HTTP-client allowlist; ② here it is narrowed once more by requiring `X::{get,post,...}`.
# An ordinary getter has no `{ url, method }` at gate ① and never reaches synthesis — both gates are in play.

id: frontend-js-common
display_name: Front-end JS common
language: javascript
version_hint: "*"
side: frontend
# No detectors declared: this file is not "a detected framework", just a common layer effective for every JS front-end project.
apply_without_detection: true

rules:
  # ===== P5 Synthesize: HttpContract (cross-framework common HTTP clients) =====
  # Covers de-facto standard spellings such as axios / fetch / request / http.request, plus common wrapper shapes
  # (`request::{...}`, `http::{...}`, `$http::`, `ajax::`, `api::`, `apiClient::`, `httpClient::`).
  # uni-app's own `uni.request` is in `uni-app.yaml`.
  - id: http-contract
    phase: Synthesize
    selector:
      kind: call
      # First half = object form / bare call; second half = member form (`request::{get,post,...}` …)
      callee: "request|http.request|axios|fetch|\
        request::{get,post,put,delete,patch,head,options}|\
        http::{get,post,put,delete,patch,head,options}|\
        $http::{get,post,put,delete,patch,head,options}|\
        ajax::{get,post,put,delete,patch,head,options}|\
        api::{get,post,put,delete,patch,head,options}|\
        apiClient::{get,post,put,delete,patch,head,options}|\
        httpClient::{get,post,put,delete,patch,head,options}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              arg: 0
              field: "method"
              default: "GET"
              normalize: [upper]
            path:
              arg: 0
              field: "url"
              # When the URL is a variable or its first segment is dynamic (`BASE + '/api/' + url`) the parser yields
              # Unknown, which must be rejected here — otherwise junk contracts like `GET /<dynamic-url>` would be
              # synthesized and pollute the route perspective.
              # Concatenated (`'x/' + id`) and template-string forms are not dynamic: their shape is statically
              # determined, and non-literal segments have already been folded into `:param` placeholders.
              require_literal: true
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                # The parameter name does not matter, the shape does: `/:param` ≡ the backend's `/:id`
                - param_wildcard
          link: { kind: CallsHttp, direction: incoming }
          confidence: 0.9

  # ===== P5 Synthesize: Cache (web-standard local storage, cross-framework common) =====
  # `localStorage` / `sessionStorage` are web standards, common to React / Vue / vanilla JS.
  # uni-app's own `uni.setStorageSync` is in `uni-app.yaml`.
  - id: cache-read
    phase: Synthesize
    selector:
      kind: call
      callee: "localStorage::{getItem}|sessionStorage::{getItem}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: ReadsCache, direction: incoming }
          confidence: 0.85

  - id: cache-write
    phase: Synthesize
    selector:
      kind: call
      # `removeItem` is also a write (deleting = writing), so it is folded into this rule.
      callee: "localStorage::{setItem,removeItem}|sessionStorage::{setItem,removeItem}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: ConfigKey (front-end config, cross-framework common) =====
  # Declarative config entries in `*/config/*.js`, isomorphic to the backend's `config/*.php`.
  - id: config-key
    phase: Synthesize
    selector:
      kind: config_entry
      file: "*/config/*.js"
      key_path: "*"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { key_path: true }
          fields:
            - name: value
              value: { entry_value: true }
          confidence: 0.8

  # ===== P5 Synthesize: I18nKey (localised copy, cross-framework common) =====
  # `i18n.t('k')` / `this.$t('k')`: the same kind as the I18nKey synthesized from the backend's `lang/*.php`,
  # and with the same identity front-end and back-end copy converge onto one node.
  - id: i18n-key
    phase: Synthesize
    selector:
      kind: call
      callee: "i18n::{t}|*::{$t,*t}"
    binding:
      - Synthesize:
          node: I18nKey
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          confidence: 0.85

  # Front-end contract call marker: annotate contracts that really have a `CallsHttp` in-edge
  # with `frontend.called`.
  #
  # The criterion **must be the edge, not the `side` property**: a bridge contract is synthesised by
  # **both** sides onto the same node, so its `side` property is decided by whoever patches last and is no
  # longer "the side" (it becomes `bridge` as soon as more than one party has evidence on it — see the
  # derived `sides` set in `engine.rs`). The edge is the only honest witness of "the front end really calls
  # this", which is also why `has_incoming` was added to the selector predicate vocabulary (`Predicate`).
  - id: mark-called
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: HttpContract
      where:
        - has_incoming: CallsHttp
    binding:
      - Annotate:
          phase: Post
          channel: FkbMark
          target: matched
          annotations:
            - kind: frontend.called
              confidence: 0.9
          merge: Coexist
