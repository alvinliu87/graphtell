# Front-end (JS / TS / Vue / React …) language-common knowledge (cross-framework, not tied to one framework)
#
# Design: this FKB declares `apply_without_detection: true`, so **its rules apply to sub-projects of the same
# language whether the project is detected as uni-app / Vue / React / another front-end framework** — semantics
# shared across frameworks (HTTP calls, local storage, config, i18n) are written once, and adding a front-end
# framework needs no copy-paste.
#
# Division of labour with `fkb/js/uni-app.yaml`:
#   * this file holds spellings **common across front-end frameworks** (axios / fetch / localStorage / i18n / config);
#   * `uni-app.yaml` holds only **uni-app-specific** spellings (`uni.request`, `uni.setStorageSync`,
#     `$store`, `pages.json`, `uni.navigateTo`, `uni.$emit` …), so uni-app knowledge is never used to explain
#     a Vue / React project.
#
# How the member-call form avoids misfiring on same-shaped different things like `cache.get()` / `$store.get()`:
# ① the parser normalises a call site into `{ url, method }` arguments only when the receiver is a member of the
#    HTTP-client allowlist; ② here it is narrowed once more by requiring `X::{get,post,...}`.
# An ordinary getter has no `{ url, method }` at gate ① and never reaches synthesis — both gates are in play.

id: frontend-js-common
display_name: Front-end JS common
language: javascript
version_hint: "*"
side: frontend
# `ResolvesToContract` is this file's own semantic edge: the bridge between two sub-projects' contract nodes.
# It is declared here rather than in the kernel's `EdgeKind::SEMANTIC` because it is front-end knowledge (only
# the front end's `http-contract` rule produces it); declaring it makes it counted and drawn like `ReadsDb`,
# and keeps "adding a semantic edge costs no kernel change" true.
semantic_edge_kinds: [ResolvesToContract]
# No detectors declared: this file is not "a detected framework", just a common layer effective for every JS front-end project.
apply_without_detection: true

rules:
  # ===== P5 Synthesize: HttpContract (cross-framework common HTTP clients) =====
  # Covers de-facto standard spellings such as axios / fetch / request / http.request, plus common wrapper shapes
  # (`request::{...}`, `http::{...}`, `$http::`, `ajax::`, `api::`, `apiClient::`, `httpClient::`).
  # uni-app's own `uni.request` is in `uni-app.yaml`.
  - id: http-contract
    phase: Synthesize
    selector:
      kind: call
      # First half = object form / bare call; second half = member form (`request::{get,post,...}` …).
      # `axios::{...}` is the member form of the most common front-end client: the parser reports it as
      # receiver `axios` + method `post`, so without this alternative `axios.post('/api/x')` — the single
      # most frequent way a front end calls a backend — never became a contract (only `axios({...})` did).
      callee: "request|http.request|axios|fetch|\
        axios::{get,post,put,delete,patch,head,options}|\
        request::{get,post,put,delete,patch,head,options}|\
        http::{get,post,put,delete,patch,head,options}|\
        $http::{get,post,put,delete,patch,head,options}|\
        ajax::{get,post,put,delete,patch,head,options}|\
        api::{get,post,put,delete,patch,head,options}|\
        apiClient::{get,post,put,delete,patch,head,options}|\
        httpClient::{get,post,put,delete,patch,head,options}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              arg: 0
              field: "method"
              default: "GET"
              normalize: [upper]
            path:
              arg: 0
              field: "url"
              # When the URL is a variable or its first segment is dynamic (`BASE + '/api/' + url`) the parser yields
              # Unknown, which must be rejected here — otherwise junk contracts like `GET /<dynamic-url>` would be
              # synthesized and pollute the route perspective.
              # Concatenated (`'x/' + id`) and template-string forms are not dynamic: their shape is statically
              # determined, and non-literal segments have already been folded into `:param` placeholders.
              require_literal: true
              # A URL carrying a scheme names a **third-party** endpoint (`fetch('https://api.paypal.com/...')`),
              # not one this repository declares. It is still a literal, so `require_literal` lets it through —
              # without this guard the pipeline invents contracts no route serves, and those pollute the route
              # list and the recall ranking.
              reject_contains: ["://"]
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                # The parameter name does not matter, the shape does: `/:param` ≡ the backend's `/:id`
                - param_wildcard
          link: { kind: CallsHttp, direction: incoming }
          # The contract this sub-project builds is **owned by this sub-project**; the back end's route
          # declaration is a different node. "This call resolves to that route" is therefore an edge, not a
          # merge — the kernel links to the same `METHOD /path` owned by another sub-project (falling back to
          # the method-agnostic `ANY` / `RULE` spelling when only an auto-route declares the path).
          bridge: { kind: ResolvesToContract, confidence: 0.9 }
          confidence: 0.9

  # ===== P5 Synthesize: Cache (web-standard local storage, cross-framework common) =====
  # `localStorage` / `sessionStorage` are web standards, common to React / Vue / vanilla JS.
  # uni-app's own `uni.setStorageSync` is in `uni-app.yaml`.
  - id: cache-read
    phase: Synthesize
    selector:
      kind: call
      callee: "localStorage::{getItem}|sessionStorage::{getItem}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: ReadsCache, direction: incoming }
          confidence: 0.85

  - id: cache-write
    phase: Synthesize
    selector:
      kind: call
      # `removeItem` is also a write (deleting = writing), so it is folded into this rule.
      callee: "localStorage::{setItem,removeItem}|sessionStorage::{setItem,removeItem}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: ConfigKey (front-end config, cross-framework common) =====
  # Declarative config entries in `*/config/*.js`, isomorphic to the backend's `config/*.php`.
  - id: config-key
    phase: Synthesize
    selector:
      kind: config_entry
      file: "*/config/*.js"
      key_path: "*"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { key_path: true }
          fields:
            - name: value
              value: { entry_value: true }
          confidence: 0.8

  # ===== P5 Synthesize: I18nKey (localised copy, cross-framework common) =====
  # `i18n.t('k')` / `this.$t('k')`: the same kind as the I18nKey synthesized from the backend's `lang/*.php`.
  # The two no longer converge: each sub-project owns the copy it declares, so "which locales exist" is answered
  # per party instead of as a union that hides a missing translation on one side.
  - id: i18n-key
    phase: Synthesize
    selector:
      kind: call
      callee: "i18n::{t}|*::{$t,*t}"
    binding:
      - Synthesize:
          node: I18nKey
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          confidence: 0.85

  # (`mark-called` used to live here. It is a **cross-sub-project** fact — "some other sub-project really
  # calls this endpoint" — and a per-sub-project rule can no longer see the other side's node, so it moved to
  # `fkb/universal/common.yaml`, which is loaded into every sub-project's rule set.)

# External-system call list (used by the "external call inside a loop" judgement, P12).
#
# One network round trip costs an order of magnitude more than one database query, so putting it inside a loop
# drags an endpoint down even more reliably than N+1. Matching: a call site matches if its full callee
# (`axios` / `fetch` / `http.request`) or its method name (`XMLHttpRequest`) hits any entry. We list the
# de-facto standard HTTP clients common across front-end frameworks (axios / fetch / node http); `uni.request`
# lives in `uni-app.yaml` as a uni-app-specific spelling.
external_calls:
  - "axios"
  - "fetch"
  - "request"
  - "http.request"
  - "https.request"
  - "XMLHttpRequest"
