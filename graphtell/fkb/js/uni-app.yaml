# Front-end uni-app-specific knowledge (multi-end projects such as CRMEB)
#
# Division of labour with `fkb/js/common.yaml` (the language-common layer):
#   * common.yaml holds spellings **common across front-end frameworks** (axios / fetch / localStorage /
#     i18n / config), applied to every JS sub-project (`apply_without_detection`);
#   * this file holds only **uni-app-specific** spellings: `uni.request`, `uni.setStorageSync`,
#     `$store`, `pages.json`, `uni.navigateTo`, `uni.$emit`, … so uni-app knowledge is never used to
#     explain a Vue / React project.
#
# Front-end and back-end sub-projects each build their own HttpContract nodes, and they merge on the
# **same identity** — that is the contract bridge pairing. Dead-endpoint / phantom-call detection then
# follows automatically:
#   * HandledBy but no CallsHttp = a dead backend endpoint (nobody calls it)
#   * CallsHttp but no HandledBy = a front-end phantom call (calling a route that does not exist)

id: frontend-js
display_name: Front-end JS/TS
language: javascript
version_hint: "*"
side: frontend

# **Semantic node kinds** introduced by this FKB (appended to the kernel's built-in list).
# `Store` (a Vuex / Pinia state container) sits at the same level as the backend's `Table` / `Cache`;
# `Page` is the route node declared by uni-app's `pages.json`, isomorphic to the backend's `Route`;
# `EventBus` is the inter-component event bus, isomorphic to the backend's `Event`.
semantic_kinds: [Store, Page, EventBus]

detectors:
  # uni-app / CRMEB-style multi-end projects
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@dcloudio/uni-app"
    confidence: 0.95
  # Generic front-end projects (axios is the de-facto standard HTTP client)
  - kind: manifest_dependency
    manifest: package.json
    dependency: "axios"
    confidence: 0.9
  # Fallback: a package.json present means this is a JS front-end sub-project (backends are usually not JS)
  - kind: file_exists
    path: package.json
    confidence: 0.6

exclude_globs:
  - "unpackage/**"
  - "static/**"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".output/**"
  - ".nuxt/**"
  - ".next/**"

rules:
  # Common HTTP calls (axios / fetch / localStorage / i18n / config) were factored into
  # `fkb/js/common.yaml`. This file keeps only uni-app-specific spellings.

  # ===== P5 Synthesize: HttpContract (uni-app-specific `uni.request`) =====
  - id: http-uni
    phase: Synthesize
    selector:
      kind: call
      callee: "uni.request"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              arg: 0
              field: "method"
              default: "GET"
              normalize: [upper]
            path:
              arg: 0
              field: "url"
              require_literal: true
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                - param_wildcard
          link: { kind: CallsHttp, direction: incoming }
          confidence: 0.9

  # ===== P5 Synthesize: local storage (Cache, uni-app-specific spelling) =====
  # Isomorphic to the backend's `Cache::get('k')`. The web standards `localStorage` / `sessionStorage`
  # were factored into `fkb/js/common.yaml`; this only covers uni-app's `uni.getStorageSync`.
  # The only precondition is that the parser captures the argument (a non-literal yields Unknown, rejected by `require_literal`).
  # `frontend-uni-*` rather than `frontend-cache-*`: `js/common.yaml` already owns that id for
  # `localStorage` / `sessionStorage`, and the pipeline de-duplicates rules **by id, keeping the first** —
  # so sharing the id silently dropped whichever of the two lost, leaving a uni-app project with only one
  # of its two cache spellings recognised.
  - id: uni-cache-read
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{getStorageSync,getStorage}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: ReadsCache, direction: incoming }
          confidence: 0.85

  - id: uni-cache-write
    phase: Synthesize
    selector:
      kind: call
      # `removeStorageSync` is also a write (deleting = writing), so it is folded into this rule.
      callee: "uni::{setStorageSync,setStorage,removeStorageSync}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: Store (the Vuex / Pinia state container, uni-app-specific `$store`) =====
  # `$store.commit('menus/set')` / `$store.dispatch('routesList')` -> `Store` node.
  # `Store` is a **new semantic kind declared by this FKB** (see `semantic_kinds` at the top of the file).
  - id: store-mutation
    phase: Synthesize
    selector:
      kind: call
      callee: "$store::{commit,dispatch}|store::{commit,dispatch}|this.$store::{commit,dispatch}"
    binding:
      - Synthesize:
          node: Store
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: kind
              value: { method_name: true }
          link: { kind: Mutates, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: Page (uni-app route node, from `pages.json`) =====
  # `pages.json` is already collected by the JSON parser as **config entries** (only the `pages` /
  # `subPackages.*.pages` segments; the rest of the JSON does not pollute), so a `kind: config_entry`
  # selector works for front-end routes too — isomorphic to the `HttpContract` synthesized from the
  # backend's `Route::get(...)`. In the route perspective front-end and back-end
  # "page <-> endpoint" can then be compared directly.
  - id: page
    phase: Synthesize
    selector:
      kind: config_entry
      file: "*/pages.json"
      # Through the JSON parser, `pages.json` produces **only** page route entries (main package `pages.*` and
      # sub-package `subPackages.*.pages.*`); other JSON produces no config entries, so `*` is sufficient
      # and cannot misfire — no `|` alternation is needed in `key_path`.
      key_path: "*"
    binding:
      - Synthesize:
          node: Page
          identity:
            kind: Named
            value: { entry_value: true }
          confidence: 0.9

  # ===== P5 Synthesize: front-end page navigation (NavigatesTo edge, uni-app-specific) =====
  # `uni.navigateTo({ url })` / `redirectTo` / `reLaunch` / `switchTab`: from the initiator
  # (a function / component method) to the target `Page` node
  - id: navigate
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{navigateTo,redirectTo,reLaunch,switchTab}|uni.navigateToMiniProgram"
    binding:
      - Synthesize:
          node: Page
          identity:
            kind: Named
            value:
              arg: 0
              field: "url"
              require_literal: true
            normalize:
              - leading_slash
              - strip_query
          link: { kind: NavigatesTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: EventBus (front-end inter-component event bus, uni-app-specific) =====
  # `uni.$emit('evt')` / `bus.$emit('evt')` / `this.$eventHub.$emit('evt')` and
  # `uni.$on('evt')` / `bus.$on('evt')`: the backbone of decoupled component communication in uni-app /
  # Vue2, isomorphic to the backend's `Event::dispatch`. The event name is the identity, so emitters and
  # listeners of the same event name merge idempotently into one `EventBus` node — in the folded view the
  # event node acts as a "via" bridge and lights up both "who emits" and "who listens"
  # (component interaction finally becomes visible).
  - id: emit
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::$emit|bus::$emit|this::$eventHub::$emit|this::bus::$emit"
    binding:
      - Synthesize:
          node: EventBus
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
          link: { kind: Emits, direction: incoming }
          confidence: 0.8

  - id: listen
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{$on,$once}|bus::{$on,$once}|this::$eventHub::{$on,$once}|this::bus::{$on,$once}"
    binding:
      - Synthesize:
          node: EventBus
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.8
