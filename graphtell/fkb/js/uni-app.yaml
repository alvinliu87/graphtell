# 前端 uni-app 专属知识（CRMEB 等多端工程）
#
# 与 `fkb/js/common.yaml`（语言通用层）的分工：
#   * common.yaml 放**跨前端框架通用**的写法（axios / fetch / localStorage /
#     i18n / 配置），对所有 JS 子工程生效（`apply_without_detection`）；
#   * 本文件只放 **uni-app 专属** 的写法：`uni.request`、`uni.setStorageSync`、
#     `$store`、`pages.json`、`uni.navigateTo`、`uni.$emit` ……避免用 uni-app 知识
#     解释 Vue / React 工程。
#
# 前端子工程与后端子工程各自建出 HttpContract 节点，靠**同一个 identity** 合并
# —— 这就是契约桥配对。死端点 / 幽灵调用检测由此自动成立：
#   * 有 HandledBy 无 CallsHttp = 后端死端点（没人调）
#   * 有 CallsHttp 无 HandledBy = 前端幽灵调用（调了个不存在的路由）

id: frontend-js
display_name: 前端 JS/TS
language: javascript
version_hint: "*"

# 本 FKB 引入的**语义节点种类**（在内核内置清单之外追加）。
# `Store`（Vuex / Pinia 状态容器）与后端 `Table` / `Cache` 同级；`Page` 是
# uni-app `pages.json` 声明的路由节点，与后端 `Route` 同构；`EventBus` 是组件间
# 事件总线，与后端 `Event` 同构。
semantic_kinds: [Store, Page, EventBus]

detectors:
  # uni-app / CRMEB 类多端工程
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@dcloudio/uni-app"
    confidence: 0.95
  # 通用前端工程（axios 是 HTTP 客户端的事实标准）
  - kind: manifest_dependency
    manifest: package.json
    dependency: "axios"
    confidence: 0.9
  # 退路：存在 package.json 即视为 JS 前端子工程（后端通常不是 JS）
  - kind: file_exists
    path: package.json
    confidence: 0.6

exclude_globs:
  - "unpackage/**"
  - "static/**"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".output/**"
  - ".nuxt/**"
  - ".next/**"

rules:
  # 通用 HTTP 调用（axios / fetch / localStorage / i18n / config）已抽到
  # `fkb/js/common.yaml`。本文件只保留 uni-app 专属写法。

  # ===== P5 Synthesize：HttpContract（uni-app 专属写法 `uni.request`）=====
  - id: frontend-http-uni
    phase: Synthesize
    selector:
      kind: call
      callee: "uni.request"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              arg: 0
              field: "method"
              default: "GET"
              normalize: [upper]
            path:
              arg: 0
              field: "url"
              require_literal: true
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                - param_wildcard
          fields:
            - name: side
              value: { literal: "frontend" }
          link: { kind: CallsHttp, direction: incoming }
          confidence: 0.9

  # ===== P5 Synthesize：本地存储（Cache，uni-app 专属写法）=====
  # 与后端 `Cache::get('k')` 同构。Web 标准 `localStorage` / `sessionStorage`
  # 已抽到 `fkb/js/common.yaml`；此处只覆盖 uni-app 的 `uni.getStorageSync`。
  # 前提只是解析器把实参采上来（非字面量给 Unknown，由 `require_literal` 拒收）。
  - id: frontend-cache-read
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{getStorageSync,getStorage}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
            - name: side
              value: { literal: "frontend" }
          link: { kind: ReadsCache, direction: incoming }
          confidence: 0.85

  - id: frontend-cache-write
    phase: Synthesize
    selector:
      kind: call
      # `removeStorageSync` 也是写操作（删除 = 写），故并入本条。
      callee: "uni::{setStorageSync,setStorage,removeStorageSync}"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
            - name: side
              value: { literal: "frontend" }
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：Store（Vuex / Pinia 状态容器，uni-app 专属 `$store`）=====
  # `$store.commit('menus/set')` / `$store.dispatch('routesList')` → `Store` 节点。
  # `Store` 是**本 FKB 声明的新语义种类**（见文件头 `semantic_kinds`）。
  - id: frontend-store-mutation
    phase: Synthesize
    selector:
      kind: call
      callee: "$store::{commit,dispatch}|store::{commit,dispatch}|this.$store::{commit,dispatch}"
    binding:
      - Synthesize:
          node: Store
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: kind
              value: { method_name: true }
            - name: side
              value: { literal: "frontend" }
          link: { kind: Mutates, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：Page（uni-app 路由节点，来自 `pages.json`）=====
  # `pages.json` 已被 JSON 解析器采成 `配置条目`（仅 `pages` / `subPackages.*.pages`
  # 段，其余 JSON 不污染），于是 `kind: config_entry` 选择器对前端路由同样可用 ——
  # 与后端 `Route::get(...)` 合成的 `HttpContract` 同构。路由视角里前后端
  # 「页面 ↔ 接口」直接对看。
  - id: frontend-page
    phase: Synthesize
    selector:
      kind: config_entry
      file: "*/pages.json"
      # `pages.json` 经 JSON 解析器**只**产出页面路由条目（主包 `pages.*` 与
      # 子包 `subPackages.*.pages.*`），其它 JSON 不产出配置条目，故 `*` 即足够、
      # 且不会误伤——无需在 `key_path` 里写 `|` 多选。
      key_path: "*"
    binding:
      - Synthesize:
          node: Page
          identity:
            kind: Named
            value: { entry_value: true }
          fields:
            - name: side
              value: { literal: "frontend" }
          confidence: 0.9

  # ===== P5 Synthesize：前端页面跳转（NavigatesTo 边，uni-app 专属）=====
  # `uni.navigateTo({ url })` / `redirectTo` / `reLaunch` / `switchTab`：从发起方
  # （函数 / 组件方法）指向目标 `Page` 节点。URL 的查询串（`?id=1`）与分包前缀
  # 都按 `pages.json` 同一套身份归一（leading_slash / strip_query），保证跳转边
  # 精确连到 `frontend-page` 合成的同一个节点。
  - id: frontend-navigate
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{navigateTo,redirectTo,reLaunch,switchTab}|uni.navigateToMiniProgram"
    binding:
      - Synthesize:
          node: Page
          identity:
            kind: Named
            value:
              arg: 0
              field: "url"
              require_literal: true
            normalize:
              - leading_slash
              - strip_query
          fields:
            - name: side
              value: { literal: "frontend" }
          link: { kind: NavigatesTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：EventBus（前端组件间事件总线，uni-app 专属）=====
  # `uni.$emit('evt')` / `bus.$emit('evt')` / `this.$eventHub.$emit('evt')` 与
  # `uni.$on('evt')` / `bus.$on('evt')`：uni-app / Vue2 的组件解耦通信主干，
  # 与后端 `Event::dispatch` 同构。事件名即身份，同一事件名的发射方与监听方
  # 幂等合并到同一个 `EventBus` 节点——折叠视图里事件节点充当「via」桥，
  # 把「谁发 / 谁听」两边都亮出来（组件交互终于可见）。
  - id: frontend-emit
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::$emit|bus::$emit|this::$eventHub::$emit|this::bus::$emit"
    binding:
      - Synthesize:
          node: EventBus
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
          fields:
            - name: side
              value: { literal: "frontend" }
          link: { kind: Emits, direction: incoming }
          confidence: 0.8

  - id: frontend-listen
    phase: Synthesize
    selector:
      kind: call
      callee: "uni::{$on,$once}|bus::{$on,$once}|this::$eventHub::{$on,$once}|this::bus::{$on,$once}"
    binding:
      - Synthesize:
          node: EventBus
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
          fields:
            - name: side
              value: { literal: "frontend" }
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.8
