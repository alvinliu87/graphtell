# NestJS framework knowledge (Node / TypeScript)
#
# Precondition: the JS/TS parser gained **decorator -> call site** (the same mechanism as Java annotations /
# Python decorators). The owner of a method decorator (`@Get(':username')`) is precise to **the decorated method**,
# so `HandledBy` can be linked to the handler method itself, just like FastAPI / Spring.
#
# Relationship to the front-end FKB: this file only recognises `@nestjs/*` dependencies and cannot cross wires with
# uni-app's front-end rules.

id: nestjs
display_name: NestJS
language: javascript
version_hint: "9.x / 10.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@nestjs/core"
    confidence: 0.95

exclude_rules:
  - id: build-output
    glob: "dist/**"
  - id: coverage
    glob: "coverage/**"

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below (decorator model).
  - id: route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# NestJS uses **decorators**: routes are `@Get/@Post/...`, guards are `@UseGuards(JwtAuthGuard)`.
# The parser captures a decorator as a call whose callee carries the `@` prefix and whose owner is the decorated
# method (for a class-level decorator the owner is the class), so correlating by owner is enough; `include_class_level`
# makes an `@UseGuards` on a controller class apply to every route method of that class.
#
# The module-level "mount by path matching" style —
# `configure(consumer: MiddlewareConsumer){ consumer.apply(AuthMiddleware).forRoutes(...) }` — is covered by the
# `consumer` model in `guard_attach` below: `forRoutes` arguments support a **string** (`forRoutes('user')`) and an
# **object literal** (`{path: 'user', method: RequestMethod.GET}`); the latter lands on a concrete contract by
# (path, verb), and the verb dimension (`RequestMethod.*`) filters out other verbs on the same path. When a wildcard
# matches (`forRoutes('*')`) it is expanded by `scope` (default: "same directory as the module").
route_guards:
  route_calls:
    - receiver: "@Get"
      by: callee
      verb_methods: { "@get": GET }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Post"
      by: callee
      verb_methods: { "@post": POST }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Put"
      by: callee
      verb_methods: { "@put": PUT }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Delete"
      by: callee
      verb_methods: { "@delete": DELETE }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Patch"
      by: callee
      verb_methods: { "@patch": PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "@All"
      by: callee
      verb_methods: { "@all": ANY }
      path_arg: 0
      accept_identifier: true
  # NestJS has **two** mounting styles; both are declared (the kernel takes the union):
  guard_attach:
    - kind: decorator
      route_decorators: ["@Get", "@Post", "@Put", "@Delete", "@Patch", "@Head", "@Options", "@All"]
      guard_decorators: ["@UseGuards"]
      # JS / Python guards are often project-written decorators, so enumerating names is whack-a-mole —
      # declare instead "what kind of name counts as a guard" (a case-insensitive regex):
      guard_name_patterns:
        - "(login|logout|auth|jwt|token|session)"
        - "(permission|role|admin|staff|owner|superuser)"
        - "(guard|secure|required|only|protect|verify|check)"
      # deny wins: documentation decorators and parameter decorators are **not** guards (a measured source of misfires)
      guard_exclude_patterns:
        # Swagger / OpenAPI documentation decorators: @ApiBearerAuth() / @ApiOperation() …
        - "^@?api"
        - "(swagger|openapi)"
        # NestJS parameter decorators (they only read values, they do not authenticate): @User() / @Body() / @Param() / @Req() …
        - "^@?(req|request|res|response|next|session|param|params|body|query|headers|header|ip|uploadedfile|uploadedfiles|currentuser|user)$"
        # Local variables / internal names (`_user`) are not middleware
        - "^_"
      name_from_args: true
      include_class_level: true
      # A TS decorator's callee carries the `@` prefix: this excludes ordinary method calls like `this.svc.generateJWT()`
      require_at_prefix: true
  # Module-level `MiddlewareConsumer`: `consumer.apply(AuthMiddleware).forRoutes(...)`
  # Unioned with `@UseGuards` above (the decorator model) — both styles are declared and the kernel merges the output.
    - kind: consumer
      receiver: "consumer"
      apply_method: "apply"
      for_routes_method: "forRoutes"
      wildcards: ["*"]
      # A wildcard (`forRoutes('*')`) applies to controllers **in the same directory as the module** (the NestJS
      # convention: `user.module.ts` and `user.controller.ts` both live in `src/user/`).
      scope: directory
  # A JS guard is a class / function value and often has no corresponding syntax node — authorization is materialised as a Middleware node by name.
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: HTTP contract (method decorator) =====
  # `@Get(':username')` / `@Post('users/login')` — the method name is the HTTP verb and the path comes from the
  # first argument; `HandledBy` links to the decorated **controller method**.
  #
  # Honest gaps:
  # * **The controller prefix is not joined**: the real path of `@Controller('profiles')` + `@Get(':username')` is
  #   `/profiles/:username`, while only `/:username` is built here. The kernel's route-group prefix mechanism is
  #   PHP-specific (P3 hard-codes receiver == `Route`), so reusing it would require a kernel change.
  # * **A decorator with no argument (`@Get()`) builds no contract**: with no path there is nothing to build —
  #   better missing than guessed (`ContractId` requires a non-empty path, and `ValueSource.default` does not apply
  #   when `raw` returns None).
  - id: route-contract
    phase: Synthesize
    selector:
      kind: call
      # The `@` prefix marks a decorator call site (added deliberately by the parser) and distinguishes it from an
      # ordinary `.get()` — otherwise HTTP calls inside e2e tests would be treated as routes.
      callee: "@Get|@Post|@Put|@Delete|@Patch|@Head|@Options|@All"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            # A JS class / method FQN is "class name" / "class name.method name", so owner_class yields the controller
            # class and owner_member the method name, which are reassembled into `Controller.method` to hit the method node.
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # ===== P5 Synthesize: dependency injection (constructor parameter type) =====
  # `constructor(private readonly userService: UserService)` — the provider is the parameter type.
  # The parser records such a "parameter with an access modifier" as a call site with callee `@Inject` and
  # entity = the type's short name (see `collect_param_types` in `gt-adapter-parser/src/js/mod.rs`); the semantics
  # live only in this rule.
  #
  # It uses `Link` (build the edge only, create no node): the provider is already a class node on the graph. Both ends
  # resolve by FQN; if resolution fails (generic / interface / unimported type) it is skipped silently and no dangling
  # edge is created — same as `fastapi-depends-injection`.
  - id: injectable-di
    phase: Synthesize
    selector:
      kind: call
      callee: "@Inject"
    binding:
      - Link:
          kind: DependsOn
          # Consumer side: the class declaring the constructor (`UserController`)
          from: { path: [{ owner_class: true }] }
          # Provider side: the injected type (the `UserService` class node, recovered by short name via `resolve_name`)
          to: { entity: true, resolve: class_const }
          confidence: 0.85
