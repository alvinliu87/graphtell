# NestJS 框架知识（Node / TypeScript）
#
# 前置：JS/TS 解析器新增了**装饰器 → 调用点**（与 Java 注解 / Python 装饰器同机制）。
# 方法装饰器（`@Get(':username')`）的 owner 精确到**被修饰的方法**，因此这里能像
# FastAPI / Spring 一样把 `HandledBy` 连到处理方法本身。
#
# 与前端 FKB 的关系：本文件只认 `@nestjs/*` 依赖，不会和 uni-app 的前端规则串味。

id: nestjs
display_name: NestJS
language: javascript
version_hint: "9.x / 10.x"
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@nestjs/core"
    confidence: 0.95

exclude_globs:
  - "**/node_modules/**"
  - "**/dist/**"

# ---------------------------------------------------------------- P3 装载
loaders:
  # 路由表 + 守卫：识别逻辑由下方 `route_guards` 声明（装饰器模型）。
  - id: nestjs-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- 路由守卫识别
# NestJS 是**装饰器**写法：路由是 `@Get/@Post/...`，守卫是 `@UseGuards(JwtAuthGuard)`。
# 解析器把装饰器捕捉成调用、callee 带 `@` 前缀、owner 是被装饰的方法（类级装饰器 owner 是类），
# 故按 owner 关联即可；`include_class_level` 让打在控制器类上的 `@UseGuards` 也作用于
# 该类的每个路由方法。
#
# 模块级 `configure(consumer: MiddlewareConsumer){ consumer.apply(AuthMiddleware).forRoutes(...) }`
# 这种"按路径匹配挂载"的写法由下方 `guard_attach` 里的 `consumer` 模型覆盖：
# `forRoutes` 的实参支持**字符串**（`forRoutes('user')`）与**对象字面量**
# （`{path: 'user', method: RequestMethod.GET}`），后者按 (路径, 动词) 落到具体契约，
# 动词维度（`RequestMethod.*`）会筛掉同路径的其它动词路由。命中通配
# （`forRoutes('*')`）时按 `scope` 展开（默认"与模块同目录"）。
route_guards:
  route_calls:
    - receiver: "@Get"
      by: callee
      verb_methods: { "@get": GET }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Post"
      by: callee
      verb_methods: { "@post": POST }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Put"
      by: callee
      verb_methods: { "@put": PUT }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Delete"
      by: callee
      verb_methods: { "@delete": DELETE }
      path_arg: 0
      accept_identifier: true
    - receiver: "@Patch"
      by: callee
      verb_methods: { "@patch": PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "@All"
      by: callee
      verb_methods: { "@all": ANY }
      path_arg: 0
      accept_identifier: true
  # NestJS 有**两种**挂载写法，都声明上（内核取并集）：
  guard_attach:
    - kind: decorator
      route_decorators: ["@Get", "@Post", "@Put", "@Delete", "@Patch", "@Head", "@Options", "@All"]
      guard_decorators: ["@UseGuards"]
      # JS / Python 的守卫常是项目自写的装饰器，穷举名字是打地鼠 ——
      # 按"什么样的名字算守卫"声明（大小写不敏感正则）：
      guard_name_patterns:
        - "(login|logout|auth|jwt|token|session)"
        - "(permission|role|admin|staff|owner|superuser)"
        - "(guard|secure|required|only|protect|verify|check)"
      # deny 优先：文档装饰器与参数装饰器**不是**守卫（实测误伤来源）
      guard_exclude_patterns:
        # Swagger / OpenAPI 文档装饰器：@ApiBearerAuth() / @ApiOperation() …
        - "^@?api"
        - "(swagger|openapi)"
        # NestJS 参数装饰器（只取值不做鉴权）：@User() / @Body() / @Param() / @Req() …
        - "^@?(req|request|res|response|next|session|param|params|body|query|headers|header|ip|uploadedfile|uploadedfiles|currentuser|user)$"
        # 局部变量 / 内部名（`_user`）不是中间件
        - "^_"
      name_from_args: true
      include_class_level: true
      # TS 装饰器 callee 带 `@` 前缀：据此排除 `this.svc.generateJWT()` 这类普通方法调用
      require_at_prefix: true
  # 模块级 `MiddlewareConsumer`：`consumer.apply(AuthMiddleware).forRoutes(...)`
  # 与上面的 `@UseGuards`（装饰器模型）取并集 —— 两种写法都声明、内核合并产出。
    - kind: consumer
      receiver: "consumer"
      apply_method: "apply"
      for_routes_method: "forRoutes"
      wildcards: ["*"]
      # 通配（`forRoutes('*')`）时作用于**与模块同目录**的控制器（NestJS 惯例：
      # `user.module.ts` 与 `user.controller.ts` 同在 `src/user/`）。
      scope: directory
  # JS 的守卫是类 / 函数值，常没有对应语法节点 —— 授权按名建成 Middleware 节点。
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize：HTTP 契约（方法装饰器）=====
  # `@Get(':username')` / `@Post('users/login')` —— 方法名即 HTTP 动词，
  # 路径取自第 1 个实参；`HandledBy` 连到被装饰的**控制器方法**。
  #
  # 诚缺：
  # * **控制器前缀未拼接**：`@Controller('profiles')` + `@Get(':username')` 的真实
  #   路径是 `/profiles/:username`，这里只建成 `/:username`。内核的路由组前缀机制
  #   是 PHP `Route::group` 专用（P3 里写死 receiver == `Route`），复用需要改内核。
  # * **无实参的装饰器（`@Get()`）不建契约**：取不到路径就不建，宁可缺不可猜
  #   （`ContractId` 要求 path 非空，`ValueSource.default` 在 `raw` 返回 None 时不生效）。
  - id: nestjs-route-contract
    phase: Synthesize
    selector:
      kind: call
      # `@` 前缀 = 装饰器调用点（解析器刻意加的），以此与普通 `.get()` 区分 ——
      # 否则 e2e 测试里的 HTTP 调用会被当成路由。
      callee: "@Get|@Post|@Put|@Delete|@Patch|@Head|@Options|@All"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            # JS 侧的类 / 方法 FQN 是「类名 / 类名.方法名」，故 owner_class 取到
            # 控制器类、owner_member 取到方法名，拼回 `Controller.method` 命中方法节点。
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # ===== P5 Synthesize：依赖注入（构造器形参类型）=====
  # `constructor(private readonly userService: UserService)` —— provider 即形参类型。
  # 解析器把这种「带访问修饰符的形参」记成了 callee `@Inject`、entity = 类型短名的调用点
  # （见 `gt-adapter-parser/src/js/mod.rs` 的 `collect_param_types`），语义只在本条规则里。
  #
  # 用 `Link`（仅建边、不造节点）：provider 本身就是图里的类节点。两端都按 FQN 解析，
  # 解析不到（如泛型 / 接口 / 未导入的类型）就静默跳过，不建悬空边 —— 与 `fastapi-depends-injection` 同。
  - id: nestjs-injectable-di
    phase: Synthesize
    selector:
      kind: call
      callee: "@Inject"
    binding:
      - Link:
          kind: DependsOn
          # 消费方：声明该构造器的类（`UserController`）
          from: { path: [{ owner_class: true }] }
          # 提供方：被注入的类型（`UserService` 类节点，`resolve_name` 按短名找回）
          to: { entity: true, resolve: class_const }
          confidence: 0.85
