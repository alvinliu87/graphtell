# Express framework knowledge (Node.js)
#
# **Zero parser changes**: to `JsFrontendParser`, `app.get('/login', handler)` is an ordinary member call
# (receiver = `app`, method = `get`, arg0 = `/login`), the same shape as Python FastAPI's verb shortcut `@app.get`
# — the only difference is the `@` prefix (which Express does not have).
#
# Key differences from NestJS (recorded honestly):
#   * the method name is itself the HTTP verb (`app.get` / `router.post`), so it is read via `method_name`;
#     but `get` / `post` are too generic, so it must be narrowed by **receiver variable name** (`app` / `router`, etc.).
#   * route and handler are **decoupled**: `handler` is a later argument (often `userController.getLogin`,
#     in another file). A module-level route (top level of a CommonJS `app.js`) has a file path as owner and
#     no corresponding node, so `HandledBy` is **not** forced here — otherwise dangling or wrong edges would result.
#     If needed later this can link `to: { arg: 1 }` to the handler argument (requires the handler to have a
#     resolvable FQN node inside this project); for now only the contract node is materialised.

id: express
display_name: Express
language: javascript
version_hint: "4+"
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: express
    confidence: 0.95

exclude_globs:
  - "node_modules/**"
  - "dist/**"
  - "build/**"

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below (the positional-argument style
  # `app.post('/login', loginLimiter, handler)`); the kernel no longer hard-codes it.
  - id: express-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# Express uses **positional arguments**: the first argument is the path, the last is the handler, and every argument
# in between is middleware (`app.post('/login', loginLimiter, handler)`).
route_guards:
  route_calls:
    # `accept_identifier: true` — a JS middleware is a **function reference** (`loginLimiter` /
    # `isAuthenticated`), not an `X::class` literal, so it must be declared explicitly to be collected.
    - receiver: "app"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, head: HEAD, options: OPTIONS, all: ANY }
      path_arg: 0
      handler_arg: null
      accept_identifier: true
    - receiver: "router"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, head: HEAD, options: OPTIONS, all: ANY }
      path_arg: 0
      handler_arg: null
      accept_identifier: true
    - receiver: "api"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, head: HEAD, options: OPTIONS, all: ANY }
      path_arg: 0
      handler_arg: null
      accept_identifier: true
  guard_attach:
    kind: positional
  # A JS middleware is a function value constant (`const loginLimiter = rateLimit({...})`) and the parser builds no
  # syntax node for it; but "this route has loginLimiter attached" is a source-level fact, so authorization is
  # materialised as a Middleware node by name.
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: HTTP contract (route) =====
  # `app.get('/login', handler)` / `router.post('/x', ...)`.
  # The path comes from the first argument; the method is derived from the receiver's property name (get/post/...).
  - id: express-route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::{get,post,put,delete,patch,head,options}|router::{get,post,put,delete,patch,head,options}|api::{get,post,put,delete,patch,head,options}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          confidence: 0.9
