# Koa (Node.js) framework knowledge — route contracts
#
# **Zero parser changes**: to `JsFrontendParser`, `router.get('/users', handler)` is an ordinary member call
# (receiver = `router`, method = `get`, arg0 = `/users`), the same shape as Express.
#
# Differences from Express (same language, same DSL, pure data differences):
#   | concept         | Express                  | Koa                          |
#   |-----------------|--------------------------|------------------------------|
#   | route register  | `app.get(path, handler)` | `router.get(path, handler)`  |
#   | route object    | `express()` is the app   | `new Router()` (@koa/router) |
#   | wildcard method | `app.all(path, h)`       | `router.all(path, h)`        |
#   | mounting        | `app.use('/x', router)`  | `app.use(router.routes())`   |
#
# `app` is **deliberately not** a receiver: Koa's `app` is the Application and is only used for `app.use()`;
# routes always hang off a Router (or a named instance of one). Listing it would only collect noise.
#
# Consistent with Express: **`HandledBy` is not forced** — the handler is often a controller method in another
# file (or an inline arrow function) with no resolvable node inside the project, and forcing a link would create
# dangling / wrong edges.

id: koa
display_name: Koa
language: javascript
version_hint: "2+ / @koa/router 10+"
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@koa/router"
    confidence: 0.95
  - kind: manifest_dependency
    manifest: package.json
    dependency: koa
    confidence: 0.8

exclude_globs:
  - "node_modules/**"
  - "dist/**"
  - "build/**"

rules:
  # ===== P5 Synthesize: HTTP contract (route) =====
  # `router.get('/users', handler)` / `admin.post('/x', ...)`.
  # The path comes from the first argument; the method is derived from the receiver's property name (`get` -> GET).
  # `router.all(...)` is Koa's wildcard spelling and normalises to ANY (the same semantics as Django's `ANY`).
  - id: koa-route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "router::{get,post,put,delete,patch,head,options,all}|koaRouter::{get,post,put,delete,patch,head,options,all}|api::{get,post,put,delete,patch,head,options,all}|admin::{get,post,put,delete,patch,head,options,all}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
                - replace: { from: "ALL", to: "ANY" }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          confidence: 0.9
