# Fastify (Node.js) framework knowledge — route contracts
#
# **Zero parser changes**: to `JsFrontendParser`, `fastify.get('/users', handler)` is an ordinary member call
# (receiver = `fastify`, method = `get`, arg0 = `/users`), the same shape as Express / Koa.
#
# The three frameworks differ in receiver, so each gets its own file (the criterion is "which object registers routes"):
#   | framework | typical receivers           |
#   |-----------|-----------------------------|
#   | Express   | `app` / `router` / `api`    |
#   | Koa       | `router` (no `app`)         |
#   | Fastify   | `fastify` / `app` / `server`|
#
# Consistent with Express / Koa: **`HandledBy` is not forced** (the handler often lives in another file).
#
# Known boundary: the **schema style** `fastify.route({ method: 'GET', url: '/x', handler })` currently produces no
# contract — the method / path hide inside an object literal, and support for reading object fields in the parser is
# needed first.

id: fastify
display_name: Fastify
language: javascript
version_hint: "4+"
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: fastify
    confidence: 0.95

exclude_globs:
  - "node_modules/**"
  - "dist/**"
  - "build/**"

rules:
  # ===== P5 Synthesize: HTTP contract (route) =====
  # `fastify.get('/users', handler)` / `app.post('/x', ...)` / `server.put(...)`。
  - id: fastify-route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "fastify::{get,post,put,delete,patch,head,options}|app::{get,post,put,delete,patch,head,options}|server::{get,post,put,delete,patch,head,options}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          confidence: 0.9
