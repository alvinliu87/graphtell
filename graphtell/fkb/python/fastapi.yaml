# FastAPI framework knowledge (Python)
#
# **Python-side framework semantics are filled in purely through YAML declarations — no kernel code was changed.**
# This is the **third language** after Java: as long as `LanguageParser` is implemented and registered, the upper
# pipeline (P0~P8) handles Python projects with no changes at all.
#
# One concept, three expressions:
#   | concept       | ThinkPHP          | Spring Boot         | FastAPI              |
#   |---------------|-------------------|---------------------|----------------------|
#   | HTTP contract | `Route::get(...)` | `@GetMapping("/x")` | `@app.get("/x")`     |
#   | config read   | `sys_config()`    | `@Value("${x}")`    | `os.environ.get(x)`  |
#   | cache         | `Cache::get()`    | `@Cacheable("x")`   | `redis.get("x")`     |
#
# The key is that **decorators are modelled as call sites in the parser** (`CallSiteFact`), the same mechanism as
# Java annotations: a Python decorator / Java annotation / C# attribute are all the same concept — a declarative
# framework call. So no new DSL capability is needed here; a `kind: call` selector can match decorators.

id: fastapi
display_name: FastAPI
language: python
version_hint: "0.100+"
side: backend
scope: framework

detectors:
  # fastapi appears in requirements.txt / pyproject.toml (`manifest_has` does a textual containment match on
  # non-JSON files, so plain-text manifests work too).
  - kind: manifest_dependency
    manifest: requirements.txt
    dependency: fastapi
    confidence: 0.95
  - kind: manifest_dependency
    manifest: pyproject.toml
    dependency: fastapi
    confidence: 0.9

# The **bridge edge** kind introduced by this FKB (`DependsOn`) — no change to the BRIDGE list in the kernel's `kinds.rs`.
#
# Why a bridge edge and not a semantic edge: a semantic edge requires "both ends are semantic nodes" (a business
# resource dependency such as reading the DB or reading config), while dependency injection has **syntax nodes** at
# both ends (handler function -> dependency function). A bridge edge means "a discovered connector": it can be
# walked along the call chain but does not count towards the "N semantic in-edges" business metric — otherwise
# injecting N dependencies would inflate the business-dependency count by N.
bridge_edge_kinds:
  - DependsOn

exclude_globs:
  - "__pycache__/**"
  - "*/__pycache__/**"
  - "*/.venv/**"
  - "*/venv/**"

root_rules:
  - id: fastapi-app-root
    key: app_root
    source:
      kind: directory_exists
      path: app
    confidence: 1.0
    fallbacks:
      - app
      - src

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below.
  - id: fastapi-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# FastAPI: a route is `@router.get("/x")` (the verb is the method name), and guards come in two shapes:
#   * a decorator (a custom `@requires_auth` etc. beyond `@app.middleware`) — covered by this declaration;
#   * **`Depends(...)` in the function signature** (`def read(x: User = Depends(get_current_user))`) —
#     the dependency is not in a decorator and is **not covered here** (collecting parameter dependencies
#     belongs to the parser side and is follow-up work).
route_guards:
  route_calls:
    - receiver: "app"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, route: ANY, api_route: ANY }
      path_arg: 0
      accept_identifier: true
    - receiver: "router"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, route: ANY, api_route: ANY }
      path_arg: 0
      accept_identifier: true
    - receiver: "api_router"
      verb_methods: { get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH, route: ANY, api_route: ANY }
      path_arg: 0
      accept_identifier: true
  guard_attach:
    kind: decorator
    route_decorators: []
    # `Depends(...)` — a FastAPI dependency is written in the **function signature** (`user=Depends(get_current_user)`),
    # and the parser records it as a call site owned by that view function, so the same owner-correlation logic as for
    # decorators hits it.
    guard_decorators: ["login_required", "jwt_required", "auth_required", "requires_auth",
                       "permission_required", "roles_required", "admin_required", "Depends"]
    # JS / Python guards are often project-written decorators, so enumerating names is whack-a-mole —
    # declare instead "what kind of name counts as a guard" (a case-insensitive regex):
    guard_name_patterns:
      - "(login|logout|auth|jwt|token|session)"
      - "(permission|role|admin|staff|owner|superuser)"
      - "(guard|secure|required|only|protect|verify|check)"
    # deny wins: documentation decorators and parameter decorators are **not** guards (a measured source of misfires)
    guard_exclude_patterns:
      # Swagger / OpenAPI documentation decorators: @ApiBearerAuth() / @ApiOperation() …
      - "^@?api"
      - "(swagger|openapi)"
      # NestJS parameter decorators (they only read values, they do not authenticate): @User() / @Body() / @Param() / @Req() …
      - "^@?(req|request|res|response|next|session|param|params|body|query|headers|header|ip|uploadedfile|uploadedfiles|currentuser|user)$"
      # Local variables / internal names (`_user`) are not middleware
      - "^_"
    name_from_args: true
    include_class_level: true
    # Guard decorators are bare names (`@login_required`); member calls like `self.check_x()` are not decorators
    require_no_receiver: true
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: HTTP contract =====
  # `@router.get("/users")` — a decorator is modelled as a call site:
  #   callee = `router.get` (receiver=router / method=get),
  #   owner  = the decorated **handler function** (`app.api.users.list_users`).
  #
  # Why not write `callee: get|post|...` bare: Python method names are too generic, and `requests.get("/api")` /
  # `dict.get(...)` / `redis.get(...)` would all misfire, fabricating hundreds of fake HttpContracts. So the scope is
  # narrowed by "receiver variable name" — the same approach as narrowing `send` with `kafkaTemplate::send` on the
  # Java side (see spring-boot.yaml).
  # If a project uses another variable name (e.g. `v1_router`), just add it to the alternatives below.
  #
  # The method is derived directly from the decorator name (`get` -> `GET`), and the path comes from the first
  # argument (arg0).
  - id: fastapi-route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::{get,post,put,delete,patch}|router::{get,post,put,delete,patch}|api_router::{get,post,put,delete,patch}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # Python handler functions are often written directly at module level (not inside a class). The parser
            # back-fills `owner_class` at module level with the **dotted module name**, and the module is registered as
            # a Namespace node — so here we locate the module first and then drop onto the function itself by member name.
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # ===== P5 Synthesize: ConfigKey =====
  # `os.environ.get("SECRET_KEY")` / `os.getenv("SECRET_KEY")`.
  # The parser keeps the full attribute chain (the receiver of `os.environ.get` is `os.environ`), so `os.environ::get`
  # matches precisely and never misfires on `self.config.get(...)`.
  - id: fastapi-env-config
    phase: Synthesize
    selector:
      kind: call
      callee: "os.environ::get|os::getenv"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: dependency injection (Depends) =====
  # `def handler(db: Session = Depends(get_db))` — the dependency is written in a **parameter default**, not inside
  # the method body, so ordinary traversal cannot catch it. The parser records it as a call site and resolves `get_db`
  # into an FQN (`app.dependencies.get_db`) from this file's imports, stored in `entity`; the parser itself does not
  # know what `Depends` is — that judgement lives only in this rule.
  #
  # It uses `Link` (build the edge only, create no node): the dependency is already a function node on the graph, so
  # there is nothing to synthesize. Note that `Link` requires both ends to resolve by **FQN** (if not, it is skipped
  # silently and no dangling edge is created).
  - id: fastapi-depends-injection
    phase: Synthesize
    selector:
      kind: call
      callee: "Depends"
    binding:
      - Link:
          kind: DependsOn
          # Start: the handler function (owner_fqn = module.function, assembled here as needed)
          from:
            path: [{ owner_class: true }, { owner_member: true }]
            join: "."
          # End: the injected dependency function (the FQN resolved by the parser)
          to: { entity: true, resolve: class_const }
          confidence: 0.85

