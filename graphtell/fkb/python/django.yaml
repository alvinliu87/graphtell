# Django framework knowledge (Python)
#
# **Reuses existing capability and is almost pure YAML** — the same edge set as TypeORM / Laravel /
# ThinkPHP (`References` / `ForeignKey` / `HasColumn` / `MapsTo`), with `ForeignKey` reusing the `Project`
# action directly. `ForeignKey` is table -> table (both ends semantic), a business-resource dependency, hence
# a semantic edge; `References` (model -> model) has code nodes at both ends, hence a bridge edge.
#
# Precondition: the Python parser turns a "field declaration `name = models.CharField(...)` inside a class body"
# into a call site whose owner is precise to "class.field" (`owner_class` = the model class, `owner_member` = the
# field name), and the first positional argument of a relation field (a class-name identifier) is resolved to an
# FQN recorded in `entity` — see `gt-adapter-parser/src/python`.

id: django
display_name: Django
language: python
version_hint: "4.x / 5.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: requirements.txt
    dependency: "django"
    confidence: 0.95
  - kind: manifest_dependency
    manifest: pyproject.toml
    dependency: "django"
    confidence: 0.9

exclude_globs:
  - "__pycache__/**"
  - "*/__pycache__/**"
  - "*/.venv/**"
  - "*/venv/**"
  # Django's auto-generated migration files use `migrations.CreateModel` / `AddField` (fields given as a dict,
  # not as `models.CharField` class-attribute declarations) and would re-describe the model structure, so they
  # are skipped to avoid creating noise call sites.
  - "*/migrations/**"

# `References` (model -> model) has **code nodes** at both ends and is declared as a bridge edge: it can be walked
# along the chain for impact analysis, but is not counted in "N semantic in-edges" and is not a canvas edge (same
# treatment as FastAPI's `DependsOn`).
# `ForeignKey` (table -> table) has `Table` (semantic nodes) at both ends and is a real business-resource
# dependency, hence a semantic edge.
semantic_edge_kinds: [ForeignKey]
bridge_edge_kinds: [References]

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below.
  - id: route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# Django writes **routes and views separately**:
#   urls.py   `path('profile', views.profile)`        <- the route (encodes no HTTP method, hence ANY)
#   views.py  `@login_required\ndef profile(request)` <- the guard
# Their owners differ, so `link_via_handler_arg: 1` correlates them **by handler argument** across files:
# the handler reads `views.profile`, the view function's owner is `myapp.views.profile`, and the suffix matches.
route_guards:
  route_calls:
    - receiver: "path"
      by: callee
      verb_methods: { path: ANY }
      path_arg: 0
    - receiver: "re_path"
      by: callee
      verb_methods: { re_path: ANY }
      path_arg: 0
    - receiver: "url"
      by: callee
      verb_methods: { url: ANY }
      path_arg: 0
  guard_attach:
    kind: decorator
    route_decorators: []
    guard_decorators: ["login_required", "staff_member_required", "permission_required",
                       "user_passes_test", "csrf_protect", "require_http_methods"]
    guard_name_patterns:
      - "(login|logout|auth|jwt|token|session)"
      - "(permission|role|admin|staff|owner|superuser)"
      - "(guard|secure|required|only|protect|verify|check)"
    guard_exclude_patterns:
      # `path` / `include` / `re_path` are not guards themselves; neither are local variables
      - "^(path|re_path|url|include|static)$"
      - "^_"
    name_from_args: true
    include_class_level: true
    require_no_receiver: true
    link_via_handler_arg: 1
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: model -> table =====
  # `class Post(models.Model)` — the table name is the class short name (snake_plural, the same algorithm as
  # Laravel's `laravel-model-table`: `Post` -> `posts`). Django's real table name is `app_label_modelname`;
  # app_label is not available here, so the pluralised class short name is used as a fallback; if a project sets
  # it explicitly via `class Meta: db_table = "x"`, that is not read yet (see the honesty boundary below).
  - id: model-table
    phase: Synthesize
    selector:
      kind: inheritance
      base: "models.Model|Model"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              self: true
              transform: { snake_plural: true }
              # `snake_plural`'s internal `strip_namespace` only recognises the three separators `\ / :`, not Python's
              # dot, so an extra `short_name` step is applied here (also splitting on `.`) to take the last class-name segment.
              normalize:
                - short_name
                - singularize
                - trim
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.6

  # ===== P5 Synthesize: model field -> table column =====
  # `title = models.CharField(max_length=200)` — a field declaration is a column. It materialises as a `Column`
  # node, and the model class points at it via `HasColumn` (the model class already `MapsTo` -> `Table`, so
  # "table -> column" is two hops: table <-MapsTo- model -HasColumn-> column; field-level impact can then be
  # followed step by step, isomorphic to TypeORM).
  #
  # Identity is `model class.field` (`owner_class.owner_member`): same-named columns (`id`) in different models
  # must count separately. `HasColumn` links to `owner_class` (the model class) and then reaches the table via `MapsTo`.
  #
  # Only **column** field types are collected; `@ForeignKey` / `@OneToOneField` / `@ManyToManyField` are relations
  # and are modelled separately by `model-relation` below (so a foreign-key field is not mistaken for an
  # ordinary column).
  # Note: the Django idiom is `from django.db import models` and then `models.CharField`; if a project instead
  # writes `from django.db.models import CharField` and calls `CharField(...)` directly, the current callee does
  # not match (bare field names are too generic, and we do not want to loosen it and misfire on ordinary variables).
  - id: column
    phase: Synthesize
    selector:
      kind: call
      callee: "models::{CharField,TextField,IntegerField,BigIntegerField,SmallIntegerField,PositiveIntegerField,PositiveSmallIntegerField,EmailField,BooleanField,DateTimeField,DateField,TimeField,DecimalField,FloatField,JSONField,AutoField,BigAutoField,UUIDField,SlugField,URLField,FileField,ImageField,IPAddressField,GenericIPAddressField,PositiveBigIntegerField,PositiveBigIntegerField}"
    binding:
      - Synthesize:
          node: Column
          identity:
            kind: Named
            value:
              path: [{ owner_class: true }, { owner_member: true }]
              join: "."
          link:
            kind: HasColumn
            direction: incoming
            to: { owner_class: true, resolve: class_const }
          confidence: 0.8

  # ===== P5 Synthesize: model relations (foreign-key holder) =====
  # `author = models.ForeignKey(User, on_delete=models.CASCADE)` — Post references User.
  #
  # The target model is **not** taken from a decorator argument literal; it is the first positional argument's
  # class name that the parser already filled into the call site's `entity` (same mechanism as FastAPI's `Depends`:
  # `{ entity: true }` links straight to the target model class).
  #
  # Only the holder side is built (`ForeignKey` / `OneToOneField` / `ManyToManyField`): Django usually does not
  # write a reverse `related_name` call, so building the holder side is enough; two-way declarations are rare, and
  # if one is written the reverse edge would duplicate the paired edge (in the real sample `Article.author` and
  # `User.articles` are exactly that), so only the holder side is built.
  - id: model-relation
    phase: Synthesize
    selector:
      kind: call
      callee: "models::{ForeignKey,OneToOneField,ManyToManyField}"
    binding:
      - Link:
          kind: References
          # Referencing side: the model class declaring the relation
          from: { owner_class: true, resolve: class_const }
          # Referenced side: the class of the first positional argument (the parser resolved it into an FQN stored in entity)
          to: { entity: true, resolve: class_const, require_class: true }
          confidence: 0.75

  # ===== P6 AnnotatePost: project model relations into **table-level foreign keys** =====
  # The rule above builds "model class -> model class"; from the table perspective you want to see "table -> table"
  # foreign keys directly, so dead-table / impact analysis need not detour through model classes every time.
  #
  # `Project` = walk every `along` out-edge of the matched node, follow each end along its own edge-kind chain to
  # a landing point, and build an edge between the two landing points. Here both ends walk one `MapsTo` hop
  # (model -> table), so `References` (Post -> User) is projected into `ForeignKey` (post -> user).
  #
  # If a landing point cannot be reached it is skipped: a model with no `Table` (e.g. one not hit by the
  # `models.Model` inheritance match) contributes no foreign key — better missing than guessed.
  - id: table-foreign-key
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Class
    binding:
      - Project:
          kind: ForeignKey
          along: References
          from: [MapsTo]
          to: [MapsTo]
          confidence: 0.7

  # ===== P5 Synthesize: URL routes (`path()` in urls.py) =====
  # `path("users/", user_list, name="user_list")` — Django writes the URL together with the view in `urls.py`
  # and **encodes no HTTP method** (one view handles every method), so the contract method uses the wildcard `ANY`
  # (`is_wildcard_http_method` treats `ANY` as matching any front-end call method). This avoids mislabelling a
  # Django endpoint with a concrete verb, and also avoids the read/write heuristic misjudging "unknown method
  # -> read".
  #
  # The path comes from the route literal (arg0, normalised to a leading `/`); the view comes from arg1 linked to
  # the Handler via `resolve: class_const`. `resolve: class_const` does not require the target to be a class, so
  # function views connect too.
  #
  # View resolution (a syntactic endpoint; worst case only the handler edge is missing and the contract node is
  # still built):
  # * bare-name reference: `from .views import user_list` then `path("users/", user_list)` — reachable via the
  #   short-name index to the `user_list` function node;
  # * `views.user_list` (module attribute) and `XView.as_view()` (CBV) — not resolved yet, left as a boundary;
  # * `path("api/", include("api.urls"))` style "prefix + include" is treated as one endpoint contract (with no
  #   handler edge) — known noise (see the honesty boundary in SUPPORTED.md).
  - id: route
    phase: Synthesize
    selector:
      kind: call
      callee: "path|re_path|url"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { literal: "ANY" }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            # The view FQN is resolved by the parser into `entity` (see the `path` handling in python/mod.rs);
            # because functions are not in the short-name index, the full FQN is required for `find_by_name` to hit.
            to: { entity: true, resolve: class_const }
          confidence: 0.7
