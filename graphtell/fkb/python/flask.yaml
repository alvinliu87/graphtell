# Flask framework knowledge (Python)
#
# **Pure YAML — zero parser changes.** This is a direct verification that "the Nth framework in a language is almost
# free": Flask's `@app.route("/x")` and FastAPI's `@app.get("/x")` are indistinguishable to the parser (both are
# "attribute-style decorator + literal first argument"), and decorators were already modelled as call sites in the
# Python parser. So no new mechanism is needed here, only a different detector and selector.
#
# The only substantive difference from FastAPI: **the HTTP method is not in the decorator name**.
# `@app.route("/x")` declares no method (it defaults to GET; only `methods=[...]` makes it something else), so
# following the existing Spring `@RequestMapping` precedent it is recorded as `ANY`.

id: flask
display_name: Flask
language: python
version_hint: "2.x / 3.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: requirements.txt
    dependency: flask
    confidence: 0.95
  - kind: manifest_dependency
    manifest: pyproject.toml
    dependency: flask
    confidence: 0.9

exclude_globs:
  - "__pycache__/**"
  - "*/__pycache__/**"
  - "*/.venv/**"
  - "*/venv/**"

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below (a route is a decorator call; a guard is another decorator on the same function).
  - id: route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# Flask: a route is `@app.route("/x")`, and a guard is another decorator placed on **the same view function**
# (`@login_required` / `@jwt_required()`). The parser's decorator call uses the decorated function as owner, so
# correlating by owner is enough.
#
# Honest gap: the verb of `@app.route(..., methods=["POST"])` comes from the `methods` argument, while this
# declaration can only map by method name — a route with no explicit `methods` defaults to GET, and one that does
# write it may disagree (when the keys do not match the guard is simply not attached; "better missing than guessed",
# no wrong edge is created).
route_guards:
  route_calls:
    - receiver: "app"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "bp"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "blueprint"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
  guard_attach:
    kind: decorator
    route_decorators: []
    guard_decorators: ["login_required", "jwt_required", "auth_required", "requires_auth",
                       "permission_required", "roles_required", "admin_required"]
    # JS / Python guards are often project-written decorators, so enumerating names is whack-a-mole —
    # declare instead "what kind of name counts as a guard" (a case-insensitive regex):
    guard_name_patterns:
      - "(login|logout|auth|jwt|token|session)"
      - "(permission|role|admin|staff|owner|superuser)"
      - "(guard|secure|required|only|protect|verify|check)"
    # deny wins: documentation decorators and parameter decorators are **not** guards (a measured source of misfires)
    guard_exclude_patterns:
      # Swagger / OpenAPI documentation decorators: @ApiBearerAuth() / @ApiOperation() …
      - "^@?api"
      - "(swagger|openapi)"
      # NestJS parameter decorators (they only read values, they do not authenticate): @User() / @Body() / @Param() / @Req() …
      - "^@?(req|request|res|response|next|session|param|params|body|query|headers|header|ip|uploadedfile|uploadedfiles|currentuser|user)$"
      # Local variables / internal names (`_user`) are not middleware
      - "^_"
    name_from_args: true
    include_class_level: true
    # Guard decorators are bare names (`@login_required`); member calls like `self.check_x()` are not decorators
    require_no_receiver: true
  # Guards are functions and often have no corresponding syntax node — authorization is materialised as a Middleware node by name.
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: HTTP contract (`@app.route`) =====
  # Receiver: `app`, or `bp` / `blueprint` as commonly used by Flask blueprints. The path comes from the first argument.
  #
  # Method: when `methods=["POST"]` is written, take the **first** method — the parser captured the list literal as an
  # array **keyed by index**, so element 0 is read via `field: "0"`.
  #
  # When `methods` is absent nothing is available here (None), and the engine's ContractId fallback is `GET`; Flask's
  # default behaviour is exactly "respond to GET only", so the two agree and there is no need to write ANY explicitly.
  # (Note: `ValueSource.default` does **not** apply here — evaluation already returned early when `raw` produced None;
  # `default` only covers the case where an empty string was obtained.)
  # Honest gaps: ① `methods=` is only read at arg1; written further back it falls back to GET;
  #              ② a multi-method route (["GET","POST"]) only yields the first method.
  - id: route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::route|bp::route|blueprint::route|api::route"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              source: { arg: 1, field: "methods" }
              field: "0"
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # Same as on the FastAPI side: for a module-level function the parser back-fills `owner_class` with the dotted
            # module name, and the module is registered as a Namespace node, so we can locate the module first and then
            # link to the function itself by member name.
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # ===== P5 Synthesize: Flask 2.x verb shortcuts =====
  # Since Flask 2.0 there are `@app.get/post/put/delete/patch(...)`, the same shape as FastAPI's spelling,
  # so the method can be derived directly from the decorator name.
  - id: verb-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::{get,post,put,delete,patch}|bp::{get,post,put,delete,patch}|blueprint::{get,post,put,delete,patch}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9
