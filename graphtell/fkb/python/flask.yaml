# Flask 框架知识（Python）
#
# **纯 YAML —— 解析器零改动**。这是「同一语言的第 N 个框架几乎免费」的直接验证：
# Flask 的 `@app.route("/x")` 与 FastAPI 的 `@app.get("/x")` 在解析器眼里没有区别
# （都是「属性式装饰器 + 字面量首参」），装饰器早在 Python 解析器里就被建模成了
# 调用点。所以这里不需要任何新机制，只需要换一个 detector 和选择器。
#
# 与 FastAPI 的唯一实质差异：**HTTP 方法不在装饰器名里**。
# `@app.route("/x")` 不声明方法（默认 GET，写了 `methods=[...]` 才是别的），
# 故按 Spring `@RequestMapping` 的既有先例记为 `ANY`。

id: flask
display_name: Flask
language: python
version_hint: "2.x / 3.x"
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: requirements.txt
    dependency: flask
    confidence: 0.95
  - kind: manifest_dependency
    manifest: pyproject.toml
    dependency: flask
    confidence: 0.9

exclude_globs:
  - "__pycache__/**"
  - "*/__pycache__/**"
  - "*/.venv/**"
  - "*/venv/**"

# ---------------------------------------------------------------- P3 装载
loaders:
  # 路由表 + 守卫：识别逻辑由下方 `route_guards` 声明（路由是装饰器调用，守卫是同函数上的另一个装饰器）。
  - id: flask-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- 路由守卫识别
# Flask：路由是 `@app.route("/x")`，守卫是打在**同一个视图函数**上的另一个装饰器
# （`@login_required` / `@jwt_required()`）。解析器的装饰器调用以被装饰函数为 owner，
# 故按 owner 关联即可。
#
# 诚缺：`@app.route(..., methods=["POST"])` 的动词取自 `methods` 实参，而本声明只能按
# 方法名映射 —— 未显式写 `methods` 的路由默认 GET，写了的可能与之不一致
# （键对不上时守卫不附着，属"宁可缺不可猜"，不会造错边）。
route_guards:
  route_calls:
    - receiver: "app"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "bp"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
    - receiver: "blueprint"
      verb_methods: { route: GET, get: GET, post: POST, put: PUT, delete: DELETE, patch: PATCH }
      path_arg: 0
      accept_identifier: true
  guard_attach:
    kind: decorator
    route_decorators: []
    guard_decorators: ["login_required", "jwt_required", "auth_required", "requires_auth",
                       "permission_required", "roles_required", "admin_required"]
    # JS / Python 的守卫常是项目自写的装饰器，穷举名字是打地鼠 ——
    # 按"什么样的名字算守卫"声明（大小写不敏感正则）：
    guard_name_patterns:
      - "(login|logout|auth|jwt|token|session)"
      - "(permission|role|admin|staff|owner|superuser)"
      - "(guard|secure|required|only|protect|verify|check)"
    # deny 优先：文档装饰器与参数装饰器**不是**守卫（实测误伤来源）
    guard_exclude_patterns:
      # Swagger / OpenAPI 文档装饰器：@ApiBearerAuth() / @ApiOperation() …
      - "^@?api"
      - "(swagger|openapi)"
      # NestJS 参数装饰器（只取值不做鉴权）：@User() / @Body() / @Param() / @Req() …
      - "^@?(req|request|res|response|next|session|param|params|body|query|headers|header|ip|uploadedfile|uploadedfiles|currentuser|user)$"
      # 局部变量 / 内部名（`_user`）不是中间件
      - "^_"
    name_from_args: true
    include_class_level: true
    # 守卫装饰器是裸名（`@login_required`）；`self.check_x()` 这类成员调用不是装饰器
    require_no_receiver: true
  # 守卫是函数，常无对应语法节点 —— 授权按名建成 Middleware 节点。
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize：HTTP 契约（`@app.route`）=====
  # 接收者：`app` / Flask 蓝图常用的 `bp` / `blueprint`。路径取自第 1 个实参。
  #
  # 方法：写了 `methods=["POST"]` 时取**第一个**方法 —— 解析器把列表字面量捕成了
  # 以**下标为键**的数组，故按 `field: "0"` 取首元素。
  #
  # 未声明 `methods` 时这里取不到值（None），引擎对 ContractId 的兜底是 `GET`；
  # 而 Flask 的默认行为正是「仅响应 GET」，两者恰好一致，故不需要再写默认 ANY。
  # （注意：`ValueSource.default` 在这里**不会**生效 —— 求值在 `raw` 返回 None 时
  # 已提前返回，default 只在"取到空串"时兜底。）
  # 诚缺：① `methods=` 只在 arg1 时取到，写在更靠后的位置会退回 GET；
  #       ② 多方法路由（["GET","POST"]）只取第一个。
  - id: flask-route-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::route|bp::route|blueprint::route|api::route"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              source: { arg: 1, field: "methods" }
              field: "0"
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # 与 FastAPI 侧相同：模块级函数的 `owner_class` 由解析器回填为模块点分名，
            # 模块已登记为 Namespace 节点，于是可先定位模块、再按成员名连到函数本身。
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # ===== P5 Synthesize：Flask 2.x 的动词快捷方式 =====
  # Flask 2.0 起提供 `@app.get/post/put/delete/patch(...)`，与 FastAPI 写法同形，
  # 故方法可直接从装饰器名推导。
  - id: flask-verb-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "app::{get,post,put,delete,patch}|bp::{get,post,put,delete,patch}|blueprint::{get,post,put,delete,patch}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9
