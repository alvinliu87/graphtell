# Celery framework knowledge (Python)
#
# **Filled in with pure YAML, zero parser changes** — `@celery_app.task` is a decorator and `task.delay()` is an
# ordinary call, and both are already `CallSiteFact`s to the parser (the Python side reuses Java's modelling of
# "annotation / decorator = call site"). So only selectors need to be declared here.
#
# The design intent of the semantic loop (same reasoning as event merging on the Java side):
#   consumer side `@celery_app.task def send_email()` — a worker takes this task from the queue and executes it
#   producer side `send_email.delay(...)`              — enqueues this task
# Both identities use the **task name**, so they merge into **one Queue node** and form a publish / subscribe loop
# rather than a fragmented view of "one node consuming, another producing".

id: celery
display_name: Celery
language: python
version_hint: "5.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: requirements.txt
    dependency: celery
    confidence: 0.95
  - kind: manifest_dependency
    manifest: pyproject.toml
    dependency: celery
    confidence: 0.9

exclude_rules:
  - id: pycache
    glob: "__pycache__/**"
  - id: nested-pycache
    glob: "*/__pycache__/**"
  - id: dot-venv
    glob: "*/.venv/**"
  - id: nested-venv
    glob: "*/venv/**"

rules:
  # ===== P5 Synthesize: the task's **consumer side** (registration) =====
  # `@celery_app.task` / `@shared_task` — this decorator registers a function as a worker-executable task,
  # i.e. "consumes from the queue".
  #
  # Identity prefers the explicit task name (`@celery.task(name="app.tasks.x")`).
  # An explicit name is written as a **keyword argument**, which the parser captures as `[("name", value)]` (see
  # positional_args), so it can be read by name; since the position of a keyword argument is not fixed, `path` tries
  # the first few positions in order (when nothing is found the result is an empty string and the whole thing falls
  # back via `value_fallback` to the function name — which is exactly Celery's default task name). This mirrors Java's
  # `@EventListener` falling back to `owner_member`.
  - id: task-consumer
    phase: Synthesize
    selector:
      kind: call
      callee: "celery_app::task|celery::task|worker::task|shared_task"
    binding:
      - Synthesize:
          node: Queue
          identity:
            kind: Named
            value:
              path:
                - { arg: 0, field: "name" }
                - { arg: 1, field: "name" }
                - { arg: 0 }
              join: ""
              require_literal: true
              normalize:
                - short_name
                - trim
            value_fallback:
              owner_member: true
              normalize:
                - short_name
                - trim
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.8

  # ===== P5 Synthesize: the task's **producer side** (dispatch) =====
  # `send_email.delay(...)` / `.apply_async(...)` — the receiver is the task object itself, so identity uses
  # `receiver_class` (= the task name) and merges with the consumer side's function name onto the same node.
  #
  # `delay` / `apply_async` are Celery-specific method names (not generic like `get` / `send`), so `*` allows any
  # receiver — the same trade-off as `*::sendDefault` on the Spring side.
  - id: task-producer
    phase: Synthesize
    selector:
      kind: call
      callee: "*::delay|*::apply_async"
    binding:
      - Synthesize:
          node: Queue
          identity:
            kind: Named
            value:
              # **An explicit queue name wins**: `task.apply_async(args=[x], queue="payments")` states exactly which
              # queue to deliver to, which is more authoritative than "infer the default queue from the task name" —
              # the same "explicit declaration beats convention inference" this project follows elsewhere
              # (see the design notes on `Predicate::NotClaimedBy`).
              # The position of a keyword argument is not fixed, so `path` tries the first three positions in order:
              # if none yields a value the result is empty -> fall back to the task name below.
              path:
                - { arg: 0, field: "queue" }
                - { arg: 1, field: "queue" }
                - { arg: 2, field: "queue" }
              join: ""
              require_literal: true
              normalize:
                - short_name
                - trim
            value_fallback:
              # Task name (= the receiver): guarantees that an ordinary `.delay()` and the task registration merge onto one node.
              # `short_name` is the key — if the receiver was restored by `import` into a fully qualified name
              # (`app.tasks.send_email`), not normalising it would split it from the consumer side's short name into two nodes.
              receiver_class: true
              require_literal: true
              normalize:
                - short_name
                - trim
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.8

  # ===== P5 Synthesize: Beat scheduling (periodic tasks) =====
  # `sender.add_periodic_task(30.0, task.s())` — the first argument is the execution interval (seconds).
  # Identity prefers that interval literal; if unavailable (written as a variable / expression) it falls back to the
  # registered function name.
  #
  # Note on the edge semantics: `Triggers` points at **the function holding the registration** (same origin as Spring's
  # `@Scheduled` pointing at "the method carrying the annotation"). The task actually triggered sits in `arg:1`
  # (the `task.s()` call), whose value is not a literal and currently cannot serve as a link target — annotate honestly,
  # do not fabricate an edge.
  - id: beat-periodic-task
    phase: Synthesize
    selector:
      kind: call
      callee: "add_periodic_task"
    binding:
      - Synthesize:
          node: Schedule
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
            value_fallback:
              owner_member: true
              normalize:
                - trim
          link: { kind: Triggers, direction: outgoing }
          confidence: 0.8
