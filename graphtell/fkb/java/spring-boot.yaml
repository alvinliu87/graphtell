# Spring Boot framework knowledge
#
# **Driven by the real Java projects under samples/** (mall / crmeb_java-3.0 / snowy-master, etc.);
# only annotations that **actually occur** in those projects are written here. Measured distribution:
#   @RequestMapping 890+ · @GetMapping 219 · @PostMapping 213
#   @Table 330 · @TableName 143 · @Value 58 · @Mapper 7
#
# Compared with the PHP side — the same concept, a different expression:
#   | concept       | ThinkPHP            | Laravel                    | Spring Boot        |
#   |---------------|---------------------|----------------------------|--------------------|
#   | HTTP contract | `Route::get(...)`   | `Route::get(...)`          | `@GetMapping("/x")`|
#   | table mapping | `$table` property   | Eloquent convention        | `@TableName("x")`  |
#   | config read   | `sys_config()`      | `config()`                 | `@Value("${x}")`   |
#
# Annotations are modelled in the kernel as **call sites** (`CallSiteFact`) — Java annotations / Python
# decorators / C# attributes are the same concept: a declarative framework call. So no new DSL capability
# is needed here.

id: spring-boot
display_name: Spring Boot
language: java
version_hint: "2.x / 3.x"
side: backend
scope: framework

detectors:
  # spring-boot appears in pom.xml (`manifest_has` does a textual containment match on non-JSON files)
  - kind: manifest_dependency
    manifest: pom.xml
    dependency: spring-boot
    confidence: 0.95
  - kind: file_exists
    path: src/main/java
    confidence: 0.6

exclude_globs:
  - "target/**"
  - "*/target/**"
  - "*/build/**"

root_rules:
  - id: spring-source-root
    key: app_root
    source:
      kind: directory_exists
      path: src/main/java
    confidence: 1.0
    fallbacks:
      - src/main/java
      - src

# ---------------------------------------------------------------- P3 loading
loaders:
  # Route table + guards: the recognition logic is declared by `route_guards` below (annotation model).
  - id: spring-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# A Spring route is an **annotation** (`@GetMapping("/page")`), and the guard is the
# `@PreAuthorize("@pms.hasPermission('sys:schedule:log')")` sitting on the same method.
# The Java parser emits annotation callees **without `@`** (unlike TS decorators), so bare names are used here.
#
# `name_from_args: false` — Spring's argument is a SpEL permission expression, not a middleware class;
# the real guard is **the annotation itself** (`PreAuthorize` / `Secured` / `RolesAllowed`).
# `include_class_level: true` — an `@PreAuthorize` on a controller class applies to every method of that class.
route_guards:
  route_calls:
    - receiver: "GetMapping"
      by: callee
      verb_methods: { getmapping: GET }
      path_arg: 0
    - receiver: "PostMapping"
      by: callee
      verb_methods: { postmapping: POST }
      path_arg: 0
    - receiver: "PutMapping"
      by: callee
      verb_methods: { putmapping: PUT }
      path_arg: 0
    - receiver: "DeleteMapping"
      by: callee
      verb_methods: { deletemapping: DELETE }
      path_arg: 0
    - receiver: "PatchMapping"
      by: callee
      verb_methods: { patchmapping: PATCH }
      path_arg: 0
    - receiver: "RequestMapping"
      by: callee
      verb_methods: { requestmapping: ANY }
      path_arg: 0
  guard_attach:
    kind: decorator
    route_decorators: ["GetMapping", "PostMapping", "PutMapping", "DeleteMapping", "PatchMapping", "RequestMapping"]
    guard_decorators: ["PreAuthorize", "Secured", "RolesAllowed", "PreFilter", "PostAuthorize"]
    name_from_args: false
    include_class_level: true
    # Annotations are bare names (`@PreAuthorize`); member calls like `this.checkAuth()` are not annotations
    require_no_receiver: true
  # Permission annotations have no corresponding class node (the real interceptor lives in the framework), so authorization is materialised as a Middleware node keyed by annotation name.
  synthesize_unresolved: true

rules:
  # ===== P5 Synthesize: HTTP contract =====
  # `@GetMapping("/list")` — the method is derived from the annotation name (strip the `Mapping` suffix, then upper-case).
  - id: spring-mapping-http-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - replace: { from: "Mapping", to: "" }
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # Prefer linking precisely to the **handler method** node (`to_method` takes the member name from the FQN of
            # the method carrying the annotation), so the perspective can keep drilling down along the method's call
            # chain; fall back to the controller class when the method cannot be found.
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # `@RequestMapping("/api/x")` — no HTTP method declared, recorded as ANY.
  # Another common spelling is `@RequestMapping(value = "/x", method = RequestMethod.GET)`, whose literal
  # argument also lands in arg:0; the method cannot be extracted, so it is conservatively recorded as ANY.
  - id: spring-request-mapping-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "RequestMapping"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { literal: "ANY" }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # Same as spring-mapping-http-contract: prefer the method node, fall back to the controller class.
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.8

  # ===== P5 Synthesize: Table =====
  # `@TableName` (MyBatis-Plus) lives in `fkb/java/mybatis.yaml`, and JPA `@Table` in `fkb/java/spring-jpa.yaml` —
  # both gated on the project actually using that persistence library, so a Spring Boot project that uses neither
  # produces no `Table` node from these annotations.

  # ===== P5 Synthesize: MyBatis mapper XML (plain MyBatis, no annotation to go on) =====
  # In newbee-mall / litemall / mall, all table access lives in `resources/mapper/*.xml`.
  # The pipeline (gt-pipeline::mybatis) injects each statement x table as a pseudo call site:
  # `mybatis::select|insert|update|delete(table-name)`, owner = the Mapper interface method (namespace.id).
  # `<select>` is a read, `<insert|update|delete>` are writes.
  # MyBatis statements are **not** handled here: see `fkb/java/mybatis.yaml`, which owns them (and is gated on
  # the project actually using MyBatis — a Spring project may just as well use JPA).

  # **Mapper interface -> table**: the two rules above only hang action edges off the Mapper interface's
  # **method**, while P7's read / write verb classification looks up `MapsTo` by **receiver type**
  # (the receiver type of `umsAdminMapper.insert(x)` is the `...mapper.UmsAdminMapper` interface).
  # The interface itself has no `MapsTo`, so such calls produce no `WritesDb`, and Java's N+1 rules get
  # disabled because "the graph has no db-write annotation at all". This rule supplies the interface -> table hop.
  #
  # It uses `Project` rather than `Link`: `Link` resolves both ends with `find_by_name`, while a Table node's
  # **fqn is NULL** (only a name), so a lookup by name always misses. `Project` walks edges and is not subject
  # to that limit:
  #   interface --Declares--> interface method --ReadsDb/WritesDb--> table
  #   => interface --MapsTo--> table. Only Mapper interfaces that really carry action edges produce anything,
  #   so service interfaces see no side effect.
  # ===== P5 Synthesize: ConfigKey =====
  # `@Value("${app.name}")` — strip `${` and `}` to get the config key.
  - id: spring-value-config
    phase: Synthesize
    selector:
      kind: call
      callee: "Value"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - replace: { from: "${", to: "" }
                - replace: { from: "}", to: "" }
                - trim
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: Event (Spring ApplicationEvent) =====
  # Consume: `@EventListener` (a method-level annotation, callee = EventListener) — the event type comes from
  #   the **first parameter type** of the handler method (`onOrder(OrderPlacedEvent e)` -> `OrderPlacedEvent`).
  # Publish: `X.publishEvent(new OrderPlacedEvent())` (callee = publishEvent) — the event type comes from the
  #   `new`-ed type. Both identities use `entity` (the event type), so publishers and subscribers of the same
  #   event type **merge into one Event node**, forming a real publish / subscribe loop.
  # When `entity` is unavailable (e.g. `publishEvent(var)`, or the parser did not recognise the parameter) it
  #   falls back to `owner_member` (the sending / receiving method name) — semantically safe, no edge is lost.
  - id: spring-event-listener
    phase: Synthesize
    selector:
      kind: call
      callee: "EventListener"
    binding:
      - Synthesize:
          node: Event
          identity:
            kind: Named
            value:
              entity: true
            value_fallback:
              owner_member: true
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.8

  - id: spring-event-publish
    phase: Synthesize
    selector:
      kind: call
      callee: "publishEvent"
    binding:
      - Synthesize:
          node: Event
          identity:
            kind: Named
            value:
              entity: true
            value_fallback:
              owner_member: true
          link: { kind: Emits, direction: incoming }
          confidence: 0.8

  # ===== P5 Synthesize: Queue / Topic (Spring AMQP / Kafka, consumer + producer side) =====
  # Consumer side: `@RabbitListener(queues = "q")` / `@KafkaListener(topics = "t")`: callee = the annotation name,
  # and the target name comes from annotation argument arg0 (queue name / topic name).
  # Producer side: `RabbitTemplate.convertAndSend("q", ...)` (below) and `KafkaTemplate.send("t", ...)`,
  # where the destination comes from the first argument (arg0; depends on the parser capturing method-call
  # arguments positionally).
  # Broker listeners are **not** handled here: `@RabbitListener` lives in `fkb/java/spring-amqp.yaml` and
  # `@KafkaListener` in `fkb/java/spring-kafka.yaml`, each gated on the project actually using that broker.

  # ===== P5 Synthesize: Queue producer side (consumer side above) =====
  # `rabbitTemplate.convertAndSend("q", ...)`: callee = convertAndSend (matches the method name, receiver
  # agnostic), target name from the first argument (arg0). This rule depends on the parser's positional capture
  # of "literal arguments of a method call" (otherwise arg0 is always Unknown).
  # Note: `convertAndSend` also comes from RedisTemplate / JmsTemplate, so the node still materialises as a
  # Queue; if they need to be distinguished, it can later be refined by receiver umbrella name.
  # Producers likewise: `convertAndSend` in `spring-amqp.yaml`, `kafkaTemplate::send` in `spring-kafka.yaml`.

  # ===== P5 Synthesize: Schedule (@Scheduled) =====
  # A method-level annotation, callee = Scheduled; cron / fixedRate etc. come from annotation argument arg0.
  # The scheduler "triggers" that method: a `Triggers` out-edge (Schedule node -> method node).
  - id: spring-scheduled
    phase: Synthesize
    selector:
      kind: call
      callee: "Scheduled"
    binding:
      - Synthesize:
          node: Schedule
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: Triggers, direction: outgoing }
          confidence: 0.85

  # ===== P5: a DAO's generic argument -> entity -> table =====
  # `interface UserRepository extends JpaRepository<User, Long>` / `interface OrderMapper extends BaseMapper<Order>`:
  # the generic argument (`User` / `Order`) is the entity the DAO operates on — the parser records it as a
  # `generic.JpaRepository` / `generic.BaseMapper` synthetic call site (`entity` = entity name).
  # The `References` (DAO -> entity) edge is produced by `spring-dao-references-entity-jpa` (in
  # `fkb/java/spring-jpa.yaml`) and `spring-dao-references-entity-mp` (in `fkb/java/mybatis.yaml`); this shared
  # rule then projects along the entity's `MapsTo` into "DAO -> table".
  # Why take this detour: P7's read / write verb classification requires **the receiver type to have a `MapsTo`
  # edge**, and `@TableName` / `@Table` only give that edge to the entity class; without supplying it to the DAO,
  # `userRepository.save()` produces no `WritesDb` (Java's N+1, read-only / write-only table rules all depend on this step).

  # Project "DAO -> entity" down to "DAO -> table": the end point walks one `MapsTo` hop.
  # Applies only to `Interface` nodes — otherwise PHP / TypeORM's `References` (model -> model) would be
  # mis-projected into a `MapsTo` of "model -> another table", polluting the existing graph.
  - id: spring-dao-maps-to-table
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Interface
    binding:
      - Project:
          kind: MapsTo
          along: References
          from: []
          to: [MapsTo]
          confidence: 0.7

resolvers:
  # `@Autowired` field injection: resolve instance calls by the field's declared type.
  - id: spring-autowired-call
    call: "*->*"
    strategy: variable_type

# JPA Repository / MyBatis-Plus CRUD verbs -> read / write classification (used by P7).
#
# The criterion matches the PHP side: the receiver type must have a `MapsTo` (supplied to the DAO by
# `spring-dao-maps-to-table` above). Only verbs that **really hit the database** are listed; intermediate
# methods that merely build a query (`where` / `orderBy`) are excluded — otherwise one chained call would be
# turned into several duplicate action edges.
#
# Boundary: JPA's **derived queries** (`findByEmail` / `countByStatus`) have non-fixed names and cannot be
# enumerated, so they are not in the list — such calls produce no `ReadsDb`, a known gap.
db_verbs:
  write: ["save", "saveAll", "saveAndFlush", "insert", "updateById", "update",
          "updateBatchById", "deleteById", "delete", "deleteBatchIds", "deleteByIds",
          "deleteAll", "deleteAllById"]
  read: ["findById", "findAll", "findAllById", "getById", "getOne", "getReferenceById",
         "count", "existsById", "selectById", "selectList", "selectOne", "selectPage",
         "selectByMap", "selectCount", "list", "page"]
