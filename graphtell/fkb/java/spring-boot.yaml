# Spring Boot 框架知识
#
# **由 samples/ 下的真实 Java 项目驱动**（mall / crmeb_java-3.0 / snowy-master 等），
# 只写这些项目里**实际出现**的注解。实测分布：
#   @RequestMapping 890+ · @GetMapping 219 · @PostMapping 213
#   @Table 330 · @TableName 143 · @Value 58 · @Mapper 7
#
# 与 PHP 侧的对照 —— 同一个概念，不同表达：
#   | 概念       | ThinkPHP            | Laravel                    | Spring Boot        |
#   |------------|---------------------|----------------------------|--------------------|
#   | HTTP 契约  | `Route::get(...)`   | `Route::get(...)`          | `@GetMapping("/x")`|
#   | 表映射     | `$table` 属性       | Eloquent 约定              | `@TableName("x")`  |
#   | 配置读取   | `sys_config()`      | `config()`                 | `@Value("${x}")`   |
#
# 注解在内核里被建模为**调用点**（`CallSiteFact`）—— Java 注解 / Python 装饰器 /
# C# Attribute 是同一概念：声明式的框架调用。因此这里不需要任何新的 DSL 能力。

id: spring-boot
display_name: Spring Boot
language: java
version_hint: "2.x / 3.x"
scope: framework

detectors:
  # pom.xml 里出现 spring-boot（`manifest_has` 对非 JSON 文件做文本包含匹配）
  - kind: manifest_dependency
    manifest: pom.xml
    dependency: spring-boot
    confidence: 0.95
  - kind: file_exists
    path: src/main/java
    confidence: 0.6

exclude_globs:
  - "target/**"
  - "*/target/**"
  - "*/build/**"

root_rules:
  - id: spring-source-root
    key: app_root
    source:
      kind: directory_exists
      path: src/main/java
    confidence: 1.0
    fallbacks:
      - src/main/java
      - src

rules:
  # ===== P5 Synthesize：HTTP 契约 =====
  # `@GetMapping("/list")` —— 方法从注解名推导（去 `Mapping` 后缀再大写）。
  - id: spring-mapping-http-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              method_name: true
              normalize:
                - replace: { from: "Mapping", to: "" }
                - upper
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # 优先精确连到**处理方法**节点（`to_method` 从注解所在方法的 FQN 取成员名），
            # 视角才能沿方法调用链继续下钻；查不到方法时回退控制器类。
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.9

  # `@RequestMapping("/api/x")` —— 未声明 HTTP 方法，记为 ANY。
  # 常见写法还有 `@RequestMapping(value = "/x", method = RequestMethod.GET)`，
  # 其字面量参数同样落在 arg:0，方法信息取不到故保守记为 ANY。
  - id: spring-request-mapping-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "RequestMapping"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { literal: "ANY" }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
          link:
            kind: HandledBy
            direction: to_target
            # 同 spring-mapping-http-contract：优先方法节点，回退控制器类。
            to: { owner_class: true, resolve: class_const }
            to_method: { owner_member: true }
          confidence: 0.8

  # ===== P5 Synthesize：Table =====
  # MyBatis-Plus `@TableName("eb_user")` 与 JPA `@Table(name = "eb_user")`。
  - id: spring-table-name
    phase: Synthesize
    selector:
      kind: call
      callee: "TableName|Table"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：MyBatis mapper XML（原生 MyBatis，无注解可依）=====
  # newbee-mall / litemall / mall 的表访问全在 `resources/mapper/*.xml` 里。
  # 流水线（gt-pipeline::mybatis）把每条语句 × 每张表注入为伪调用点：
  # `mybatis::select|insert|update|delete(表名)`，owner = Mapper 接口方法（namespace.id）。
  # `<select>` 是读，`<insert|update|delete>` 是写。
  - id: mybatis-select-table
    phase: Synthesize
    selector:
      kind: call
      callee: "mybatis::select"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: ReadsDb, direction: incoming }
          confidence: 0.85

  - id: mybatis-write-table
    phase: Synthesize
    selector:
      kind: call
      callee: "mybatis::insert|mybatis::update|mybatis::delete"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: WritesDb, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：ConfigKey =====
  # `@Value("${app.name}")` —— 去掉 `${` 与 `}` 得到配置键。
  - id: spring-value-config
    phase: Synthesize
    selector:
      kind: call
      callee: "Value"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - replace: { from: "${", to: "" }
                - replace: { from: "}", to: "" }
                - trim
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：Cache（Spring Cache 抽象）=====
  # `@Cacheable` 读缓存 / `@CachePut` `@CacheEvict` 写 / 失效缓存。
  # 注解在内核里被建模为调用点（callee = 注解名），缓存名取自 value/value 实参（arg0）。
  # 引擎对「全新」边种类无需改码：`ReadsCache` / `WritesCache` 已是内置语义边。
  - id: spring-cacheable
    phase: Synthesize
    selector:
      kind: call
      callee: "Cacheable"
    binding:
      - Synthesize:
          node: Cache
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: ReadsCache, direction: incoming }
          confidence: 0.85

  - id: spring-cache-put
    phase: Synthesize
    selector:
      kind: call
      callee: "CachePut"
    binding:
      - Synthesize:
          node: Cache
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  - id: spring-cache-evict
    phase: Synthesize
    selector:
      kind: call
      callee: "CacheEvict"
    binding:
      - Synthesize:
          node: Cache
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: WritesCache, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：Event（Spring ApplicationEvent）=====
  # 消费：`@EventListener`（方法级注解，callee = EventListener）—— 事件类型取自
  #   处理方法的**首个形参类型**（`onOrder(OrderPlacedEvent e)` → `OrderPlacedEvent`）。
  # 发布：`X.publishEvent(new OrderPlacedEvent())`（callee = publishEvent）—— 事件类型
  #   取自 `new` 出来的类型。两者身份都用 `entity`（事件类型），故同一事件类型的
  # 发布方与订阅方**归并到同一个 Event 节点**，形成真正的发布 / 订阅闭环。
  # `entity` 取不到（如 `publishEvent(var)`，或解析器未识别形参）时退回 `owner_member`
  # （收发方法名），语义安全不丢边。
  - id: spring-event-listener
    phase: Synthesize
    selector:
      kind: call
      callee: "EventListener"
    binding:
      - Synthesize:
          node: Event
          identity:
            kind: Named
            value:
              entity: true
            value_fallback:
              owner_member: true
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.8

  - id: spring-event-publish
    phase: Synthesize
    selector:
      kind: call
      callee: "publishEvent"
    binding:
      - Synthesize:
          node: Event
          identity:
            kind: Named
            value:
              entity: true
            value_fallback:
              owner_member: true
          link: { kind: Emits, direction: incoming }
          confidence: 0.8

  # ===== P5 Synthesize：Queue / Topic（Spring AMQP / Kafka，消费 + 生产端）=====
  # 消费端：`@RabbitListener(queues = "q")` / `@KafkaListener(topics = "t")`：callee = 注解名，
  # 目标名取自注解实参 arg0（队列名 / topic 名）。
  # 生产端：`RabbitTemplate.convertAndSend("q", ...)`（见下）与 `KafkaTemplate.send("t", ...)`，
  # destination 取自方法调用第 1 个实参（arg0，依赖解析器对方法调用实参的位置级捕获）。
  - id: spring-rabbit-listener
    phase: Synthesize
    selector:
      kind: call
      callee: "RabbitListener"
    binding:
      - Synthesize:
          node: Queue
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.85

  - id: spring-kafka-listener
    phase: Synthesize
    selector:
      kind: call
      callee: "KafkaListener"
    binding:
      - Synthesize:
          node: Topic
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: ListensTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：Queue 生产端（消费端见上）=====
  # `rabbitTemplate.convertAndSend("q", ...)`：callee = convertAndSend（匹配方法名，
  # receiver 无关），目标名取自第 1 个实参（arg0）。本规则依赖解析器对「方法调用
  # 实参字面量」的位置级捕获（否则 arg0 恒为 Unknown）。
  # 注：`convertAndSend` 同样来自 RedisTemplate / JmsTemplate，故节点仍统一落成
  # Queue；若需区分可后续按 receiver 伞名细化。
  - id: spring-rabbit-produce
    phase: Synthesize
    selector:
      kind: call
      callee: "convertAndSend"
    binding:
      - Synthesize:
          node: Queue
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.8

  # 生产端（Kafka）：`kafkaTemplate.send("t", ...)`。
  # 直接用裸方法名 `send` 会过度匹配（`response.sendError` / `email.send` 等都会误伤），
  # 故按「接收者变量名约定」收窄：Spring 里 Kafka 生产者几乎都注入为 `kafkaTemplate` /
  # `kafkaProducer` / `producer` 这类字段，用 `receiver::method` 形式精确命中其 `.send`。
  # 另外 `KafkaTemplate.sendDefault(...)` 的 `sendDefault` 是 Kafka 专属方法名，用 `*::`
  # 兜底任意接收者——误伤面极小。topic 名取自 arg0（第 1 个实参，需字面量）。
  # 若项目用了别的字段名（如 `kt`），把变量名加进下面的备选即可。
  - id: spring-kafka-produce
    phase: Synthesize
    selector:
      kind: call
      callee: "kafkaTemplate::send|kafkaProducer::send|producer::send|*::sendDefault"
    binding:
      - Synthesize:
          node: Topic
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.8

  # ===== P5 Synthesize：Schedule（@Scheduled）=====
  # 方法级注解，callee = Scheduled；cron/fixedRate 等取自注解实参 arg0。
  # 调度器「触发」该方法：`Triggers` 出边（Schedule 节点 ——> 方法节点）。
  - id: spring-scheduled
    phase: Synthesize
    selector:
      kind: call
      callee: "Scheduled"
    binding:
      - Synthesize:
          node: Schedule
          identity:
            kind: Named
            value:
              arg: 0
              require_literal: true
              normalize:
                - trim
          link: { kind: Triggers, direction: outgoing }
          confidence: 0.85

  # ===== P5：DAO 的泛型实参 → 实体 → 表 =====
  # `interface UserRepository extends JpaRepository<User, Long>` 的泛型实参 `User` 就是
  # 它操作的实体 —— parser 把它记成 `generic.JpaRepository` 合成调用点（`entity` = 实体名）。
  # 这里先建 `References`（DAO → 实体），再由下一条沿实体的 `MapsTo` 投影成「DAO → 表」。
  # 为什么要绕这一圈：P7 的读 / 写动词分类要求**接收者类型有 `MapsTo` 边**，而
  # `@TableName` 只给了实体类这条边；不给 DAO 补上，`userRepository.save()` 就落不出
  # `WritesDb`（Java 的 N+1、只读 / 只写表等规则全靠这一步）。
  - id: spring-dao-references-entity
    phase: Synthesize
    selector:
      kind: call
      callee: "generic.JpaRepository|generic.CrudRepository|generic.ListCrudRepository|generic.BaseMapper|generic.Mapper"
    binding:
      - Link:
          kind: References
          # `resolve` 必须写在**每个 ValueSource 上**：`Action::Link` 是
          # `ev.string(src)` 之后直接 `find_by_name`，顶层 `resolve` 不参与（写了无效）。
          # 两端取到的都是名字：起点是 DAO 的 FQN，终点是实体**短名**（经短名索引还原）。
          from: { owner_class: true, resolve: class_const }
          to: { entity: true, resolve: class_const }
          confidence: 0.8

  # 把「DAO → 实体」投影成「DAO → 表」：终点那一端沿 `MapsTo` 走一跳。
  # 只对 `Interface` 节点生效 —— 否则 PHP / TypeORM 的 `References`（模型 → 模型）
  # 会被误投影成「模型 → 另一张表」的 `MapsTo`，污染已有图。
  - id: spring-dao-maps-to-table
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Interface
    binding:
      - Project:
          kind: MapsTo
          along: References
          from: []
          to: [MapsTo]
          confidence: 0.7

resolvers:
  # `@Autowired` 字段注入：按字段声明类型解析实例调用。
  - id: spring-autowired-call
    call: "*->*"
    strategy: variable_type

# JPA Repository / MyBatis-Plus 的 CRUD 动词 → 读 / 写分类（P7 用）。
#
# 判据与 PHP 侧一致：接收者类型须有 `MapsTo`（由上面的 `spring-dao-maps-to-table`
# 给 DAO 补上）。只列**会真正落库**的动词，不列 `where` / `orderBy` 这类只构造
# 查询的中间方法 —— 否则同一个链式调用会被重复落成多条动作边。
#
# 边界：JPA 的**派生查询**（`findByEmail` / `countByStatus`）名字不固定，无法枚举，
# 故不在名单里 —— 这类调用不会落 `ReadsDb`，属于已知缺口。
db_verbs:
  write: ["save", "saveAll", "saveAndFlush", "insert", "updateById", "update",
          "updateBatchById", "deleteById", "delete", "deleteBatchIds", "deleteByIds",
          "deleteAll", "deleteAllById"]
  read: ["findById", "findAll", "findAllById", "getById", "getOne", "getReferenceById",
         "count", "existsById", "selectById", "selectList", "selectOne", "selectPage",
         "selectByMap", "selectCount", "list", "page"]
