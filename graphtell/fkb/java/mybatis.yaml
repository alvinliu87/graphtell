# MyBatis — a **library**-level FKB, separated out of `spring-boot.yaml`.
#
# Why it is not part of the framework file: MyBatis is a standalone ORM that happens to be commonly used
# with Spring Boot. A Spring project may just as well use JPA / Hibernate, and then none of this applies —
# yet the rules used to run for every project recognised as Spring Boot. The MyBatis-Plus annotations
# (`@TableName` / `BaseMapper`) are also hosted here, because MyBatis-Plus is just a MyBatis extension.
#
# How it works: `gt-pipeline::mybatis` parses the mapper XML and injects each statement as a **pseudo call
# site** `mybatis::select|insert|update|delete(table-name)`, owned by the Mapper interface method. These rules
# turn those pseudo call sites into `Table` nodes and `ReadsDb` / `WritesDb` edges; the third one projects the
# interface's action edges into an `interface --MapsTo--> table` hop, which is what Java's N+1 rules need.
#
# Detector note — `call_exists` cannot be used here: those pseudo call sites are injected **after** P3
# (`mybatis::run` runs between Prepare and Synthesize), so at detection time the graph does not have them yet.
# Detection therefore goes through the manifest and through imports, which cover the two real-world spellings:
# a starter dependency in `pom.xml` (matched textually — `pom.xml` is not JSON), and `@Mapper` /
# `org.apache.ibatis.*` imports in the Java sources. XML-only mappers with no Java annotation are caught by
# the first, annotation-driven ones by the second.

id: mybatis
display_name: MyBatis
language: java
version_hint: "3.x"
side: backend
scope: framework

detectors:
  - kind: manifest_dependency
    manifest: pom.xml
    dependency: mybatis
    confidence: 0.95
  - kind: import_exists
    symbol: "org.apache.ibatis"
    confidence: 0.9
  # MyBatis-Plus (a MyBatis extension that brings the `@TableName` annotation and the `BaseMapper` generic DAO)
  # is caught here too: its starter `mybatis-plus-boot-starter` already matches the `mybatis` manifest probe, and
  # the annotation import below (prefix `*` match) catches annotation-only detection when no starter dependency
  # is declared — `@TableName` lives in `com.baomidou.mybatisplus.annotation`, never as a bare package import.
  - kind: import_exists
    symbol: "com.baomidou.mybatisplus*"
    confidence: 0.9

rules:
  # `<select>` is a read, `<insert|update|delete>` are writes.
  - id: mybatis-select-table
    phase: Synthesize
    selector:
      kind: call
      callee: "mybatis::select"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: ReadsDb, direction: incoming }
          confidence: 0.85

  - id: mybatis-write-table
    phase: Synthesize
    selector:
      kind: call
      callee: "mybatis::insert|mybatis::update|mybatis::delete"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: WritesDb, direction: incoming }
          confidence: 0.85

  # The Mapper interface itself has no `MapsTo`, so on its own it produces no `WritesDb` and Java's N+1 rules
  # get disabled for "no db-write annotation at all". This supplies the interface -> table hop.
  #
  # `Project` rather than `Link`: `Link` resolves both ends with `find_by_name`, while a Table node's **fqn is
  # NULL** (only a name), so a lookup by name always misses. `Project` walks edges instead:
  #   interface --Declares--> interface method --ReadsDb/WritesDb--> table  =>  interface --MapsTo--> table.
  # Only Mapper interfaces that really carry action edges produce anything, so service interfaces see no
  # side effect.
  - id: mybatis-mapper-maps-to-table
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Interface
    binding:
      - Project:
          kind: MapsTo
          along: Declares
          from: []
          to: [ReadsDb]
          confidence: 0.8
      - Project:
          kind: MapsTo
          along: Declares
          from: []
          to: [WritesDb]
          confidence: 0.8

  # ===== P5 Synthesize: Table (MyBatis-Plus) =====
  # `@TableName("eb_user")` — the JPA `@Table` spelling lives in `fkb/java/spring-jpa.yaml`. Both are gated on the
  # project actually using that persistence library, so a Spring Boot project that uses neither produces no `Table`
  # node from these annotations.
  - id: spring-table-name-mp
    phase: Synthesize
    selector:
      kind: call
      callee: "TableName"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.85

  # ===== P5: a DAO's generic argument -> entity -> table (MyBatis-Plus) =====
  # `interface OrderMapper extends BaseMapper<Order>`: the generic argument `Order` is the entity the DAO
  # operates on — the parser records it as a `generic.BaseMapper` synthetic call site (`entity` = entity name).
  # This rule builds `References` (DAO -> entity); `spring-dao-maps-to-table` (in `spring-boot.yaml`, shared by
  # every DAO flavour) then projects along the entity's `MapsTo` into "DAO -> table".
  # `resolve` is written on **every ValueSource**: `Action::Link` runs `ev.string(src)` and then `find_by_name`
  # directly, so a top-level `resolve` does not participate. Both ends yield names: the start is the DAO's FQN,
  # the end is the entity's **short name** (resolved via the short-name index).
  - id: spring-dao-references-entity-mp
    phase: Synthesize
    selector:
      kind: call
      callee: "generic.BaseMapper|generic.Mapper"
    binding:
      - Link:
          kind: References
          from: { owner_class: true, resolve: class_const }
          to: { entity: true, resolve: class_const }
          confidence: 0.8
