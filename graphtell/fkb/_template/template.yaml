# ============================================================================
# GraphTell FKB template — copy this file, rename it to <framework>.yaml, and put it under fkb/<language>/.
# See docs/fkb-authoring.md for the detailed rules.
#
# Minimum to run: id / display_name / language / rules are the skeleton;
# detectors decide "who it applies to"; semantic_kinds decide "whether the new nodes are visible".
# When done, run `graphtell validate --fkb-dir fkb` to check.
# ============================================================================

id: my-framework            # globally unique; an external directory with the same name overrides the built-in
display_name: My Framework
language: php               # open string: php / java / javascript / … decides which sub-projects it applies to
version_hint: "*"           # display only

# --- how to detect this framework (only takes effect after a hit; open apply_without_detection only for a language-common layer) ---
detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: "my/framework"
    confidence: 0.95
  # - kind: file_exists
  #   path: some-marker-file.php
  # For a **library** (rather than a framework) prefer code evidence — a manifest says what was installed,
  # not what was used, and misses anything pulled in transitively. See docs/fkb-authoring.md §2.1:
  # - kind: import_exists
  #   symbol: "Vendor\\Package\\ClassName"
  # - kind: call_exists
  #   callee: "Vendor\\Package\\ClassName::*"

# --- "new semantic node kinds" introduced by this FKB (must be declared when absent from the kernel list, otherwise the folded view hides them) ---
# semantic_kinds: [MyKind]

# --- "new edge kinds" introduced by this FKB (isomorphic to semantic_kinds; no kinds.rs change needed) ---
# Most of the time you should reuse the built-in edge kinds (ReadsDb/WritesCache/HandledBy…); declare a new edge only when you really need one:
# semantic_edge_kinds: [SendsWebhook]   # a new semantic edge
# bridge_edge_kinds:   [MyBridge]       # a new bridge edge

# --- applies to every sub-project of the same language (open only when this file carries no strong framework assumption) ---
# apply_without_detection: true

# --- directories / files that must not be scanned (resolved in P0, before the scan) ---
# `glob` may reference this file's `root_rules` by key (`{app_root}/runtime/**`) and `{value}` from its
# own `source`; `fallbacks` are tried in order and kept only when the directory really exists.
# exclude_rules:
#   - id: generated-dir
#     glob: "{app_root}/generated/**"
#     fallbacks: ["generated/**"]

rules:
  # e.g. extract a "cache read" semantic node (remember `side`; out-of-process mediators must have it)
  # Item ids are **local**: the loader namespaces them as `<id>-<local id>`, so this one lands on the
  # graph as `my-framework-cache-read`. See docs/fkb-authoring.md §2.3.
  - id: cache-read
    phase: Synthesize
    selector:
      kind: call
      callee: "Cache::get|*Cache::get"      # `|` = or; `*` = wildcard (per the language separator)
    binding:
      - Synthesize:
          node: Cache                       # use the concrete kind directly (do not write ExternalSystem+subtype)
          identity:
            kind: Named                     # Fqn | Named | ContractId
            value: { arg: 0, require_literal: true }   # take argument 0 and require it to be a literal
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
            - name: side                    # * out-of-process mediator / asset nodes must set side
              value: { literal: "backend" } #   backend | frontend
          link:
            kind: ReadsCache                # built-in semantic edge (see the guide, section 5.4)
            direction: incoming             # incoming | outgoing | to_target
          confidence: 0.85

  # e.g. build one edge only (no node created)
  # - id: my-link
  #   phase: Synthesize
  #   selector:
  #     kind: call
  #     callee: "Something::fire"
  #   binding:
  #     - Link:
  #         kind: Triggers
  #         to: { arg: 0, require_literal: true }
  #         direction: outgoing
