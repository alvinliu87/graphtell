# CRMEB project knowledge
#
# Scope: project level (scope: project). Loaded only when the project is detected as CRMEB (detectors hit), so it
# does not pollute other ThinkPHP projects. This describes only CRMEB's **project-specific conventions**; the
# framework-common parts remain in fkb/php/thinkphp.yaml.
#
# Scheduling convention: CRMEB does not use a framework-level scheduler (ThinkPHP's core has no built-in Schedule,
# and CRMEB does not use an extension like topthink/think-schedule); instead it implements its own scheduled tasks
# as "HTTP route + external scheduler heartbeat trigger":
#   Route::get('crontab/order_cancel', 'v1.CrontabController/orderUnpaidCancel')
#     ->name('orderUnpaidCancel')->option(['real_name' => 'cancel unpaid orders automatically']);
# These routes are both ordinary HttpContracts (synthesized by thinkphp-route-http-contract) and, by this rule, additionally
# synthesized into Schedule semantic nodes with HandledBy to the corresponding CrontabController method.

# The `id` must be **unique**: the kernel takes project-level rules via `kb.by_id(id)`, and `by_id` returns only the
# first entry with a given id. Previously this file and fkb/php/crmeb.yaml (framework scope) were both named `crmeb`,
# and the framework one came first (directory order), so this file's rules (including crontab -> Schedule below) were
# entirely shadowed and never took effect. After the rename each has its place: framework level owns mechanics,
# project level owns business conventions.
id: crmeb-project
display_name: CRMEB
language: php
scope: project
version_hint: "CRMEB store"

detectors:
  # CRMEB-specific marker file: the backend scheduled-task service (a core module, stably present).
  - kind: file_exists
    path: app/services/system/crontab/SystemCrontabServices.php
    confidence: 0.9

# Magic-method forwarding: `BaseServices` declares 20+ `get` / `getOne` / `getList` / `count` / `delete` … via
# `@method`, and they are actually forwarded by `__call` to `$this->dao` (the dao's type is injected by each subclass's
# constructor, e.g. `AgentLevelServices(AgentLevelDao $dao)`).
# Without this convention `$this->services->getList()` can only fall back to a "class-level hit", and the chain
# "route -> controller -> Services -> Dao -> table" breaks at the Services hop.
magic_delegation:
  property: dao
  confidence: 0.7

rules:
  # ===== P5 Synthesize: ConfigKey =====
  # CRMEB's own `sys_config()` / `sys_config_all()`, which read the store's settings table.
  #
  # This is a **project** convention, not a ThinkPHP one — it used to live in `fkb/php/thinkphp.yaml` (its
  # comment even said so), which meant every ThinkPHP project carried a rule that only CRMEB can ever hit.
  - id: sys-config
    phase: Synthesize
    selector:
      kind: call
      callee: "sys_config|sys_config_all"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0 }
          fields:
            - name: storage
              from_symbol_table: { table: config_keys, field: storage }
            - name: value_type
              from_symbol_table: { table: config_keys, field: value_type }
            - name: mutable
              from_symbol_table: { table: config_keys, field: mutable }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9

  # ===== P5 Synthesize: scheduled tasks (Schedule) =====
  - id: schedule-task
    phase: Synthesize
    selector:
      kind: call
      callee: "think\\facade\\Route::{get,post,any,rule,put,delete,patch}|Route::{get,post,any,rule,put,delete,patch}"
      where:
        # Only crontab-prefixed routes are collected (triggered by the external scheduler), so business routes are not all treated as scheduled tasks.
        - arg_starts_with: { arg: 0, prefix: "crontab/" }
    binding:
      - Synthesize:
          node: Schedule
          identity:
            kind: Named
            value: { arg: 0 }
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: handler
              value: { arg: 1 }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: method_ref }
          confidence: 0.9
