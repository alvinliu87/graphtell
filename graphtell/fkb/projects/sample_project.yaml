id: sample_project
display_name: sample_project
language: php
scope: project
version_hint: "standard / multi-merchant"
detectors:
  # `path` must match the directory as it exists on disk inside the checkout, so it stays literal.
  - kind: file_exists
    path: crmeb
    confidence: 0.7
  - kind: file_exists
    path: app/services/system/crontab/SystemCrontabServices.php
    confidence: 0.9
middleware_capabilities:
  - matches: AuthToken
    capability: Authentication
annotation_kinds:
  - entrypoint.login
magic_delegation:
  property: dao
  confidence: 0.7
loaders:
  - id: config-keys
    table: config_keys
    from:
      kind: builtin
      name: config_keys
      params:
        accessors: ["sys_config", "sys_config_all"]
        storage: Database
        mutable: RuntimeMutable
rules:
  - id: sys-config
    phase: Synthesize
    selector:
      kind: call
      callee: "sys_config|sys_config_all"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0 }
          fields:
            - name: storage
              from_symbol_table: { table: config_keys, field: storage }
            - name: value_type
              from_symbol_table: { table: config_keys, field: value_type }
            - name: mutable
              from_symbol_table: { table: config_keys, field: mutable }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9
  - id: schedule-task
    phase: Synthesize
    selector:
      kind: call
      callee: "think\\facade\\Route::{get,post,any,rule,put,delete,patch}|Route::{get,post,any,rule,put,delete,patch}"
      where:
        - arg_starts_with: { arg: 0, prefix: "crontab/" }
    binding:
      - Synthesize:
          node: Schedule
          identity:
            kind: Named
            value: { arg: 0 }
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: handler
              value: { arg: 1 }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: method_ref }
          confidence: 0.9
  - id: login-entrypoint
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: HttpContract
      where:
        - name_matches: "login"
    binding:
      - Annotate:
          phase: Post
          channel: FkbMark
          target: matched
          annotations:
            - kind: entrypoint.login
              confidence: 0.8
          merge: MaxByKind
