# PHP 语言通用知识（跨框架，不绑定某一框架）
#
# 设计：本 FKB 声明 `apply_without_detection: true`，于是**无论工程被识别为
# ThinkPHP / Laravel / 其它 PHP 框架，其规则都对同语言子工程生效** —— 跨框架相同的
# 语义（缓存、配置读取）只写一份，新增框架无需再抄一遍（这正是 `laravel.yaml` 注释里
# 提到的「`config()` / `Cache::get()` 属于 PHP 生态通用层，应抽到语言级 FKB」）。
#
# 注意：本文件只放「各 PHP 框架写法相同」的规则；带强框架假设的规则
# （表访问 `Db::name` vs `DB::table`、路由 handler 形态、事件注册方式…）仍留在各
# 框架专属 FKB 里，避免用 A 框架知识解释 B 框架代码。
#
# 重要（装载器陷阱）：本文件**只贡献 `rules` 与 `external_calls` / `tx_calls`**，
# 不跑 `loaders`。原因是 `apply_without_detection` 的 FKB 永不被「识别」，而管线
# （`prepare.rs` 的装配阶段）只对「被识别到的框架 / 项目」调用 `run_loaders`。
# 因此 `builtin` 装载器（如 `php_db_schema` / `php_config_keys` / `php_migration_schema`）
# **必须写在各框架专属 YAML 里**，不能抽到本文件 —— 否则该装载器静默永不执行，
# 其符号表（schema / config_keys / migration 列）整张落空，相关规则静默 0 命中。
# 若要「去重」它们的 `params`，只能各框架 YAML 各声明一份（值相同但相互独立），
# 不要试图挪到本文件。

id: php-common
display_name: PHP 通用
language: php
version_hint: "*"
# 不声明 detectors：本文件不是「被识别的框架」，只是对所有 PHP 工程生效的通用层。
apply_without_detection: true

# 外部系统调用名单（供「循环内外部调用」判定）。
#
# 一次网络往返比一次数据库查询贵一个量级，把它放进循环里是比 N+1 更容易拖垮接口
# 的写法（循环发短信 / 循环查物流 / 循环取远程图片）。
# 只列**确实会发起网络请求**的 callee：`curl_*` 是 PHP 内置；
# `Http::*` 是两家框架都有的 HTTP 客户端门面；`GuzzleHttp\Client` 是 composer 生态通用。
# 匹配口径：调用点的完整 callee（`Http::get`）或方法名（`curl_exec`）命中任一即可。
external_calls:
  - "curl_exec"
  - "curl_multi_exec"
  - "curl_init"
  - "fsockopen"
  - "stream_socket_client"
  - "soapCall"
  - "__soapCall"
  - "Http::get"
  - "Http::post"
  - "Http::put"
  - "Http::delete"
  - "Http::request"
  - "Http::send"
  - "GuzzleHttp\\Client::request"
  - "GuzzleHttp\\Client::get"
  - "GuzzleHttp\\Client::post"
  - "Mail::send"
  - "Mail::raw"
  - "Mail::to"
  - "Notification::send"

# 事务边界标记（供「多次写库但未识别到事务」判定）。
#
# 命中其中任意一个即认为「该方法内出现了事务边界」，不再报 —— 保守方向：
# 宁可漏报（事务可能在更外层），也不要把包了事务的方法报成"没包"。
tx_calls:
  - "transaction"
  - "startTrans"
  - "startTrans"
  - "beginTransaction"
  - "commit"
  - "rollBack"
  - "rollback"
  - "DB::transaction"
  - "Db::transaction"

rules:
  # ===== P5 Synthesize：ConfigKey（跨框架通用：config() / Config::get / env）=====
  # 与 `Cache::get` 同理，两框架写法相同，抽到通用层避免重复。
  # CRMEB 特有的 `sys_config` 仍留在 `thinkphp6.yaml`（业务约定，非通用）。
  - id: php-common-config
    phase: Synthesize
    selector:
      kind: call
      callee: "config|Config::get|env|*Config::*"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9

# ===== 缓存 / Redis：用「能力接口声明」表达（识别机制在跨语言能力模板）=====
# 跨语言通用命名约定（`Cache` / `Redis` / `*CacheService` / `*RedisClient` …）已写在
# 核心能力模板 `cache` 里（装载器 `DEFAULT_CAPABILITIES_YAML`），对所有语言生效一次，
# 按 `Wrapper` 模式摊平成 `*Type::method`。这里只补**词根不合通用约定、必须精确声明**
# 的 PHP 库类型 —— 例如 `Predis\Client`（`*Client` 太泛会误伤 `HttpClient`/`DbClient`，
# 故不能进通用集合）。引擎把两者取并集。框架门面 `Cache::get` / 模型 `app\model\other\Cache`
# 经模板 `*Cache::get` 命中；封装层 `*CacheService` 也由模板兜底、不在此重复声明。
capability_interfaces:
  # PHP 专用 Redis 客户端：Predis（词根 `Client` 不合通用约定，精确声明为 Backend）。
  - capability: cache
    types: ["Predis\\Client"]
    read: [get, hGet, mGet]
    write: [set, hSet, del, delete]
    match_mode: by_type
