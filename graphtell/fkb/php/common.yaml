# PHP language-common knowledge (cross-framework, not tied to one framework)
#
# Design: this FKB declares `apply_without_detection: true`, so **its rules apply to sub-projects of the same
# language whether the project is detected as ThinkPHP / Laravel / another PHP framework** — semantics shared across
# frameworks (cache, config reads) are written once, and adding a framework needs no copy-paste (exactly the
# "`config()` / `Cache::get()` belong to the PHP-ecosystem common layer and should be factored into a language-level
# FKB" note in `laravel.yaml`).
#
# Note: this file only holds rules whose "spelling is identical across PHP frameworks"; rules carrying strong
# framework assumptions (table access `Db::name` vs `DB::table`, route handler shape, event registration style…)
# stay in each framework's own FKB, so framework A's knowledge is never used to explain framework B's code.
#
# Important (loader trap): this file **only contributes `rules` plus `external_calls` / `tx_calls`**; it runs no
# `loaders`. The reason is that an `apply_without_detection` FKB is never "detected", and the pipeline (the assembly
# stage in `prepare.rs`) only calls `run_loaders` for "detected frameworks / projects".
# So `builtin` loaders (such as `php_db_schema` / `php_config_keys` / `php_migration_schema`) **must be written in
# each framework-specific YAML** and cannot be factored into this file — otherwise the loader silently never runs and
# its symbol table (schema / config_keys / migration columns) comes up entirely empty, with the related rules
# silently reporting 0 hits.
# If you want to "de-duplicate" their `params`, each framework YAML declares its own copy (identical values but
# independent); do not try to move them here.

id: php-common
display_name: PHP common
language: php
version_hint: "*"
# No detectors declared: this file is not "a detected framework", just a common layer effective for every PHP project.
apply_without_detection: true

# External-system call list (used by the "external call inside a loop" judgement).
#
# One network round trip costs an order of magnitude more than one database query, so putting it inside a loop is an
# even more reliable way to drag an endpoint down than N+1 (sending SMS in a loop / querying shipping in a loop /
# fetching remote images in a loop).
# Only callees that **really issue a network request** are listed: `curl_*` is built into PHP;
# `Http::*` is the HTTP client facade both frameworks have; `GuzzleHttp\Client` is common across the composer ecosystem.
# Matching basis: a call site matches if its full callee (`Http::get`) or its method name (`curl_exec`) hits any entry.
external_calls:
  - "curl_exec"
  - "curl_multi_exec"
  - "curl_init"
  - "fsockopen"
  - "stream_socket_client"
  - "soapCall"
  - "__soapCall"
  - "Http::get"
  - "Http::post"
  - "Http::put"
  - "Http::delete"
  - "Http::request"
  - "Http::send"
  - "GuzzleHttp\\Client::request"
  - "GuzzleHttp\\Client::get"
  - "GuzzleHttp\\Client::post"
  - "Mail::send"
  - "Mail::raw"
  - "Mail::to"
  - "Notification::send"

# Transaction-boundary markers (used by the "multiple database writes with no transaction recognised" judgement).
#
# Hitting any one of them means "a transaction boundary appears inside this method" and it is not reported — the
# conservative direction: better to under-report (the transaction may live further out) than to report a wrapped
# method as "not wrapped".
tx_calls:
  - "transaction"
  - "startTrans"
  - "startTrans"
  - "beginTransaction"
  - "commit"
  - "rollBack"
  - "rollback"
  - "DB::transaction"
  - "Db::transaction"

rules:
  # ===== P5 Synthesize: ConfigKey (cross-framework common: config() / Config::get / env) =====
  # Same reasoning as `Cache::get`: the spelling is identical in both frameworks, so it is factored out to avoid duplication.
  # CRMEB's own `sys_config` stays in `thinkphp6.yaml` (a business convention, not a generic one).
  - id: php-common-config
    phase: Synthesize
    selector:
      kind: call
      callee: "config|Config::get|env|*Config::*"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9

# ===== Cache / Redis: expressed via a "capability interface declaration" (the recognition mechanism lives in the cross-language capability template) =====
# The cross-language common naming conventions (`Cache` / `Redis` / `*CacheService` / `*RedisClient` …) are already
# written in the core capability template `cache` (loader `DEFAULT_CAPABILITIES_YAML`), applied once for every
# language and flattened as `*Type::method` under the `Wrapper` mode. This only adds PHP library types whose **word
# root does not fit the common convention and must be declared precisely** — e.g. `Predis\Client` (`*Client` is too
# generic and would misfire on `HttpClient`/`DbClient`, so it cannot go into the common set). The engine takes the
# union of both. Framework facades `Cache::get` and the model `app\model\other\Cache` are hit by the template
# `*Cache::get`; the wrapper layer `*CacheService` is also covered by the template and not repeated here.
capability_interfaces:
  # PHP-specific Redis client: Predis (the `Client` root does not fit the common convention, so it is declared precisely as Backend).
  - capability: cache
    types: ["Predis\\Client"]
    read: [get, hGet, mGet]
    write: [set, hSet, del, delete]
    match_mode: by_type
