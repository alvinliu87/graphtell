# PHP language-common knowledge (cross-framework, not tied to one framework)
#
# Design: this FKB declares `apply_without_detection: true`, so **its rules apply to sub-projects of the same
# language whether the project is detected as ThinkPHP / Laravel / another PHP framework** — semantics shared across
# frameworks (cache, config reads) are written once, and adding a framework needs no copy-paste (exactly the
# "`config()` / `Cache::get()` belong to the PHP-ecosystem common layer and should be factored into a language-level
# FKB" note in `laravel.yaml`).
#
# Note: this file only holds rules whose "spelling is identical across PHP frameworks"; rules carrying strong
# framework assumptions (table access `Db::name` vs `DB::table`, route handler shape, event registration style…)
# stay in each framework's own FKB, and conventions belonging to a single product (e.g. a project's `sys_config()`)
# go to `fkb/projects/<product>.yaml`, so framework A's knowledge is never used to explain framework B's code.
#
# On `loaders`: an unconditional FKB's loaders **do** run, so a framework-independent loader can live here
# (or in `fkb/universal/`).
#
# The loaders still listed in the framework files are there for a different reason: their `params` are
# framework-specific paths and spellings. `db_schema` needs to know the framework's table receivers
# (`Db::name` vs `DB::table`), `migration_schema` needs the migrations directory, `config_keys` the
# config layout — values that differ per framework, so each declares its own copy. Factoring them out would
# need the params to become variables, which the schema does not have yet.

id: php-common
display_name: PHP common
language: php
version_hint: "*"
side: backend
# No detectors declared: this file is not "a detected framework", just a common layer effective for every PHP project.
apply_without_detection: true

# Signature-verification vocabulary (used by the P11 Sign phase).
#
# "Which calls compute a signature" and "which algorithms are weak" are PHP / library knowledge, so they are
# declared here rather than built into the kernel — a stack that declares nothing is simply not judged,
# instead of inheriting PHP's vocabulary. Note `hash_equals` is listed as a *hash call* (it is what makes a
# comparison constant-time) but is **not** in `weak_algos`: it is the correct form, not a weak one.
sign_check:
  hash_calls: [md5, sha1, hash_hmac, hash_equals, openssl_verify, openssl_sign]
  weak_algos: [md5, sha1]
  # `CreatedSign` / `GetSign` / `makeSign` / `verifySign` — a home-grown verifier need not be a known function.
  name_contains: "sign"
  # …but in e-commerce code `sign` is overwhelmingly check-ins: measured 24 of 32 "`==` comparisons
  # containing sign" were `$sign_mode` / `$sign_last_date` / `$points_sign_enabled`.
  name_excludes: [signtype, signmode, signin, signup]
  # An argument mentioning `sign` is signature-related on its own; `key=` is only a hint when a signature
  # comparison really exists in the same function.
  value_hints: ["sign"]
  value_hints_require_compare: ["key="]

# SQL-injection vocabulary (used by the P9 Taint phase).
#
# Which ORM methods run raw SQL and which expressions read user input is framework / PHP knowledge, so it is
# declared here rather than built into the kernel — a stack that declares nothing gets no taint judgement.
# (How a variable is *written* is not here: that is parser notation, `LanguageParser::variable_prefixes`.)
taint:
  # Argument 0 is the SQL text. `receiver` binds a sink to a receiver — bare `query` would match any
  # `->query()` — while omitting it means "raw SQL however it is reached".
  raw_sql_sinks:
    - { method: query, receiver: Db }
    - { method: execute, receiver: Db }
    - { method: whereRaw }
    - { method: whereExp }
    - { method: raw }
  # In the where family the injection form is "a variable embedded in the condition string"
  # (`whereLike` uses parameterised escaping, so it is deliberately not listed).
  where_interp_sinks: [where, whereOr]
  # Deliberately conservative: only framework / superglobal parameter-taking forms. `$request` counts too —
  # it is a Request object when injected. Better a miss (caught by `rules_silent`) than misjudging a config
  # read as user input.
  request_sources:
    - "$_get"
    - "$_post"
    - "$_request"
    - "$_cookie"
    - "$_files"
    - "request()"
    - "request::"
    - "$request"
    - "->param("
    - "->input("
    - "->get("
    - "->post("
    - "->all("
    - "->only("
    - "->except("
    - "input("

# External-system call list (used by the "external call inside a loop" judgement).
#
# One network round trip costs an order of magnitude more than one database query, so putting it inside a loop is an
# even more reliable way to drag an endpoint down than N+1 (sending SMS in a loop / querying shipping in a loop /
# fetching remote images in a loop).
# Only callees that **really issue a network request** are listed: `curl_*` is built into PHP;
# `Http::*` is the HTTP client facade both frameworks have.
# Matching basis: a call site matches if its full callee (`Http::get`) or its method name (`curl_exec`) hits any entry.
#
# `GuzzleHttp\Client::*` is not listed here: it is a claim about Guzzle, so it belongs to `guzzle.yaml`,
# which is detected by `import_exists` / `call_exists` — i.e. it fires only for projects that really
# reach for Guzzle, instead of for every PHP project.
external_calls:
  - "curl_exec"
  - "curl_multi_exec"
  - "curl_init"
  - "fsockopen"
  - "stream_socket_client"
  - "soapCall"
  - "__soapCall"
  - "Http::get"
  - "Http::post"
  - "Http::put"
  - "Http::delete"
  - "Http::request"
  - "Http::send"
  - "Mail::send"
  - "Mail::raw"
  - "Mail::to"
  - "Notification::send"

# Transaction-boundary markers (used by the "multiple database writes with no transaction recognised" judgement).
#
# Hitting any one of them means "a transaction boundary appears inside this method" and it is not reported — the
# conservative direction: better to under-report (the transaction may live further out) than to report a wrapped
# method as "not wrapped".
#
# Only spellings that are genuinely framework-independent belong here. `DB::transaction` (Laravel) and
# `Db::transaction` (ThinkPHP) are not listed — each is one framework's facade, so they belong to
# `illuminate-database.yaml` and `thinkphp.yaml` respectively.
tx_calls:
  - "transaction"
  - "startTrans"
  - "beginTransaction"
  - "commit"
  - "rollBack"
  - "rollback"

rules:
  # ===== P5 Synthesize: ConfigKey (cross-framework common: config() / Config::get / env) =====
  # Same reasoning as `Cache::get`: the spelling is identical in both frameworks, so it is factored out to avoid duplication.
  - id: cache-predis-read
    phase: Synthesize
    selector:
      kind: call
      callee: "Predis\\Client::get|*Client::get|Predis\\Client::hGet|*Client::hGet|Predis\\Client::mGet|*Client::mGet"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: ReadsCache, direction: incoming, confidence: 0.85 }
          confidence: 0.85
  - id: cache-predis-write
    phase: Synthesize
    selector:
      kind: call
      callee: "Predis\\Client::set|*Client::set|Predis\\Client::hSet|*Client::hSet|Predis\\Client::del|*Client::del|Predis\\Client::delete|*Client::delete"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Cache
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
            value_fallback: { literal: "Cache" }
          fields:
            - name: key
              value: { arg: 0, require_literal: true }
          link: { kind: WritesCache, direction: incoming, confidence: 0.85 }
          confidence: 0.85
  - id: config
    phase: Synthesize
    selector:
      kind: call
      callee: "config|Config::get|env|*Config::*"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9


