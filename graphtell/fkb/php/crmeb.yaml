# **Project-specific** knowledge for the CRMEB e-commerce system (ThinkPHP 6 ecosystem)
#
# Division of labour with thinkphp6.yaml:
#   thinkphp6.yaml — framework mechanics (routes, container, events, ORM) + cross-version common P6 annotations
#                    (PII / table criticality / config mutability / public endpoints / i18n, parameters generalised)
#   crmeb.yaml     — only CRMEB-specific data additions and business semantics:
#                    the `contact_phone` column-name addition, and the business entry `entrypoint.login`
#
# The rule selectors here are almost all `kind: node` (acting on nodes already built on the graph),
#
# because something like "this table contains phone numbers" is only known after P5 has aggregated the table node and P3 has loaded the schema.

id: crmeb
display_name: CRMEB
language: php
version_hint: "standard / multi-merchant"

# "Which middleware provides which capability" — this is **this project's own naming convention** (the kernel
# should not know a name like `AuthTokenMiddleware`), so it is declared in FKB and landed by P5.5 on the contract's
# `Capability` channel.
#
# Only entries **certain from the name alone** are listed: same-meaning names under several app directories
# (`AuthTokenMiddleware` / `KefuAuthTokenMiddleware`) are both matched by the `AuthToken` fragment.
# When the attached argument explicitly says optional (`AuthTokenMiddleware::class, false` == reachable without
# login) no capability is produced — calling "optional" "mandatory" would be fabrication.
middleware_capabilities:
  - matches: AuthToken
    capability: Authentication

detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: crmeb/crmeb
    confidence: 0.9
  - kind: file_exists
    path: crmeb
    confidence: 0.7
  - kind: file_exists
    path: app/services
    confidence: 0.5

annotation_kinds:
  # Business-specific annotation kinds (beyond the kernel standard): `entrypoint.login` is CRMEB's login-entry
  # semantics, produced by the `crmeb-login-entrypoint` raw rule below. Standard kinds (pii / data.criticality /
  # auth.public / i18n.missing_locale …) are produced by the kernel's `annotation_templates` recognizer and are not
  # listed here — a stack does not invent annotation kinds.
  - entrypoint.login

# ===== P6 annotation: reference the kernel-standard recognizers, implemented with this stack's data (column names / source tables / thresholds) =====
# "Which annotation kinds exist and how they are recognised" is a **kernel standard** (see `DEFAULT_ANNOTATIONS_YAML`);
# this only declares CRMEB's data. Generic PII column names (phone / email / idcard…) are already a cross-application
# convention, while business-domain column names (contact_phone) remain stack-specific — kept as parameters rather
# than hard-coded into the recognizer.
# The generic recognizers and generic parameters for PII / criticality / config / public endpoints / i18n were moved
# up into `thinkphp6.yaml` (the stack implementation of the kernel-standard `annotation_templates`). Only CRMEB's own
# parameter addition stays here: the `contact_phone` column name. The two rules match independently and `MaxByKind`
# merges them, with no conflict.
annotation_interfaces:
  - annotation: pii
    params:
      table: schema
      names: [contact_phone]
      subkind: phone

rules:
  # ===== P6: mark "entry point" semantics on HttpContracts (CRMEB business-specific, kept in the stack) =====
  - id: crmeb-login-entrypoint
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: HttpContract
      where:
        - name_matches: "login"
    binding:
      - Annotate:
          phase: Post
          channel: FkbMark
          target: matched
          annotations:
            - kind: entrypoint.login
              confidence: 0.8
          merge: MaxByKind
