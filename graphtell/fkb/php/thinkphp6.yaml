# ThinkPHP framework knowledge (**shape-level**, not per-version)
#
# This only describes "how to recognise / how to resolve / how to build the graph"; it contains no Rust code.
# Adding a framework = adding one more YAML file like this.
#
# Coverage: **5.1 / 6.x / 8.x — one API-shape family**.
# All three share the `think\facade\*` facades, `Db::name` / `Model`, `Route::{get,post,...}` and
# `config/database.php` core shape; the differences are only in a few file names and entry names:
#   * event registry: 5.x calls it `app/tags.php` (behaviour extension), 6.x+ calls it `app/event.php`
#   * event trigger: 5.x uses `Hook::listen`, 6.x+ uses `event()` / `Event::trigger`
#   * framework source dir: 5.x is `thinkphp/` (**not excluded by Ingest, see the TODO at the end**),
#     6.x+ is `vendor/topthink/framework/` (already excluded by the generic rule)
#   * app root: 5.x commonly `application/`, 6.x+ is `app/` (already covered by root_rules.fallbacks)
# These differences are **absorbed by data inside this file** (parallel selectors / dual loaders / fallbacks)
# rather than splitting files by major version — see the shape-splitting convention in `fkb/README`.

id: thinkphp6
display_name: ThinkPHP 6
language: php
version_hint: "5.1 / 6.x / 8.x"
# NOTE: this field currently has **no effect** — Ingest (P0) runs before framework detection (P3),
# so files cannot be filtered per FKB; what actually applies is `ProjectConfig.exclude_globs` (project level).
# Kept here only to record the intent; it will be wired up once Ingest supports pre-detection.
exclude_globs:
  - "runtime/**"
  - "public/static/**"
  - "extend/**"
  - "thinkphp/**"

# Same as `laravel.yaml`: model relations are "code node -> code node" (bridge edges), table foreign keys
# are "table -> table" (both ends semantic) (semantic edges). The relation APIs of the two PHP frameworks
# have the same names and shapes, but relation methods are an **ORM-specific assumption**, so following the
# `db_verbs` precedent each framework declares its own copy instead of factoring it into `php-common`
# (that one applies unconditionally to every PHP project).
semantic_edge_kinds: [ForeignKey]
bridge_edge_kinds: [References]

# ---------------------------------------------------------------- detection
detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: topthink/framework
    confidence: 0.95
  - kind: file_exists
    path: think
    confidence: 0.5

# ---------------------------------------------------------------- framework root
# Resolve AppRoot from composer.json's autoload.psr-4:
#   { "autoload": { "psr-4": { "app\\": "app/", "crmeb\\": "crmeb/" } } }
#   -> AppRoot = "app", confidence 1.0, and `source` records the basis of the resolution
root_rules:
  - id: tp6-app-root
    key: app_root
    source:
      kind: manifest_json
      manifest: composer.json
      pointer: autoload.psr-4
      pick: shallowest_dir
    confidence: 1.0
    fallbacks:
      - app
      - application
      - src

  # Auto-detect the database table prefix: ThinkPHP writes the prefix into `config/database.php`'s
  # `connections.<driver>.prefix`. The result is written to the `db_prefix` fact, and P3 configures
  # table_prefixes for the whole project from it, avoiding hard-coding CRMEB's `eb_` in the generic layer.
  - id: tp6-db-prefix
    key: db_prefix
    source:
      kind: manifest_php
      manifest: config/database.php
      pointer: connections.mysql.prefix
    confidence: 1.0

# ---------------------------------------------------------------- route handler
# A ThinkPHP handler looks like `'admin.Login/login'`, `'v1.CrontabController/orderUnpaidCancel'`:
#   * a dot means the controller's sub-directory (`v1.agent.AgentManage` -> `v1\agent\AgentManage`)
#   * a slash separates the method name
# Controllers all live under `app/<app-section>/controller/`; the app section is inferred from the route
# file path (`app/api/route/pc.php` -> `api`), and when it cannot be inferred the candidates below are tried one by one.
#
# This block **used to be hard-coded in the kernel** (the `app\{app}\controller\{C}` template in `resolve.rs`
# and the `["api","adminapi","outapi","kefuapi","index"]` allowlist); it now lives in FKB.
handler:
  method_separators: ["/"]
  hierarchy_separators: ["."]
  class_templates:
    - "app\\{app}\\controller\\{controller}"
    - "app\\{app}\\controller\\v1\\{controller}"
    # Single-app shape (the official TP6 skeleton / projects without multi-app): controllers sit directly
    # under `app/controller/` and their FQN has **no `{app}` segment**, so the candidate must be listed separately.
    # A template only matches when that class really is on the graph, so extra templates create no false edges.
    - "app\\controller\\{controller}"
  app_segments: ["api", "adminapi", "outapi", "kefuapi", "index"]
  app_anchor_dir: "route"
  app_fallback: "api"

# Consumer entry method names: when linking to a class, which method to prefer.
#   `handle` for event listeners, `doJob`/`fire` for queue Jobs (CRMEB `QueueTrait` convention),
#   `run` for TP5 behaviour classes (Behavior). Once declared, the kernel's default set no longer applies.
entry_methods: ["handle", "doJob", "fire", "run", "__invoke"]

# Data-model CRUD verbs -> read / write classification (pairs with MapsTo; see P7 verb classification).
#
# ThinkPHP's Model / Query API: `$model->save()` is a write, `$model->find()` is a read.
# Without this list, `entry -> model -> table` can only propagate the vague "maps to" everywhere —
# seeing "maps to goods" in the view gives the user no way to tell whether that entry reads or writes
# (observed feedback). Method names are case-insensitive; the list is a framework-API convention and
# the kernel knows none of these names itself.
db_verbs:
  write: ["save", "saveAll", "insert", "insertAll", "insertGetId", "update", "updateAll",
          "delete", "deleteAll", "replace", "setInc", "setDec"]
  read:  ["find", "select", "value", "column", "count", "sum", "max", "min", "avg", "paginate", "cursor", "findOrEmpty", "selectOrFail", "findOrFail", "detail", "getInfo", "getList", "getAll", "getTree", "getData", "getDetail", "getTreeData"]

# ---------------------------------------------------------------- P3 loading
loaders:
  # FacadeMap: given by framework knowledge (authoritative), never guessed
  - id: tp6-facade-map
    table: facade_map
    from:
      kind: inline
      rows:
        - { facade: "think\\facade\\Cache", target: "think\\Cache" }
        - { facade: "think\\facade\\Db", target: "think\\Db" }
        - { facade: "think\\facade\\Config", target: "think\\Config" }
        - { facade: "think\\facade\\Env", target: "think\\Env" }
        - { facade: "think\\facade\\Log", target: "think\\Log" }
        - { facade: "think\\facade\\Queue", target: "think\\queue\\Queue" }
        - { facade: "think\\facade\\Request", target: "think\\Request" }
        - { facade: "think\\facade\\Route", target: "think\\Route" }
        - { facade: "think\\facade\\Session", target: "think\\Session" }
        - { facade: "think\\facade\\View", target: "think\\View" }
  # Container bindings: app/provider.php
  - id: tp6-container-bindings
    table: container_bindings
    from:
      kind: file
      path: "{app_root}/provider.php"
      format: php
  # Event listener registry: app/event.php (6.x+ shape)
  - id: tp6-event-listeners
    table: event_listeners
    from:
      kind: file
      path: "{app_root}/event.php"
      key_path: listen
      format: php
  # Behaviour extension registry: app/tags.php (**5.x shape**).
  # TP5 calls events "behaviours (Behavior)"; the registry is `tags.php` and is **flat**
  # (`'sms_send' => [Listener::class]`), with no 6.x-style outer `listen` key.
  # The loader skips the file silently when it is absent, so there is no side effect on 6.x+ projects.
  - id: tp6-behavior-listeners
    table: event_listeners
    from:
      kind: file
      path: "{app_root}/tags.php"
      format: php
  # Database schema (collected from SQL install scripts / table names in the source)
  - id: tp6-db-schema
    table: schema
    from:
      kind: builtin
      name: php_db_schema
      # Table-name recognition: ThinkPHP uses `Db::name` / `Model` / `Query`, the same shape as Laravel.
      # The match strings are declared by FKB `params` (not hard-coded in the kernel) — note that
      # `php/common.yaml` with `apply_without_detection` only contributes rules and runs no loader,
      # so this framework still has to declare them here.
      params:
        table_receivers: ["Db", "\\Db", "Query", "Model"]
        table_methods: ["name", "table"]
  # Config-key authoritative source
  - id: tp6-config-keys
    table: config_keys
    from:
      kind: builtin
      name: php_config_keys
      # Config accessors: ThinkPHP uses `sys_config` / `config`, Laravel uses `config` / `env`.
      params:
        accessors: ["sys_config", "sys_config_all", "config", "env", "Env::get"]
        suffixes: ["::get"]
  # I18n (lang/<locale>/*.php)
  - id: tp6-i18n
    table: i18n
    from:
      kind: glob
      pattern: "lang/*/*.php"
      locale_regex: "lang/([^/]+)/"
      format: php
  # Route table (collected from Route:: calls) — the recognition logic is declared by `route_guards` below; the kernel no longer hard-codes it.
  - id: tp6-route-list
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}
  # Declarative middleware (registered by file, not a `->middleware()` call chain):
  # ThinkPHP global middleware `app/middleware.php` (a bare class array) applies to every route;
  # in multi-app mode `'middleware' => [...]` in `app/<app>/config/route.php` applies only to that app's routes.
  # Both are attached to `route_list`, and P14 promotes them to Middleware nodes + PassesThrough edges.
  # Paths / keys / scopes are all declared here; the kernel's `declared_middleware` loader knows no framework.
  - id: tp6-middleware-global
    table: route_list
    from:
      kind: builtin
      name: declared_middleware
      params:
        paths: ["app/middleware.php"]
        scope: global
  - id: tp6-middleware-per-app
    table: route_list
    from:
      kind: builtin
      name: declared_middleware
      params:
        paths: ["app/*/config/route.php"]
        key: middleware
        scope: per_app
  # Nginx config
  - id: nginx-config
    table: nginx
    from:
      kind: builtin
      name: nginx_config
      params: {}

# ---------------------------------------------------------------- route-guard recognition
# Fully declarative: how middleware is attached, how verbs are mapped and what the group-prefix method is
# called are all given here; the generic extractor (the `routes` loader) collects guards from the call graph
# accordingly and writes them into `route_list`.
route_guards:
  route_calls:
    - receiver: "Route"
      verb_methods:
        get: GET
        post: POST
        put: PUT
        delete: DELETE
        patch: PATCH
        any: ANY
        rule: ANY
      path_arg: 0
      handler_arg: 1
      group_method: group
  guard_attach:
    kind: chain
    method: middleware
    arg_index: 0
    arg2_index: 1

# ---------------------------------------------------------------- P7 resolution
resolvers:
  - id: tp6-container-make
    call: "app()->make|app|make|invoke"
    strategy: container
  - id: tp6-event-trigger
    call: "event|Event::trigger"
    strategy: event
  # 5.x shape: `Hook::listen('sms_send', $params)` / `hook('sms_send')`.
  # Synonymous with 6.x's `event('x')` — arg0 is the event name and is resolved through the L3 alias index
  # to the event node synthesized from `tags.php` / `event.php`.
  # Note it uses `event` and not `event_listen`: the latter's arg1 is a **listener class**
  # (`Event::listen('x', Listener::class)`), while `Hook::listen`'s arg1 is a **payload parameter**.
  - id: tp6-hook-trigger
    call: "Hook::listen|hook"
    strategy: event
  # Runtime event listener registration: `Event::listen('x', Listener::class)`.
  # arg0 resolves to the event node (event_name alias), and `apply_resolution` then points the `HandledBy` edge
  # from the event node to the arg1 listener.
  # Note: in `Event::subscribe(Sub::class)` arg0 is a "subscriber class", not an event name (the event name lives
  # inside its subscribe() body), so it cannot be linked back to a concrete event and is only marked `listener`
  # by the `tp6-event-listener-registration` rule — no edge is created here.
  - id: tp6-event-listen
    call: "Event::listen"
    strategy: event_listen
  - id: tp6-facade
    call: "think\\facade\\*::*"
    strategy: facade
  - id: tp6-accessor
    call: "*->get*Attr"
    strategy: accessor
  # "Current class" calls in a static context: `self::detail()` / `static::deleteAll()`.
  # Syntactically these use `::` (not `->`), so the original `*->*` resolver never matched them, which meant
  # these read / write verbs could never produce a `ReadsDb` / `WritesDb`. `receiver_type_fqn` already treats
  # `self` / `static` as the class defining the method; this only routes them through VariableType resolution too.
  - id: tp6-static-self-call
    call: "self::*|static::*|Self::*|Static::*"
    strategy: variable_type
  # Instance method calls: `$services->appAuth()`. Types come from method parameter type hints and constructor
  # property injection (`__construct(T $x){ $this->p = $x; }`), ThinkPHP's DI convention.
  # No edge is created for an unknown type — better a missing edge than a wrong one.
  - id: tp6-typed-instance-call
    call: "*->*"
    strategy: variable_type

# ---------------------------------------------------------------- P6 annotation: kernel-standard recognizers + this stack's data
# "Which annotation kinds exist and how they are recognised" is a kernel standard (see `DEFAULT_ANNOTATIONS_YAML`);
# this only declares the data common across ThinkPHP versions. Project-specific parameters (e.g. CRMEB's
# `contact_phone` column name) are appended by each project's FKB and take effect as a union (both rules match
# independently and MaxByKind merges them, with no conflict).
annotation_interfaces:
  - annotation: pii
    params:
      table: schema
      names: [phone, mobile, tel, idcard, email]
      subkind: phone
  - annotation: table_criticality
    params:
      thresholds: { high: 50, medium: 10 }
  - annotation: config_metadata
    params:
      table: config_keys
  - annotation: public_endpoint
    params:
      caps: [Authentication, Authorization]
  - annotation: i18n_coverage
    params: {}

# ---------------------------------------------------------------- rules
rules:
  # ===== P4 Annotate-Pre: taint semantics =====
  - id: tp6-sanitizer-param
    phase: AnnotatePre
    selector:
      kind: call
      callee: "*:where|*:whereLike|*:whereIn|*:whereOr|*:bind"
    binding:
      - Annotate:
          channel: Taint
          target: matched
          annotations:
            - kind: sanitizer
              subkind: { literal: Parameterized }
              confidence: 0.9
          merge: Coexist

  - id: tp6-sink-raw-sql
    phase: AnnotatePre
    selector:
      kind: call
      callee: "*:whereRaw|*:whereExp|Db::raw|*:query|*:execute"
    binding:
      - Annotate:
          channel: Taint
          target: matched
          annotations:
            - kind: sink
              subkind: { literal: RawSql }
              severity: critical
              confidence: 0.9
          merge: Coexist

  - id: tp6-source-request
    phase: AnnotatePre
    selector:
      kind: call
      # `input()` is the most common framework global helper for reading HTTP input in TP/CRMEB (bare function form).
      # `param` exists only on Request, so the `*` wildcard is kept to cover aliases like `$this->request->param()`;
      # `get`/`post` also exist on Cache/Session/Cookie/Model objects, so they are narrowed to the request helper
      # and the `think\facade\Request` facade, avoiding `cache()->get()` and similar being marked as HttpRequest sources.
      # The bare `request()` helper is not annotated here: it returns a Request object, and the real taint source is
      # its `param/get/post` access, already covered by the patterns below.
      callee: "*:param|request->get|request->post|Request::get|Request::post|input"
    binding:
      - Annotate:
          channel: Taint
          target: matched
          annotations:
            - kind: source
              subkind: { literal: HttpRequest }
              confidence: 0.9
          merge: Coexist

  # ===== P5 Synthesize: Table (three hooks converge on the same identity) =====
  - id: tp6-db-name-table
    phase: Synthesize
    selector:
      kind: call
      callee: "think\\facade\\Db::name|Db::name|*:name|*:table"
      where:
        # Intersect with the schema loaded by P3: avoids treating `Route::name('xxx')` as a table
        - in_symbol_table: { table: schema, key_of: { arg: 0 } }
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              normalize:
                - strip_prefix: []
                - singularize
                - strip_prefix: []
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          # Only a **neutral** `MapsTo` can be produced: all P5 knows is "this method touched that table";
          # the terminal verb (`->find()` vs `->update()`) is only known at P7
          # (see `resolve.rs::classify_facade_db_calls` and FKB's `db_verbs`).
          #
          # This used to produce `ReadsDb`, so `Db::name('Goods')->insertGetId($data)` was also asserted as
          # "this method read goods": the same "method -> table" pair carried both a fake read edge and the real
          # write edge produced by P7, and the view tie-break always picks the earlier one (P5 before P7), so
          # writes were **all** displayed as "reads DB" — measured on shopxo: 1825 / 1825, no exception.
          #
          # `MapsTo` means "a structural mapping between model / table" and is overridden by P7's `ReadsDb` /
          # `WritesDb` (see `view_service::access_rank` and P8's MapsTo suppression), so it only shows as a
          # fallback "maps to" when P7 did not recognise the verb either — honest, rather than inventing a read.
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.95

  - id: tp6-model-table-property
    phase: Synthesize
    selector:
      kind: inheritance
      base: "think\\Model|Model"
      with_property: "table"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              property: "table"
              normalize:
                - strip_prefix: []
                - singularize
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.95

  - id: tp6-model-table-convention
    phase: Synthesize
    selector:
      kind: inheritance
      base: "think\\Model|Model"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              self: true
              transform: { snake_plural: true, strip_namespace: true }
              normalize:
                - strip_prefix: []
                - singularize
                - trim
          # `side` is mandatory: the identity **merge key includes scope** (derived from side).
          # Without it, the table built by this rule (`app\model\user\User` -> `user`) and the same-named table
          # built by `tp6-db-name-table` (`Db::name('user')` -> `user`) get inconsistent scopes and are judged as
          # two different identities, so one table appears as **two nodes** on the graph and idempotent merging
          # breaks (measured on CRMEB: the user table had 2 nodes, each with only half of its sources).
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.6

  # ===== P5 Synthesize: model relations =====
  # `public function profile() { return $this->hasOne(Profile::class); }`
  # ThinkPHP's relation API is **identical in name and shape** to Eloquent's (`hasOne` / `hasMany` / `belongsTo` /
  # `belongsToMany` / `morphXxx`), so the rule matches `laravel-model-relation`;
  # both sides are built (Laravel / ThinkPHP projects often declare only one side, so building one side would lose a lot of edges).
  - id: tp6-model-relation
    phase: Synthesize
    selector:
      kind: call
      callee: "$this->hasOne|$this->hasMany|$this->belongsTo|$this->belongsToMany|$this->hasOneThrough|$this->hasManyThrough|$this->morphOne|$this->morphMany|$this->morphToMany|$this->morphedByMany|$this->morphTo"
    binding:
      - Link:
          kind: References
          from: { owner_class: true, resolve: class_const }
          to: { arg: 0, resolve: class_const, require_class: true }
          confidence: 0.75

  # ===== P6 AnnotatePost: model relation -> table-level foreign key =====
  # Each end walks one `MapsTo` hop down to its own table (edges built by `tp6-model-table-property` /
  # `tp6-model-table-convention`). One-to-many; when one end has no table this entry is skipped.
  - id: tp6-table-foreign-key
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Class
    binding:
      - Project:
          kind: ForeignKey
          along: References
          from: [MapsTo]
          to: [MapsTo]
          confidence: 0.7

  # ===== P5 Synthesize：ConfigKey =====
  - id: tp6-sys-config
    phase: Synthesize
    selector:
      kind: call
      # Cross-framework spellings such as `config()` / `Cache::get()` were factored into `fkb/php/common.yaml`
      # (`php-common-config`). Only CRMEB's own `sys_config` stays here.
      callee: "sys_config|sys_config_all"
    binding:
      - Synthesize:
          node: ConfigKey
          identity:
            kind: Named
            value: { arg: 0 }
          fields:
            - name: side
              value: { literal: "backend" }
            - name: storage
              from_symbol_table: { table: config_keys, field: storage }
            - name: value_type
              from_symbol_table: { table: config_keys, field: value_type }
            - name: mutable
              from_symbol_table: { table: config_keys, field: mutable }
          link: { kind: ReadsConfig, direction: incoming }
          confidence: 0.9

  # ===== P5 Synthesize: Cache =====
  # Factored into the language-common layer `fkb/php/common.yaml` (`php-common-cache-*` rules), effective for
  # every PHP framework, so each framework FKB does not repeat the same cache-recognition logic.

  # ===== P5 Synthesize: queue topic =====
  #
  # Identity extraction strategy (framework-agnostic, generic):
  # * prefer `arg:0` (the Job class given explicitly in `Queue::push($jobClass)`), with `require_class`
  #   guaranteeing only classes that really exist are accepted;
  # * fall back to `owner_class` when unavailable — i.e. "the class that issued the call". This covers exactly
  #   the self-enqueue pattern (e.g. CRMEB's `QueueTrait::dispatch` setting the consumer to the calling class via
  #   `->job(__CLASS__)`): here `arg:0` is the action string `$action`, not a class, so after `require_class`
  #   rejects it we fall back to the service class that made the call and the topic becomes that service.
  #   So "supporting the single framework think\facade\Queue" automatically benefits every project that uses
  #   queues through facades / wrappers / traits, without any project-level FKB.
  - id: tp6-queue-topic
    phase: Synthesize
    selector:
      kind: call
      callee: "Queue::push|Queue::later|*:dispatch"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Queue
          identity:
            kind: Named
            value:
              arg: 0
              resolve: class_const
              require_class: true
              transform: { class_to_topic: true }
            value_fallback:
              owner_class: true
              transform: { class_to_topic: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.85
      # Consumer side: queue messages are consumed by the Job class (its `fire()` / `handle()` processes the
      # delivered task). Symmetrical to `Event::listen` -> `HandledBy`: the Job class is linked back to the Queue
      # with a `HandledBy` edge, so the "queue perspective" shows both "who publishes" (PublishesTo) and
      # "who consumes" (HandledBy).
      # The same identity merges into one node by queue name; if the Job class is not defined inside the codebase,
      # it degrades to a PendingLink for P7 to resolve (same mechanism as route handlers).
      - Synthesize:
          node: ExternalSystem
          subtype: Queue
          identity:
            kind: Named
            value:
              arg: 0
              resolve: class_const
              require_class: true
              transform: { class_to_topic: true }
            value_fallback:
              owner_class: true
              transform: { class_to_topic: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            # Prefer resolving the consumer from `arg:0` (e.g. `JobClass::dispatch('action')` -> `JobClass::action`);
            # fall back to `receiver_class` (the enqueued Job class itself, e.g. `ProductLogJob`, whose `doJob`
            # method is the consumer entry) so the consumer is not lost entirely when `arg:0` is an array / action name.
            to: { arg: 0, resolve: class_const }
            to_fallback: { receiver_class: true }
          confidence: 0.85

  # ===== P5 Synthesize: HTTP contract bridge (backend side) =====
  - id: tp6-route-http-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "think\\facade\\Route::{post,get,any,rule,put,delete,patch}|Route::{post,get,any,rule,put,delete,patch}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            # `Route::rule` means "any HTTP method" in ThinkPHP semantics, synonymous with `Route::any`;
            # the method name `rule` is upper-cased to `RULE` and then normalised to `ANY`, avoiding a meaningless
            # `RULE` verb in the UI.
            method: { method_name: true, normalize: [upper, { replace: { from: "RULE", to: "ANY" } }] }
            path:
              arg: 0
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                # `/:id` collapses to `/:*`: converge by shape with the front-end's concatenated `/:param` URLs
                - param_wildcard
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: handler
              value: { arg: 1 }
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: handler_pattern }
          confidence: 0.95

  # ===== P5 Synthesize: HTTP contract bridge (backend side · REST resource) =====
  # One `Route::resource('cms', 'v1.cms.Article')` statement is really **7 contracts**:
  #   index / create / save / read / edit / update / delete
  # The expansion table lives in FKB (the kernel only knows "one call expands into N nodes"), and the action
  # filtering of `->only([...])` / `->except([...])` is read by the kernel from the chained call arguments on
  # **the same statement line** — so "which actions really exist" is decided by the code, not guessed by us.
  - id: tp6-route-resource
    phase: Synthesize
    selector:
      kind: call
      callee: "think\\facade\\Route::resource|Route::resource"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { expand_method: true }
            path:
              arg: 0
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
                - param_wildcard
          expand:
            only: only
            except: except
            variants:
              - { name: index,  method: GET,    path_suffix: "",          entry: index }
              - { name: create, method: GET,    path_suffix: "/create",   entry: create }
              - { name: save,   method: POST,   path_suffix: "",          entry: save }
              - { name: read,   method: GET,    path_suffix: "/:id",      entry: read }
              - { name: edit,   method: GET,    path_suffix: "/:id/edit", entry: edit }
              - { name: update, method: PUT,    path_suffix: "/:id",      entry: update }
              - { name: delete, method: DELETE, path_suffix: "/:id",      entry: delete }
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: handler
              value: { arg: 1 }
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: handler_pattern }
            to_method: { expand_entry: true }
          confidence: 0.9

  # ===== P4+P5+P6: event registry =====
  - id: tp6-event-registry
    phase: AnnotatePre
    selector:
      kind: config_entry
      file: "*/event.php"
      key_path: "listen.*"
      where:
        # Array entries only: exclude expanded scalar leaves such as `listen.<evt>.0` (otherwise the same event
        # would also synthesize a `<evt>.0` noise node), and exclude entries with an empty value.
        - entry_arity_gte: 1
    binding:
      # (1) P4: annotate listener classes that **already exist**
      - Annotate:
          phase: Pre
          target:
            from_field:
              source: { array_values: true }
              resolve: class_const
          channel: FkbMark
          annotations:
            - kind: listener
              confidence: 0.95
          merge: MaxByKind
      # (2) P5: build the event mediator node (multi-source convergence + one-to-many)
      - Synthesize:
          node: ExternalSystem
          subtype: Event
          identity:
            kind: Named
            value: { path_segment: 1 }
          fields:
            - name: side
              value: { literal: "backend" }
            - name: payload_arity
              value: { array_length: true }
          link:
            kind: HandledBy
            direction: to_target
            to: { array_values: true, resolve: class_const }
          confidence: 0.95
          alias:
            namespace: event_name
            key: { path_segment: 1 }
      # (3) P6: register an alias on the event node (so P7 can resolve event('x'))
      - Annotate:
          phase: Post
          target: { synthesized_ref: "@self" }
          channel: Alias
          annotations:
            - kind: event_name
              confidence: 1.0
          merge: MaxByKind

  # ===== P4+P5+P6: behaviour extension registry (**5.x shape** `app/tags.php`) =====
  # Isomorphic to `tp6-event-registry` above, with only two differences:
  #   * file name: 5.x is `tags.php`, 6.x+ is `event.php`. The `file` selector supports only `*` wildcards,
  #     not `|` alternation, so this is written as two rules rather than one rule with `|`;
  #   * structure: 5.x's `tags.php` is **flat** (`'sms_send' => [Listener::class]`), with no 6.x outer
  #     `listen` key — hence `key_path: "*"`, and identity uses `path_segment: 0` (a flat key has a single
  #     segment; taking `1` returns None because `n < segs.len()` does not hold).
  - id: tp6-behavior-registry
    phase: AnnotatePre
    selector:
      kind: config_entry
      file: "*/tags.php"
      key_path: "*"
      where:
        # Same as above: array entries only. This matters especially for 5.x — in `tags.php`, framework-level
        # tags such as `app_init` / `app_begin` are **empty arrays** with no listener, and letting them through
        # would mix a batch of empty shell nodes with no HandledBy edge into the "event perspective".
        - entry_arity_gte: 1
    binding:
      # (1) P4: annotate behaviour classes that **already exist**
      - Annotate:
          phase: Pre
          target:
            from_field:
              source: { array_values: true }
              resolve: class_const
          channel: FkbMark
          annotations:
            - kind: listener
              confidence: 0.95
          merge: MaxByKind
      # (2) P5: build the event mediator node (multi-source convergence + one-to-many)
      - Synthesize:
          node: ExternalSystem
          subtype: Event
          identity:
            kind: Named
            value: { path_segment: 0 }
          fields:
            - name: side
              value: { literal: "backend" }
            - name: payload_arity
              value: { array_length: true }
          link:
            kind: HandledBy
            direction: to_target
            to: { array_values: true, resolve: class_const }
          confidence: 0.95
          alias:
            namespace: event_name
            key: { path_segment: 0 }
      # (3) P6: register an alias (so P7 can resolve `Hook::listen('x')` / `hook('x')`)
      - Annotate:
          phase: Post
          target: { synthesized_ref: "@self" }
          channel: Alias
          annotations:
            - kind: event_name
              confidence: 1.0
          merge: MaxByKind

  # ===== P4+P6: runtime event listener registration (`Event::listen` / `Event::subscribe`) =====
  # The static `event.php` only covers declarative listening; many codebases register consumers dynamically
  # at runtime via `Event::listen('OrderCreate', Listener::class)` or `Event::subscribe(Sub::class)`.
  # Here the registered listener class is marked `listener` so that, like statically registered ones, it enters
  # the consumer side of the "event perspective". Subscriber classes (whose `subscribe()` calls `Event::listen`
  # internally) also go through arg1 and are marked `listener` as well.
  # Note: this rule only adds the "annotation"; the event -> listener `HandledBy` edge is still produced by the
  # `event.php` registry above. If an event is registered purely at runtime and is absent from `event.php`,
  # its listener is annotated `listener` but has no precise `HandledBy` edge yet (the view still shows the
  # consumer via the `listener` annotation).
  - id: tp6-event-listener-registration
    phase: AnnotatePost
    selector:
      kind: call
      callee: "Event::listen|Event::subscribe"
    binding:
      - Annotate:
          phase: Post
          target:
            from_field:
              source: { arg: 1 }
              resolve: class_const
          channel: FkbMark
          annotations:
            - kind: listener
              confidence: 0.9
          merge: MaxByKind

  # ===== P6 Synthesize: ThinkPHP auto-routing (PATH_INFO convention) =====
  #
  # Many ThinkPHP projects **never write** `Route::get(...)`: a request to `/api/goods/detail` falls straight
  # through the framework to `app\api\controller\Goods::detail`. Under the old model the "route perspective" of
  # such projects was empty — measured: yoshop kept only its scaffold demo and shopxo had **not a single
  # contract**, while their real endpoints number in the hundreds.
  #
  # Why P6: this rule's selector acts on **graph nodes** (controller methods), and "public methods under
  # \controller\" can only be filtered stably by FQN at P6, after P2 has built the syntax nodes.
  #
  # URL derivation follows the three-step normalisation defined entirely by FKB (the kernel knows nothing about
  # ThinkPHP's URL rules):
  #   app\adminapi\controller\v1\agent\AgentLevel::delete
  #     -> snake:  app\adminapi\controller\v1\agent\agent_level::delete
  #     -> drop prefix / drop the controller layer / `\`->`/` / `::`->`/`
  #     -> /adminapi/v1/agent/agent_level/delete
  # consistent with TP6's URL conversion (`Url` folds `goods_category` into `GoodsCategory`).
  #
  # `method` takes `ANY` (wildcard): like `Route::rule`, auto-routing is "not restricted to one HTTP method",
  # and the kernel recognises both `ANY` / `RULE` as wildcard methods — contracts for concrete front-end methods
  # (POST / GET…) converge onto the same node instead of fabricating a GET/POST.
  # Confidence is deliberately pushed down to 0.5 — this is **convention inference**, not explicit source text
  # (the semantics may break due to project config `url_route_must`, middleware or an inherited `__call`), and
  # the node carries `auto_route: true` so upper layers can tell it apart.
  - id: tp6-auto-route-contract
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Method
      where:
        # Only methods under the controller namespace can be HTTP entries
        - fqn_matches: "\\controller\\"
        - property_is: { name: visibility, value: public }
        # Language constructors and framework hooks are not endpoints (`initialize` is TP's pre-hook)
        - name_not_in: ["__construct", "__destruct", "__call", "__callStatic", "initialize"]
        # **Explicit registration wins**: methods already claimed by a `Route::get/post/resource` contract are
        # not covered again; otherwise a fully route-registered project like CRMEB would grow a duplicate
        # synonymous contract for every method.
        - not_claimed_by: "HandledBy"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { literal: "ANY", normalize: [upper] }
            path:
              self: true
              transform: { snake: true }
              normalize:
                - strip_prefix: ["app\\"]
                - replace: { from: "\\", to: "/" }
                - replace: { from: "controller/", to: "" }
                - replace: { from: "::", to: "/" }
                - lower
                - leading_slash
          fields:
            - name: raw_path
              value: { self: true }
            - name: handler
              value: { self: true }
            - name: side
              value: { literal: "backend" }
            - name: auto_route
              value: { literal: "true" }
          link:
            kind: HandledBy
            direction: to_target
            to: { self: true, resolve: as_is }
          confidence: 0.5

  # ===== P5 Synthesize: I18nKey (several locales merge into one node) =====
  - id: tp6-i18n-key
    phase: Synthesize
    selector:
      kind: config_entry
      file: "lang/{locale}/*.php"
      key_path: "*"
    binding:
      - Synthesize:
          node: I18nKey
          identity:
            kind: Named
            value:
              path: [{ file_stem: true }, { key_path: true }]
              join: "."
          fields:
            - name: side
              value: { literal: "backend" }
            - name: texts
              value: { entry_value: true }
              accumulate: { key: { locale: true }, value: { entry_value: true } }
          modifiers: ["MergeBy(key)"]
          confidence: 0.9
