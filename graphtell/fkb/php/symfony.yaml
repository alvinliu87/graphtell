# Symfony framework knowledge
#
# Routes are declared with **PHP 8 attributes** (`#[Route]` / `#[Get]` / `#[Post]` …); the parser's `collect_method`
# in `gt-adapter-parser/src/php/mod.rs` **synthesizes each route attribute into a call site** (`callee_text` carries
# an `attr:` prefix so it is not confused with real calls such as Laravel's `Route::get()`), and writes the controller
# method FQN into `entity`. This file synthesizes `HttpContract` + `HandledBy` on that basis.
#
# Together with Spring / FastAPI / Django this belongs to the "backend route -> HttpContract" semantic family:
#   | framework | route declaration form                   | source of the method        |
#   |-----------|------------------------------------------|----------------------------|
#   | Symfony   | `#[Route('/x', methods:['GET'])]`         | attribute `methods` / shortcut name |
#   | Spring    | `@GetMapping("/x")`                       | annotation name            |
#   | FastAPI   | `@app.get("/x")`                          | decorator name             |
#   | Django    | `path("x/", view)`                        | none (wildcard ANY)        |

id: symfony
display_name: Symfony
language: php
version_hint: "5.x / 6.x / 7.x"
side: backend

detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: symfony/framework-bundle
    confidence: 0.95
  - kind: manifest_dependency
    manifest: composer.json
    dependency: symfony/routing
    confidence: 0.8
  - kind: file_exists
    path: bin/console
    confidence: 0.6

exclude_globs:
  - "vendor/**"
  - "node_modules/**"
  - "var/cache/**"
  - "var/log/**"
  - "public/**"

rules:
  # ===== P5 Synthesize: routes (#[Route] / #[Get] … on controller methods) =====
  # The parser has already synthesized a call site for each route attribute (including an explicit method; `Route`
  # without `methods` degrades to the wildcard ANY).
  # `entity` points at the controller method itself and links to the method node via `resolve: class_const`.
  - id: route
    phase: Synthesize
    selector:
      kind: call
      callee: "attr.Route|attr.Get|attr.Post|attr.Put|attr.Delete|attr.Patch|attr.Options|attr.Head"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { arg: 1 }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          link:
            kind: HandledBy
            direction: to_target
            to: { entity: true, resolve: class_const }
          confidence: 0.7
