# Laravel 框架知识
#
# **由 samples/laravel-projects 下的真实项目驱动**（aimeos-laravel / bagisto / beikeshop，
# 涵盖 Laravel 10 ~ 12），而不是照框架文档罗列 API —— 只写这三个项目里**实际出现**的写法。
#
# 与 ThinkPHP 的形态差异（同一门语言、同一套 DSL，纯数据差异）：
#   | 概念         | ThinkPHP 6              | Laravel                                  |
#   |--------------|-------------------------|------------------------------------------|
#   | 表访问       | `Db::name('x')`         | `DB::table('x')`（注意大小写）           |
#   | 路由 handler | `'Ctrl/method'` 字符串  | `[Ctrl::class, 'method']` 数组（主形式） |
#   | 事件注册     | `app/event.php` 配置文件| `EventServiceProvider::boot()` 里运行时  |
#   |              |                         | `Event::listen('evt', 'Listener@handle')`|
#   | 门面命名空间 | `think\facade\*`        | `Illuminate\Support\Facades\*`           |
#   | 队列投递     | `Queue::push`           | `dispatch(new Job)` / `Job::dispatch()`  |
#
# 注意：`config()` / `Cache::get()` 两个框架写法**相同**，这类规则属于 PHP 生态通用层，
# 将来应抽到语言级 FKB（详见 `apply_without_detection` 的说明）。

id: laravel
display_name: Laravel
language: php
version_hint: "10.x / 11.x / 12.x"

detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: laravel/framework
    confidence: 0.95
  - kind: file_exists
    path: artisan
    confidence: 0.7

exclude_globs:
  - "vendor/**"
  - "node_modules/**"
  - "public/**"
  - "storage/framework/**"
  - "storage/logs/**"

# `References`（模型 → 模型）两端都是**代码节点**，按桥边声明：能沿链遍历做影响面，
# 但不计入「语义入边 N」、不当画布边（与 FastAPI 的 `DependsOn` 同一处理）。
# `ForeignKey`（表 → 表）两端都是 `Table`（语义节点），是真正的业务资源依赖 → 语义边。
semantic_edge_kinds: [ForeignKey]
bridge_edge_kinds: [References]

root_rules:
  - id: laravel-app-root
    key: app_root
    source:
      kind: manifest_json
      manifest: composer.json
      pointer: autoload.psr-4
      pick: shallowest_dir
    confidence: 1.0
    fallbacks:
      - app
      - src
  # 表前缀：Laravel 与 ThinkPHP 一样写在 `config/database.php`，结构相同，可直接复用探测。
  - id: laravel-db-prefix
    key: db_prefix
    source:
      kind: manifest_php
      manifest: config/database.php
      pointer: connections.mysql.prefix
    confidence: 1.0

# ---------------------------------------------------------------- 路由 handler
#
# Laravel 的 handler 有四种形态（三个项目实测）：
#   ① `[WebMcpController::class, 'product']` —— 数组，**主形式**
#   ② `'LoginController@login'` —— @ 分隔方法
#   ③ `Route::resource('addresses', AddressController::class)` —— 直接给类
#   ④ `Route::get('install', 'index')` —— 仅方法名，controller 由外层 group 决定
#
# 与 ThinkPHP 的关键差别：Laravel 控制器通常**已是全限定名**（经 `use` 导入或
# `::class`），不需要 `app\{app}\controller\{C}` 那套拼装；因此模板里直接放
# `{controller}`，命中不了时由「短名 + 路由文件 import」兜底。
handler:
  method_separators: ["@", "::", "/"]
  hierarchy_separators: []
  class_templates:
    - "{controller}"
    - "App\\Http\\Controllers\\{controller}"
  app_segments: []
  app_anchor_dir: "routes"
  app_fallback: ""

# 消费入口方法名：`handle` 是 Laravel 的 Job / Listener 约定，
# `__invoke` 是单动作控制器（Single Action Controller）。
entry_methods: ["handle", "__invoke"]

# Eloquent / Query Builder 的 CRUD 动词 → 读 / 写分类（与 `MapsTo` 配合，见 P7 动词分类）。
#
# 为什么 Laravel 必须有这一份：之前只有 `thinkphp6` 声明了 `db_verbs`，于是
# 三个 Laravel 工程（aimeos / bagisto / beikeshop）**一条 `WritesDb` 边都没有** ——
# `n1-query-in-loop` / `n1-write-in-loop` / `read-only-table` / `write-only-table`
# 全部被判 `rules_unavailable`（bagisto 实测：28 条规则里 11 条不可用）。
#
# 只列**会真正落库**的动词，且刻意不列 `where` / `select` / `orderBy` 这类
# 只构造查询、不执行的中间方法 —— 否则同一个链式调用会被重复落成多条动作边。
# 判据与 ThinkPHP 侧一致：接收者类型有 `MapsTo`，或门面链里已经拿到了表名
# （`DB::table('x')->...->get()`），所以 `Collection::get()` 这类同名方法不会被误判。
db_verbs:
  write: ["save", "saveQuietly", "saveMany", "create", "createMany", "firstOrCreate",
          "updateOrCreate", "updateOrInsert", "upsert", "update", "increment", "decrement",
          "incrementEach", "decrementEach", "delete", "destroy", "forceDelete", "insert",
          "insertGetId", "insertOrIgnore", "truncate", "restore", "attach", "detach",
          "sync", "syncWithoutDetaching", "toggle"]
  read: ["find", "findOrFail", "findMany", "findOrNew", "first", "firstOrFail", "firstWhere",
         "sole", "value", "pluck", "count", "sum", "avg", "max", "min", "exists",
         "doesntExist", "get", "all", "paginate", "simplePaginate", "cursor", "chunk",
         "chunkById"]

loaders:
  # FacadeMap：Laravel 的门面（真实类名取自 Illuminate 组件）。
  - id: laravel-facade-map
    table: facade_map
    from:
      kind: inline
      rows:
        - { facade: "Illuminate\\Support\\Facades\\Cache", target: "Illuminate\\Cache\\CacheManager" }
        - { facade: "Illuminate\\Support\\Facades\\DB", target: "Illuminate\\Database\\DatabaseManager" }
        - { facade: "Illuminate\\Support\\Facades\\Config", target: "Illuminate\\Config\\Repository" }
        - { facade: "Illuminate\\Support\\Facades\\Log", target: "Illuminate\\Log\\LogManager" }
        - { facade: "Illuminate\\Support\\Facades\\Queue", target: "Illuminate\\Queue\\QueueManager" }
        - { facade: "Illuminate\\Support\\Facades\\Route", target: "Illuminate\\Routing\\Router" }
        - { facade: "Illuminate\\Support\\Facades\\Event", target: "Illuminate\\Events\\Dispatcher" }
        - { facade: "Illuminate\\Support\\Facades\\Storage", target: "Illuminate\\Filesystem\\FilesystemManager" }
  # 数据库 schema（SQL 安装脚本里的 `CREATE TABLE` 列 + 源码中的表名调用点）。
  # 与 ThinkPHP 的 `tp6-db-schema` 是同一个内置装载器（读 `.sql`、与框架无关），
  # 只是**声明**要在每个框架 FKB 里各写一份（装载器按框架装载，不共享声明）。
  # 没有它，Laravel 工程就没有权威列信息 —— `ColumnsMatch` 谓词与
  # P6 的「schema 列 → `Column` 图节点」沉淀都会落空。
  # 中间件别名表（`app/Http/Kernel.php` 的 `$routeMiddleware`）。
  # **必须声明在 `php_routes` 之前**：路由表里要按别名还原成类名，
  # 装载顺序颠倒就会整条守卫丢掉（宁可缺不可猜）。
  - id: laravel-middleware-aliases
    table: middleware_aliases
    from:
      kind: builtin
      name: middleware_aliases
      # 全部由框架知识声明，内核不认识其中任何一个字符串：
      # * `markers` 两个都列 —— Laravel ≤9 叫 `$routeMiddleware`，**10.x 改名
      #   `$middlewareAliases`**（实测 10.x 骨架就是后者，只认前者会整表落空）；
      # * 只取该块：同文件里 `$middlewareGroups` 的 `web` / `api` 是**组名**不是中间件名。
      params:
        paths: ["app/Http/Kernel.php", "Http/Kernel.php"]
        markers: ["$middlewareAliases", "$routeMiddleware"]
        end: "];"
        separator: "=>"
        extensions: ["php"]
  # Laravel 11 的 `bootstrap/app.php`：`->withMiddleware(fn ($m) => $m->alias([...]))`
  # 注册的**应用级自定义别名**（框架默认别名见下方 `laravel-default-aliases`）。
  # 与上面 `laravel-middleware-aliases` 同写 `middleware_aliases` 表、装载顺序无关，
  # 但都必须在 `laravel-routes` 之前（别名要先于路由装载，否则按别名还原类名时表还空）。
  - id: laravel-bootstrap-aliases
    table: middleware_aliases
    from:
      kind: builtin
      name: middleware_aliases
      params:
        paths: ["bootstrap/app.php"]
        markers: ["$middleware->alias"]
        end: "];"
        separator: "=>"
        extensions: ["php"]
  # 框架默认中间件别名（Laravel 11 由 `Illuminate\Foundation\Configuration\Middleware::defaultAliases()`
  # 注册，源码在 `vendor/` 不进图）。这是**框架事实**（取自框架 11.x 源码，置信度 1.0），
  # 让 `auth` / `throttle` / `guest` / `verified` / `can` / `signed` 等路由里常用的别名能静态
  # 还原成类 —— Laravel 11 不再有 `app/Http/Kernel.php`，否则这些别名整表落空。
  - id: laravel-default-aliases
    table: middleware_aliases
    from:
      kind: inline
      rows:
        - { key: "auth", class: "Illuminate\\Auth\\Middleware\\Authenticate" }
        - { key: "auth.basic", class: "Illuminate\\Auth\\Middleware\\AuthenticateWithBasicAuth" }
        - { key: "auth.session", class: "Illuminate\\Session\\Middleware\\AuthenticateSession" }
        - { key: "cache.headers", class: "Illuminate\\Http\\Middleware\\SetCacheHeaders" }
        - { key: "can", class: "Illuminate\\Auth\\Middleware\\Authorize" }
        - { key: "guest", class: "Illuminate\\Auth\\Middleware\\RedirectIfAuthenticated" }
        - { key: "password.confirm", class: "Illuminate\\Auth\\Middleware\\RequirePassword" }
        - { key: "precognitive", class: "Illuminate\\Foundation\\Http\\Middleware\\HandlePrecognitiveRequests" }
        - { key: "signed", class: "Illuminate\\Routing\\Middleware\\ValidateSignature" }
        - { key: "throttle", class: "Illuminate\\Routing\\Middleware\\ThrottleRequests" }
        - { key: "verified", class: "Illuminate\\Auth\\Middleware\\EnsureEmailIsVerified" }
  # ---------------------------------------------------------------------------
  # **已知中间件**（框架 / 库自带，源码在 `vendor/` 不进图）
  #
  # FKB 的设计本意就是"预定义框架与库的语义知识"：一个类在图里**没有节点**
  # （`vendor/` 被排除）不等于它**没有语义**。故这里把 Laravel 自带的中间件显式声明出来，
  # P14 解析不到节点时会查这张表并按声明落成 `Middleware` 节点 ——
  # 与"按名字猜"是两回事：这是 FKB 声明的事实，置信度 1.0。
  #
  # 声明方式复用已有的 `inline` 装载器（与 `facade_map` 同款），不需要改解析器。
  - id: laravel-known-middleware
    table: middleware_classes
    from:
      kind: inline
      rows:
        - { class: "Illuminate\\Auth\\Middleware\\Authenticate", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\AuthenticateWithBasicAuth", capability: "Authentication" }
        - { class: "Illuminate\\Session\\Middleware\\AuthenticateSession", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\Authorize", capability: "Authorization" }
        - { class: "Illuminate\\Routing\\Middleware\\ThrottleRequests", capability: "RateLimiting" }
        - { class: "Illuminate\\Routing\\Middleware\\ThrottleRequestsWithRedis", capability: "RateLimiting" }
        - { class: "Illuminate\\Routing\\Middleware\\ValidateSignature", capability: "SignedRequest" }
        - { class: "Illuminate\\Routing\\Middleware\\SubstituteBindings", capability: "Routing" }
        - { class: "Illuminate\\Http\\Middleware\\SetCacheHeaders", capability: "Caching" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\ValidatePostSize", capability: "Validation" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\ConvertEmptyStringsToNull", capability: "Sanitization" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\TrimStrings", capability: "Sanitization" }
        - { class: "Illuminate\\Http\\Middleware\\HandleCors", capability: "Cors" }
        - { class: "Illuminate\\Cookie\\Middleware\\EncryptCookies", capability: "Encryption" }
        - { class: "Illuminate\\Cookie\\Middleware\\AddQueuedCookiesToResponse", capability: "Session" }
        - { class: "Illuminate\\Session\\Middleware\\StartSession", capability: "Session" }
        - { class: "Illuminate\\View\\Middleware\\ShareErrorsFromSession", capability: "Session" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\PreventRequestsDuringMaintenance", capability: "Maintenance" }
        - { class: "Illuminate\\Auth\\Middleware\\EnsureEmailIsVerified", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\RequirePassword", capability: "Authentication" }
  # 路由表（`routes/*.php` 的 `Route::get/post/...`）—— 识别逻辑由下方 `route_guards` 声明。
  - id: laravel-routes
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}
  - id: laravel-db-schema
    table: schema
    from:
      kind: builtin
      name: php_db_schema
      params: {}
  # 数据库 migration（`database/migrations/*.php`）—— **Laravel 的列主要来源**。
  # PHP ORM 的模型不声明字段，列只写在 migration 里；而 `$table->string('email')`
  # 在闭包内、owner 是闭包，FKB 拿不到它属于哪张表，故只能由装载器直接解析。
  # 与上面 `php_db_schema` 写同一张 `schema` 表，装载器内部做**并集**，装载顺序无关。
  - id: laravel-migration-schema
    table: schema
    from:
      kind: builtin
      name: php_migration_schema
      params: {}

# ---------------------------------------------------------------- 中间件能力
# 「中间件类 → 能力」同样是框架知识：内核不认识任何一个中间件名字。
# 命中后给契约打 `Capability` 标注（路由视角结论区的「标注」一行）。
middleware_capabilities:
  - { matches: "Authenticate", capability: "Authentication" }
  - { matches: "Authorize", capability: "Authorization" }
  - { matches: "ThrottleRequests", capability: "RateLimiting" }
  - { matches: "EnsureEmailIsVerified", capability: "Authentication" }
  - { matches: "ValidateSignature", capability: "SignedRequest" }
  - { matches: "RequirePassword", capability: "Authentication" }

# ---------------------------------------------------------------- 路由守卫识别
# 与 ThinkPHP 同构：链式 `Route::get(path)->middleware(X)`。Laravel 的 `Route::middleware('auth')`
# 写在前面（`->group` 在后）也认——通用提取器优先把 `group` 当根。别名（`auth` / `web`）
# 经 `middleware_aliases` 表还原成真实类。
route_guards:
  route_calls:
    - receiver: "Route"
      verb_methods:
        get: GET
        post: POST
        put: PUT
        delete: DELETE
        patch: PATCH
        options: OPTIONS
        any: ANY
        match: ANY
      path_arg: 0
      handler_arg: 1
      group_method: group
  guard_attach:
    kind: chain
    method: middleware
    arg_index: 0
    arg2_index: 1
  alias_table: middleware_aliases

rules:
  # ===== P5 Synthesize：Table =====
  # `DB::table('product_flat')` —— bagisto 实测 200+ 处。
  - id: laravel-db-table
    phase: Synthesize
    selector:
      kind: call
      callee: "DB::table"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: ReadsDb, direction: incoming }
          confidence: 0.9

  # Eloquent 约定：`class ProductGroupedProduct extends Model` → `product_grouped_products`。
  # 与 ThinkPHP 的 Model 约定同一套算法（snake_plural），只是基类不同。
  - id: laravel-model-table
    phase: Synthesize
    selector:
      kind: inheritance
      base: "Illuminate\\Database\\Eloquent\\Model|Model"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              self: true
              transform: { snake_plural: true, strip_namespace: true }
              normalize:
                - singularize
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.6

  # ===== P5 Synthesize：模型关联 =====
  # `public function posts() { return $this->hasMany(Post::class); }`
  #
  # 与 Node 侧 TypeORM 的策略**刻意不同**：TypeORM 的 `@ManyToOne` / `@OneToMany`
  # 通常**成对**写，故那边只建外键持有方以免反向冗余；Laravel / ThinkPHP
  # **常只声明一侧**（最常见就是 `User hasMany Post`，不写反向 `belongsTo`），
  # 只建一侧会大面积漏边 —— 故这里两侧都建，宁可冗余也不漏。
  #
  # 目标模型取 arg0 的 `Post::class`；取不到就静默跳过（`morphTo()` 无实参即如此）。
  # 关系方法定义在**方法体内**，owner_fqn 是 `App\Models\User::posts`，
  # 故 `owner_class` 取到的是模型类而非关系方法。
  - id: laravel-model-relation
    phase: Synthesize
    selector:
      kind: call
      # 只认 `$this->` 接收者：关系定义恒在模型实例方法里，裸方法名会误伤同名普通方法。
      callee: "$this->hasOne|$this->hasMany|$this->belongsTo|$this->belongsToMany|$this->hasOneThrough|$this->hasManyThrough|$this->morphOne|$this->morphMany|$this->morphToMany|$this->morphedByMany|$this->morphTo"
    binding:
      - Link:
          kind: References
          from: { owner_class: true, resolve: class_const }
          to: { arg: 0, resolve: class_const, require_class: true }
          confidence: 0.75

  # ===== P6 AnnotatePost：模型关联 → 表级外键 =====
  # 把「模型 → 模型」投影成「表 → 表」：两端各沿 `MapsTo` 走一跳落到自己的表。
  # 一对多（一个模型有几条关系就产出几条外键边）；某端没有 `Table` 就跳过这条。
  - id: laravel-table-foreign-key
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Class
    binding:
      - Project:
          kind: ForeignKey
          along: References
          from: [MapsTo]
          to: [MapsTo]
          confidence: 0.7

  # ===== P5 Synthesize：ConfigKey / Cache =====
  # 已抽到语言通用层 `fkb/php/common.yaml`（`php-common-config` / `php-common-cache-*`），
  # 对所有 PHP 框架生效，避免每个框架 FKB 重复一份相同的缓存 / 配置识别逻辑。

  # ===== P5 Synthesize：Queue =====
  # `dispatch(new OrderCreatedJob($x))` / `OrderCreatedJob::dispatch($x)`。
  # 与 ThinkPHP 的 `Queue::push` 同：优先 arg:0 的真实类，取不到退回「发起调用的类」。
  - id: laravel-queue-dispatch
    phase: Synthesize
    selector:
      kind: call
      callee: "dispatch|*::dispatch"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Queue
          identity:
            kind: Named
            value:
              arg: 0
              resolve: class_const
              require_class: true
              transform: { class_to_topic: true }
            value_fallback:
              owner_class: true
              transform: { class_to_topic: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize：事件（**运行时注册**）=====
  #
  # Laravel 没有 ThinkPHP 的 `app/event.php` 那样的配置文件 —— 事件在 ServiceProvider
  # 的 `boot()` 里用 `Event::listen('evt', 'Listener@handle')` 注册。
  # 因此这里**由调用点合成事件节点**，而不是从配置装载。
  #
  # 三种实测形态：
  #   ① `'Listener@handle'` 字符串 → 交给 P7，用本文件 `handler` 声明的 `@` 拆成类 + 方法
  #   ② `function ($x) {...}` 闭包 → 无法静态解析，只建事件节点、不建 `HandledBy` 边
  #   ③ `protected $listen = ['evt' => [[Product::class, 'beforeUpdate']]]` 类属性
  #      → **当前 DSL 无法表达**（属性数组值不是 `config_entry`），留作后续
  - id: laravel-event-registration
    phase: Synthesize
    selector:
      kind: call
      callee: "Event::listen"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Event
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: handler_pattern }
          confidence: 0.9
          alias:
            namespace: event_name
            key: { arg: 0, require_literal: true }

  # ===== P5 Synthesize：HTTP 契约 =====
  #
  # Laravel 的 handler 有三种形态（bagisto / beikeshop 实测）：
  #   ① `[WebMcpController::class, 'product']` 数组 —— **主形式**，需要"取数组第 0 项的类
  #      + 第 1 项的方法名"，现有 `ValueSource` 表达不了（只有 `arg` / `field`），
  #      故此处 `to` 解析会失败并降级为 PendingLink；
  #   ② `Route::resource('addresses', AddressController::class)` —— arg1 直接是类；
  #   ③ `Route::get('install', 'index')` —— 单方法名，controller 由外层 group 决定。
  #
  # 现在 DSL 已支持数组式 handler：
  #   `to: { arg: 1, element: 0 }` 取类名、`to_method: { arg: 1, element: 1 }` 取方法名；
  #   arg1 不是数组时（`Route::resource` 直接给类）`element` 取不到，
  #   由 `to_fallback` 退回「整个 arg1」按类解析。
  - id: laravel-route-http-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "Route::{get,post,any,put,delete,patch,resource,view}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { method_name: true, normalize: [upper] }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            # 形态 ①：`[Ctrl::class, 'method']` —— 类名在 arg1[0]，方法名在 arg1[1]
            to: { arg: 1, element: 0, resolve: class_const }
            to_method: { arg: 1, element: 1 }
            # 形态 ③：`Route::resource('x', Ctrl::class)` —— arg1 不是数组，取整个值
            to_fallback: { arg: 1, resolve: class_const }
          confidence: 0.9

resolvers:
  - id: laravel-container-make
    call: "app|app()->make|resolve|make"
    strategy: container
  - id: laravel-event-trigger
    call: "event|Event::dispatch"
    strategy: event
  - id: laravel-facade
    call: "Illuminate\\Support\\Facades\\*::*"
    strategy: facade
  - id: laravel-typed-instance-call
    call: "*->*"
    strategy: variable_type
