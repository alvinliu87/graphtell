# Laravel framework knowledge
#
# **Driven by the real projects under samples/laravel-projects** (aimeos-laravel / bagisto / beikeshop,
# covering Laravel 10 ~ 12), rather than listing APIs from the framework docs — only spellings that
# **actually occur** in those three projects are written here.
#
# Shape differences from ThinkPHP (same language, same DSL, pure data differences):
#   | concept         | ThinkPHP 6              | Laravel                                   |
#   |-----------------|-------------------------|-------------------------------------------|
#   | table access    | `Db::name('x')`         | `DB::table('x')` (note the casing)        |
#   | route handler   | `'Ctrl/method'` string  | `[Ctrl::class, 'method']` array (main form)|
#   | event registry  | `app/event.php` config  | runtime, in `EventServiceProvider::boot()`|
#   |                 |                         | `Event::listen('evt', 'Listener@handle')` |
#   | facade namespace| `think\facade\*`        | `Illuminate\Support\Facades\*`            |
#   | queue dispatch  | `Queue::push`           | `dispatch(new Job)` / `Job::dispatch()`   |
#
# Note: `config()` / `Cache::get()` are spelled **identically** in both frameworks; such rules belong to
# the PHP-ecosystem common layer and should later be factored into a language-level FKB (see the notes on
# `apply_without_detection`).

id: laravel
display_name: Laravel
language: php
version_hint: "10.x / 11.x / 12.x"

detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: laravel/framework
    confidence: 0.95
  - kind: file_exists
    path: artisan
    confidence: 0.7

exclude_globs:
  - "vendor/**"
  - "node_modules/**"
  - "public/**"
  - "storage/framework/**"
  - "storage/logs/**"

# `References` (model -> model) has **code nodes** at both ends and is declared as a bridge edge: it can be
# walked along the chain for impact analysis, but is not counted in "N semantic in-edges" and is not a canvas
# edge (same treatment as FastAPI's `DependsOn`).
# `ForeignKey` (table -> table) has `Table` (semantic nodes) at both ends and is a real business-resource
# dependency, hence a semantic edge.
semantic_edge_kinds: [ForeignKey]
bridge_edge_kinds: [References]

root_rules:
  - id: laravel-app-root
    key: app_root
    source:
      kind: manifest_json
      manifest: composer.json
      pointer: autoload.psr-4
      pick: shallowest_dir
    confidence: 1.0
    fallbacks:
      - app
      - src
  # Table prefix: Laravel, like ThinkPHP, writes it in `config/database.php`; the structure is the same, so the detection can be reused directly.
  - id: laravel-db-prefix
    key: db_prefix
    source:
      kind: manifest
      manifest: config/database.php
      pointer: connections.mysql.prefix
    confidence: 1.0

# ---------------------------------------------------------------- route handler
#
# Laravel handlers come in four shapes (measured on the three projects):
#   ① `[WebMcpController::class, 'product']` — array, the **main form**
#   ② `'LoginController@login'` — `@` separates the method
#   ③ `Route::resource('addresses', AddressController::class)` — the class given directly
#   ④ `Route::get('install', 'index')` — method name only; the controller comes from the outer group
#
# The key difference from ThinkPHP: Laravel controllers are usually **already fully qualified** (imported via
# `use` or `::class`), so the `app\{app}\controller\{C}` assembly is unnecessary; the template therefore puts
# `{controller}` directly, and when that misses it falls back to "short name + route-file import".
method_ref:
  method_separators: ["@", "::", "/"]
  hierarchy_separators: []
  # Laravel handlers are usually fully-qualified (`App\Http\Controllers\X@method`) and resolve directly; for the
  # rare short form, `controller_layer_depth: 2` matches the `App\Http\Controllers` two-segment layer — again with
  # NO hard-coded directory name (the resolver learns it from the graph under the PSR-4 `App\` namespace).
  controller_layer_depth: 2
  app_anchor_dir: "routes"
  app_fallback: ""

# Consumer entry method names: `handle` is Laravel's Job / Listener convention,
# `__invoke` is the single-action controller.
entry_methods: ["handle", "__invoke"]

# Eloquent / Query Builder CRUD verbs -> read / write classification (pairs with `MapsTo`; see P7 verb classification).
#
# Why Laravel needs this copy: previously only `thinkphp6` declared `db_verbs`, so the three Laravel projects
# (aimeos / bagisto / beikeshop) had **not a single `WritesDb` edge** — and `n1-query-in-loop` /
# `n1-write-in-loop` / `read-only-table` / `write-only-table` were all judged `rules_unavailable`
# (measured on bagisto: 11 of 28 rules unavailable).
#
# Only verbs that **really hit the database** are listed, and intermediate methods that merely build a query
# without executing it (`where` / `select` / `orderBy`) are deliberately excluded — otherwise one chained call
# would be turned into several duplicate action edges. The criterion matches the ThinkPHP side: the receiver
# type has a `MapsTo`, or the facade chain has already obtained a table name (`DB::table('x')->...->get()`),
# so `Cache::get()` and similar can never be misjudged as database reads.
db_verbs:
  write: ["save", "saveQuietly", "saveMany", "create", "createMany", "firstOrCreate",
          "updateOrCreate", "updateOrInsert", "upsert", "update", "increment", "decrement",
          "incrementEach", "decrementEach", "delete", "destroy", "forceDelete", "insert",
          "insertGetId", "insertOrIgnore", "truncate", "restore", "attach", "detach",
          "sync", "syncWithoutDetaching", "toggle"]
  read: ["find", "findOrFail", "findMany", "findOrNew", "first", "firstOrFail", "firstWhere",
         "sole", "value", "pluck", "count", "sum", "avg", "max", "min", "exists",
         "doesntExist", "get", "all", "paginate", "simplePaginate", "cursor", "chunk",
         "chunkById"]

loaders:
  # FacadeMap: Laravel's facades (real class names taken from the Illuminate components).
  - id: laravel-facade-map
    table: facade_map
    from:
      kind: inline
      rows:
        - { facade: "Illuminate\\Support\\Facades\\Cache", target: "Illuminate\\Cache\\CacheManager" }
        - { facade: "Illuminate\\Support\\Facades\\DB", target: "Illuminate\\Database\\DatabaseManager" }
        - { facade: "Illuminate\\Support\\Facades\\Config", target: "Illuminate\\Config\\Repository" }
        - { facade: "Illuminate\\Support\\Facades\\Log", target: "Illuminate\\Log\\LogManager" }
        - { facade: "Illuminate\\Support\\Facades\\Queue", target: "Illuminate\\Queue\\QueueManager" }
        - { facade: "Illuminate\\Support\\Facades\\Route", target: "Illuminate\\Routing\\Router" }
        - { facade: "Illuminate\\Support\\Facades\\Event", target: "Illuminate\\Events\\Dispatcher" }
        - { facade: "Illuminate\\Support\\Facades\\Storage", target: "Illuminate\\Filesystem\\FilesystemManager" }
  # Database schema (the `CREATE TABLE` columns in SQL install scripts + table-name call sites in the source).
  # Same built-in loader as ThinkPHP's `tp6-db-schema` (reads `.sql`, framework-agnostic), but the
  # **declaration** has to be written once per framework FKB (loaders load per framework and do not share declarations).
  # Without it a Laravel project has no authoritative column information — the `ColumnsMatch` predicate and P6's
  # "schema column -> `Column` graph node" sedimentation both come up empty.
  # Middleware alias table (`$routeMiddleware` in `app/Http/Kernel.php`).
  # **Must be declared before `php_routes`**: the route table resolves aliases back into class names, and if the
  # load order is reversed the whole guard set is lost (better missing than guessed).
  - id: laravel-middleware-aliases
    table: middleware_aliases
    from:
      kind: builtin
      name: middleware_aliases
      # All declared by framework knowledge; the kernel knows none of these strings:
      # * both `markers` are listed — Laravel <=9 calls it `$routeMiddleware`, **10.x renamed it to
      #   `$middlewareAliases`** (the 10.x skeleton measured is the latter; recognising only the former loses the whole table);
      # * only that block is taken: in the same file, `web` / `api` under `$middlewareGroups` are **group names**, not middleware names.
      params:
        paths: ["app/Http/Kernel.php", "Http/Kernel.php"]
        markers: ["$middlewareAliases", "$routeMiddleware"]
        end: "];"
        separator: "=>"
        extensions: ["php"]
  # Laravel 11's `bootstrap/app.php`: `->withMiddleware(fn ($m) => $m->alias([...]))` registers
  # **application-level custom aliases** (framework defaults are in `laravel-default-aliases` below).
  # Writes to the same `middleware_aliases` table as `laravel-middleware-aliases` above, so load order between
  # them does not matter, but both must come before `laravel-routes` (aliases must load before routes, otherwise
  # the table is still empty when aliases are resolved back to class names).
  - id: laravel-bootstrap-aliases
    table: middleware_aliases
    from:
      kind: builtin
      name: middleware_aliases
      params:
        paths: ["bootstrap/app.php"]
        markers: ["$middleware->alias"]
        end: "];"
        separator: "=>"
        extensions: ["php"]
  # Framework default middleware aliases (in Laravel 11 registered by
  # `Illuminate\Foundation\Configuration\Middleware::defaultAliases()`, whose source lives in `vendor/` and is not
  # ingested). This is a **framework fact** (taken from the framework's 11.x source, confidence 1.0) and lets
  # aliases commonly used in routes — `auth` / `throttle` / `guest` / `verified` / `can` / `signed` — be resolved
  # statically back into classes; Laravel 11 no longer has `app/Http/Kernel.php`, so without this the whole
  # alias table would come up empty.
  - id: laravel-default-aliases
    table: middleware_aliases
    from:
      kind: inline
      rows:
        - { key: "auth", class: "Illuminate\\Auth\\Middleware\\Authenticate" }
        - { key: "auth.basic", class: "Illuminate\\Auth\\Middleware\\AuthenticateWithBasicAuth" }
        - { key: "auth.session", class: "Illuminate\\Session\\Middleware\\AuthenticateSession" }
        - { key: "cache.headers", class: "Illuminate\\Http\\Middleware\\SetCacheHeaders" }
        - { key: "can", class: "Illuminate\\Auth\\Middleware\\Authorize" }
        - { key: "guest", class: "Illuminate\\Auth\\Middleware\\RedirectIfAuthenticated" }
        - { key: "password.confirm", class: "Illuminate\\Auth\\Middleware\\RequirePassword" }
        - { key: "precognitive", class: "Illuminate\\Foundation\\Http\\Middleware\\HandlePrecognitiveRequests" }
        - { key: "signed", class: "Illuminate\\Routing\\Middleware\\ValidateSignature" }
        - { key: "throttle", class: "Illuminate\\Routing\\Middleware\\ThrottleRequests" }
        - { key: "verified", class: "Illuminate\\Auth\\Middleware\\EnsureEmailIsVerified" }
  # ---------------------------------------------------------------------------
  # **Known middleware** (shipped with the framework / libraries; source lives in `vendor/` and is not ingested)
  #
  # FKB is by design "predefined semantic knowledge about frameworks and libraries": a class having **no node**
  # on the graph (`vendor/` is excluded) does not mean it has **no semantics**. So Laravel's own middleware is
  # declared explicitly here; when P14 cannot resolve a node it looks up this table and materialises a
  # `Middleware` node from the declaration — which is different from "guessing by name": this is a fact declared
  # by FKB, at confidence 1.0.
  #
  # The declaration reuses the existing `inline` loader (same kind as `facade_map`), so no parser change is needed.
  - id: laravel-known-middleware
    table: middleware_classes
    from:
      kind: inline
      rows:
        - { class: "Illuminate\\Auth\\Middleware\\Authenticate", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\AuthenticateWithBasicAuth", capability: "Authentication" }
        - { class: "Illuminate\\Session\\Middleware\\AuthenticateSession", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\Authorize", capability: "Authorization" }
        - { class: "Illuminate\\Routing\\Middleware\\ThrottleRequests", capability: "RateLimiting" }
        - { class: "Illuminate\\Routing\\Middleware\\ThrottleRequestsWithRedis", capability: "RateLimiting" }
        - { class: "Illuminate\\Routing\\Middleware\\ValidateSignature", capability: "SignedRequest" }
        - { class: "Illuminate\\Routing\\Middleware\\SubstituteBindings", capability: "Routing" }
        - { class: "Illuminate\\Http\\Middleware\\SetCacheHeaders", capability: "Caching" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\ValidatePostSize", capability: "Validation" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\ConvertEmptyStringsToNull", capability: "Sanitization" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\TrimStrings", capability: "Sanitization" }
        - { class: "Illuminate\\Http\\Middleware\\HandleCors", capability: "Cors" }
        - { class: "Illuminate\\Cookie\\Middleware\\EncryptCookies", capability: "Encryption" }
        - { class: "Illuminate\\Cookie\\Middleware\\AddQueuedCookiesToResponse", capability: "Session" }
        - { class: "Illuminate\\Session\\Middleware\\StartSession", capability: "Session" }
        - { class: "Illuminate\\View\\Middleware\\ShareErrorsFromSession", capability: "Session" }
        - { class: "Illuminate\\Foundation\\Http\\Middleware\\PreventRequestsDuringMaintenance", capability: "Maintenance" }
        - { class: "Illuminate\\Auth\\Middleware\\EnsureEmailIsVerified", capability: "Authentication" }
        - { class: "Illuminate\\Auth\\Middleware\\RequirePassword", capability: "Authentication" }
  # Route table (`Route::get/post/...` in `routes/*.php`) — the recognition logic is declared by `route_guards` below.
  - id: laravel-routes
    table: route_list
    from:
      kind: builtin
      name: routes
      params: {}
  - id: laravel-db-schema
    table: schema
    from:
      kind: builtin
      name: php_db_schema
      params:
        table_receivers: ["Db", "\\Db", "Query", "Model"]
        table_methods: ["name", "table"]
  # Database migrations (`database/migrations/*.php`) — **the main source of Laravel columns**.
  # PHP ORM models do not declare fields; columns only exist in migrations. And `$table->string('email')` sits
  # inside a closure whose owner is the closure, so FKB cannot tell which table it belongs to — only the loader
  # can parse it directly.
  # Writes to the same `schema` table as `php_db_schema` above; the loader takes a **union** internally, so load order does not matter.
  - id: laravel-migration-schema
    table: schema
    from:
      kind: builtin
      name: php_migration_schema
      params:
        paths: ["database/migrations"]
        extensions: ["php"]

# ---------------------------------------------------------------- middleware capability
# "Middleware class -> capability" is likewise framework knowledge: the kernel knows no middleware name.
# On a hit the contract gets a `Capability` annotation (the "annotations" row in the route perspective's conclusions).
middleware_capabilities:
  - { matches: "Authenticate", capability: "Authentication" }
  - { matches: "Authorize", capability: "Authorization" }
  - { matches: "ThrottleRequests", capability: "RateLimiting" }
  - { matches: "EnsureEmailIsVerified", capability: "Authentication" }
  - { matches: "ValidateSignature", capability: "SignedRequest" }
  - { matches: "RequirePassword", capability: "Authentication" }

# ---------------------------------------------------------------- route-guard recognition
# Isomorphic to ThinkPHP: chained `Route::get(path)->middleware(X)`. Laravel's `Route::middleware('auth')`
# written before (with `->group` after) is also recognised — the generic extractor prefers `group` as the root.
# Aliases (`auth` / `web`) are resolved back to real classes via the `middleware_aliases` table.
route_guards:
  route_calls:
    - receiver: "Route"
      verb_methods:
        get: GET
        post: POST
        put: PUT
        delete: DELETE
        patch: PATCH
        options: OPTIONS
        any: ANY
        match: ANY
      path_arg: 0
      handler_arg: 1
      group_method: group
  guard_attach:
    kind: chain
    method: middleware
    arg_index: 0
    arg2_index: 1
  alias_table: middleware_aliases

rules:
  # ===== P5 Synthesize: Table =====
  # `DB::table('product_flat')` — measured 200+ places in bagisto.
  - id: laravel-db-table
    phase: Synthesize
    selector:
      kind: call
      callee: "DB::table"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              arg: 0
              require_literal: true
              normalize:
                - singularize
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: ReadsDb, direction: incoming }
          confidence: 0.9

  # Eloquent convention: `class ProductGroupedProduct extends Model` -> `product_grouped_products`.
  # Same algorithm as ThinkPHP's Model convention (snake_plural), only the base class differs.
  - id: laravel-model-table
    phase: Synthesize
    selector:
      kind: inheritance
      base: "Illuminate\\Database\\Eloquent\\Model|Model"
    binding:
      - Synthesize:
          node: Table
          identity:
            kind: Fqn
            value:
              self: true
              transform: { snake_plural: true, strip_namespace: true }
              normalize:
                - singularize
                - trim
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: MapsTo, direction: incoming }
          confidence: 0.6

  # ===== P5 Synthesize: model relations =====
  # `public function posts() { return $this->hasMany(Post::class); }`
  #
  # The strategy is **deliberately different** from TypeORM on the Node side: TypeORM's `@ManyToOne` /
  # `@OneToMany` are usually written **in pairs**, so there only the foreign-key holder is built to avoid a
  # reverse duplicate; Laravel / ThinkPHP **often declare only one side** (the most common case being
  # `User hasMany Post` with no reverse `belongsTo`), so building one side would lose a lot of edges —
  # hence both sides are built here; better redundant than missing.
  #
  # The target model comes from arg0's `Post::class`; if unavailable it is skipped silently (`morphTo()` with no
  # argument is exactly that case).
  # Relation methods are defined **inside the method body**, and owner_fqn is `App\Models\User::posts`,
  # so `owner_class` resolves to the model class rather than the relation method.
  - id: laravel-model-relation
    phase: Synthesize
    selector:
      kind: call
      # Only `$this->` receivers are recognised: relations are always defined in model instance methods, and a bare
      # method name would misfire on ordinary methods of the same name.
      callee: "$this->hasOne|$this->hasMany|$this->belongsTo|$this->belongsToMany|$this->hasOneThrough|$this->hasManyThrough|$this->morphOne|$this->morphMany|$this->morphToMany|$this->morphedByMany|$this->morphTo"
    binding:
      - Link:
          kind: References
          from: { owner_class: true, resolve: class_const }
          to: { arg: 0, resolve: class_const, require_class: true }
          confidence: 0.75

  # ===== P6 AnnotatePost: model relation -> table-level foreign key =====
  # Project "model -> model" down to "table -> table": each end walks one `MapsTo` hop to its own table.
  # One-to-many (a model with N relations produces N foreign-key edges); if one end has no `Table`, that entry is skipped.
  - id: laravel-table-foreign-key
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: Class
    binding:
      - Project:
          kind: ForeignKey
          along: References
          from: [MapsTo]
          to: [MapsTo]
          confidence: 0.7

  # ===== P5 Synthesize: ConfigKey / Cache =====
  # Factored into the language-common layer `fkb/php/common.yaml` (`php-common-config` / `php-common-cache-*`),
  # effective for every PHP framework, so each framework FKB does not repeat the same cache / config recognition logic.

  # ===== P5 Synthesize: Queue =====
  # `dispatch(new OrderCreatedJob($x))` / `OrderCreatedJob::dispatch($x)`.
  # Same as ThinkPHP's `Queue::push`: prefer the real class in arg:0, fall back to "the class that issued the call".
  - id: laravel-queue-dispatch
    phase: Synthesize
    selector:
      kind: call
      callee: "dispatch|*::dispatch"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Queue
          identity:
            kind: Named
            value:
              arg: 0
              resolve: class_const
              require_class: true
              transform: { class_to_topic: true }
            value_fallback:
              owner_class: true
              transform: { class_to_topic: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link: { kind: PublishesTo, direction: incoming }
          confidence: 0.85

  # ===== P5 Synthesize: events (**runtime registration**) =====
  #
  # Laravel has no config file like ThinkPHP's `app/event.php` — events are registered with
  # `Event::listen('evt', 'Listener@handle')` in a ServiceProvider's `boot()`.
  # So the event node is **synthesized from the call site** here, rather than loaded from a config file.
  #
  # Three shapes measured:
  #   ① `'Listener@handle'` string -> handed to P7, split into class + method by the `@` declared in this file's `handler`
  #   ② `function ($x) {...}` closure -> cannot be resolved statically; only the event node is built, no `HandledBy` edge
  #   ③ `protected $listen = ['evt' => [[Product::class, 'beforeUpdate']]]` class property
  #      -> **the current DSL cannot express this** (a property array value is not a `config_entry`); left for later
  - id: laravel-event-registration
    phase: Synthesize
    selector:
      kind: call
      callee: "Event::listen"
    binding:
      - Synthesize:
          node: ExternalSystem
          subtype: Event
          identity:
            kind: Named
            value: { arg: 0, require_literal: true }
          fields:
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            to: { arg: 1, resolve: method_ref }
          confidence: 0.9
          alias:
            namespace: event_name
            key: { arg: 0, require_literal: true }

  # ===== P5 Synthesize: HTTP contract =====
  #
  # Laravel handlers come in three shapes (measured on bagisto / beikeshop):
  #   ① `[WebMcpController::class, 'product']` array — the **main form**; it needs "the class at array index 0
  #      + the method name at index 1", which the existing `ValueSource` cannot express (it only has `arg` /
  #      `field`), so `to` resolution fails here and degrades to a PendingLink;
  #   ② `Route::resource('addresses', AddressController::class)` — arg1 is the class directly;
  #   ③ `Route::get('install', 'index')` — method name only; the controller comes from the outer group.
  #
  # The DSL now supports array-form handlers:
  #   `to: { arg: 1, element: 0 }` takes the class name, `to_method: { arg: 1, element: 1 }` takes the method name;
  #   when arg1 is not an array (`Route::resource` gives the class directly) `element` gets nothing,
  #   and `to_fallback` falls back to "the whole arg1" resolved as a class.
  - id: laravel-route-http-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "Route::{get,post,any,put,delete,patch,resource,view}"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method: { method_name: true, normalize: [upper] }
            path:
              arg: 0
              require_literal: true
              normalize:
                - leading_slash
          fields:
            - name: raw_path
              value: { arg: 0 }
            - name: side
              value: { literal: "backend" }
          link:
            kind: HandledBy
            direction: to_target
            # Shape ①: `[Ctrl::class, 'method']` — class name in arg1[0], method name in arg1[1]
            to: { arg: 1, element: 0, resolve: class_const }
            to_method: { arg: 1, element: 1 }
            # Shape ③: `Route::resource('x', Ctrl::class)` — arg1 is not an array, take the whole value
            to_fallback: { arg: 1, resolve: class_const }
          confidence: 0.9

resolvers:
  - id: laravel-container-make
    call: "app|app()->make|resolve|make"
    strategy: container
  - id: laravel-event-trigger
    call: "event|Event::dispatch"
    strategy: event
  - id: laravel-facade
    call: "Illuminate\\Support\\Facades\\*::*"
    strategy: facade
  - id: laravel-typed-instance-call
    call: "*->*"
    strategy: variable_type
