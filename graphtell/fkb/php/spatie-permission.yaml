# spatie/laravel-permission — a **library**-level FKB (not a framework)
#
# Why a library needs an FKB too: FKB is by design "predefined semantic knowledge about frameworks and common
# libraries". This package's middleware classes live in `vendor/` (not ingested), yet their semantics are certain:
# `PermissionMiddleware` means "authorise by permission". Once declared, a project only needs to register
# `'permission' => PermissionMiddleware::class` in `Kernel.php`, and graph building can materialise it as a
# `Middleware` node attached to routes — without its source ever entering the graph.
#
# This file only declares "known middleware" and contains no rules: a library's knowledge may contribute just a
# semantic list. Adding a similar library = adding one more YAML file, no kernel change.

id: spatie-permission
display_name: spatie/laravel-permission
language: php
version_hint: "5.x / 6.x"
side: backend
scope: framework
# A library's knowledge likewise **only takes effect when it is detected** (the package is really installed per
# composer.json) and never leaks into projects that do not use it.
detectors:
  - kind: manifest_dependency
    manifest: composer.json
    dependency: spatie/laravel-permission
    confidence: 0.95

loaders:
  # Written into the `middleware_classes` table: when P14 cannot resolve a node it materialises a Middleware node from this table.
  - id: spatie-permission-middleware
    table: middleware_classes
    from:
      kind: inline
      rows:
        - { class: "Spatie\\Permission\\Middlewares\\PermissionMiddleware", capability: "Authorization" }
        - { class: "Spatie\\Permission\\Middlewares\\RoleMiddleware", capability: "Authorization" }
        - { class: "Spatie\\Permission\\Middlewares\\RoleOrPermissionMiddleware", capability: "Authorization" }
