# Language-agnostic dead-code rules.
#
# Only the "pure topology" criteria live here; the few that depend on language-specific edges
# (Triggers / Emits / PublishesTo) are in rules/php/deadcode.yaml — those edges are currently only
# produced by the PHP FKB, so running them on a Java project would report every event node as
# "never triggered".

rules:
  - id: dead-table
    title: Table with no read or write reference at all
    description: >-
      The table was created (SQL create table / Model `$table`) but has no read or write edge on the
      graph. Two possibilities: genuinely unused, or the graph is missing an edge.
    severity: info
    category: deadcode
    params:
      - key: max_fan_in
        label: Fan-in ceiling
        description: Semantic in-edges must be <= this value to report; 0 = nobody references it at all, 1~2 tolerates a few references.
        kind: number
        default: 0
        min: 0
        max: 100
    applies_to:
      kinds: [Table]
    when:
      - fan_in_lte: "$max_fan_in"
    message: "Table {name} has at most {param:max_fan_in} read/write reference(s) on the graph (possibly genuinely unused, possibly a missing edge)"
    remediation: "Sample and confirm by hand; if code really does read and write it, FKB's read/write verb rules need extending"

  # Why `no_incoming: ReadsDb` combined with `fan_in_gte` instead of a separate "write count" predicate:
  # `fan_in` counts **semantic in-edges** (ReadsDb + WritesDb). Once `no_incoming: ReadsDb` has removed
  # all read edges, the remaining semantic in-edges are **all writes**, so `fan_in_gte` is naturally
  # equivalent to "write count >= threshold" — expressible precisely without adding a predicate kind.
  - id: write-only-table
    title: Table that is written but never read
    description: >-
      The table has writes (WritesDb in-edges) but nothing on the graph reads it (no ReadsDb in-edges).
      Data written in is never read: either the expected shape for an audit / log table, or a defect —
      "writing to the wrong place" or "the read path was not recognised by FKB".
      The threshold is tunable per project, so you only watch tables that really are being written to.
    severity: info
    category: deadcode
    params:
      - key: min_writes
        label: Minimum write sites
        description: The number of call sites writing the table must be >= this value; set it to 2~3 to see only tables that really are being written and filter out occasional single writes.
        kind: number
        default: 1
        min: 1
        max: 1000
    applies_to:
      kinds: [Table]
    when:
      - no_incoming: ReadsDb
      - has_incoming: WritesDb
      - fan_in_gte: "$min_writes"
    message: "Table {name} is written (>= {param:min_writes} places) but never read — nobody uses the data written in; possibly a dead write path or an unrecognised read path"
    remediation: "Confirm whether this is the expected shape for an audit / log table; otherwise check for a wrong target table, or code reading it that FKB did not recognise"
