# Architecture rules: they **depend only on graph topology**, so they are language-agnostic.
#
# The precondition for living here is that the criteria use no language-specific edge or annotation —
# fan-in is normalised: both PHP and Java produce semantic in-edges on the same basis.
# As soon as a rule uses an annotation that only some FKB produces (e.g. pii / sink),
# it must move to rules/<language>/ and declare `languages`.

rules:
  - id: hot-table
    title: Hot table (high fan-in)
    description: >-
      A table referenced by 50 or more places on the graph. It is usually a performance bottleneck
      and a coupling point that cannot be changed: touching one field means evaluating dozens of call
      sites. The threshold is tunable per project: a small database has a lower bar for "hot".
    severity: info
    category: architecture
    params:
      - key: min_fan_in
        label: Fan-in threshold
        description: Semantic in-edge count must be >= this value to report a hotspot; lower is more sensitive, higher reports only true central tables.
        kind: number
        default: 50
        min: 1
        max: 100000
      - key: max_nodes
        label: Candidate table cap
        description: Cap on the number of table nodes checked, so a very large database cannot drag one check down.
        kind: number
        default: 20000
        min: 100
        max: 200000
    applies_to:
      kinds: [Table]
      limit: "$max_nodes"
    when:
      - fan_in_gte: "$min_fan_in"
    message: "Table {name} is a hotspot (semantic in-edges >= {param:min_fan_in}); consider caching / read-write splitting / sharding"
    remediation: "Use the table perspective to see where the fan-in comes from and decide whether to converge the access entries"

  # Why this one uses a **positive** criterion (fan_in_gte) instead of "nobody reads / nobody writes":
  # measured across 8 projects, "a config key with no reader at all" matched 0 times (all 250 backend
  # keys had readers), so the inverted criterion only yields a silent zero — the least useful result.
  - id: config-read-hotspot
    title: Config key read directly everywhere
    description: >-
      A config key read directly by 50 or more places on the graph. This is not a bug, it is a
      **signal of change cost**: renaming the key means editing dozens or hundreds of call sites, and
      any one missed is only discovered at runtime.
    severity: info
    category: architecture
    params:
      - key: min_reads
        label: Read-site threshold
        description: The number of call sites reading the key must be >= this value; lower is more sensitive, higher shows only genuinely scattered keys.
        kind: number
        default: 50
        min: 1
        max: 100000
    applies_to:
      kinds: [ConfigKey]
    when:
      - fan_in_gte: "$min_reads"
      # Exclude keys starting with `$`: those are nodes FKB built from a PHP variable (a dynamic key
      # such as `config('$name')`) treated as a literal key name — they are not config keys. Keeping
      # them only produces one unreadable violation that hides the keys worth looking at.
      - not: { name_starts_with: "$" }
    message: "Config item {name} is read directly by {param:min_reads} or more places (spread across many call sites), so renaming it means editing all of them"
    remediation: "Converge on one config service / constant; business code should not read config keys directly all over the place"

  # The mirror image of write-only-table, but softer in nature: a read-only table is **legitimate**
  # in many projects — a dimension table, a seed table, or one written by an external system. So this
  # is only a hint, and the wording is "confirm who the writer is" rather than "this is a bug".
  # Likewise, `no_incoming: WritesDb` removes write edges so `fan_in` only counts reads.
  - id: read-only-table
    title: Table that is read but never written
    description: >-
      The table is read (ReadsDb in-edges) but nothing on the graph writes it (no WritesDb in-edges).
      The application never writes it: the data may come from an external system / ETL / a seed script,
      or the write path uses a chain FKB did not recognise.
      Usually this is a legitimate read-only dimension table; the point is to "confirm who writes it".
    severity: info
    category: architecture
    params:
      - key: min_reads
        label: Minimum read sites
        description: The number of call sites reading the table must be >= this value; raise it to see only heavily-read read-only tables and filter out occasional queries.
        kind: number
        default: 1
        min: 1
        max: 1000
    applies_to:
      kinds: [Table]
    when:
      - no_incoming: WritesDb
      - has_incoming: ReadsDb
      - fan_in_gte: "$min_reads"
    message: "Table {name} is read (>= {param:min_reads} places) but never written by the application — confirm the writer (external / ETL / seed) or an unrecognised write path"
    remediation: "Confirm where the data comes from; if the write really happens inside the application, extend FKB's write-table verb recognition"

  # Semantic fan-out = the number of resources (table / config / cache) a method reads and writes
  # directly. Note that `Calls` is not a semantic edge and is not counted here — so "high fan-out"
  # means "churning a lot of resources", not "calling many sub-methods".
  # A method reading and writing dozens of resources at once is usually a "god method": hard to test,
  # hard to change, easy to regress.
  - id: hotspot-method
    title: High fan-out method (resource coupling hotspot)
    description: >-
      A method's semantic fan-out (the number of tables / configs / caches it reads and writes
      directly) is very high. A method churning a large number of resources at once is usually a
      "god method": hard to test, hard to change, prone to regressions.
      The threshold is tunable per project: a small codebase has a lower bar.
    severity: info
    category: architecture
    params:
      - key: min_fan_out
        label: Semantic fan-out threshold
        description: The number of resources (table / config / cache) the method touches directly must be >= this value; raise it to report only genuinely out-of-control methods.
        kind: number
        default: 20
        min: 1
        max: 100000
    applies_to:
      kinds: [Method]
    when:
      - fan_out_gte: "$min_fan_out"
    message: "Method {name} reads and writes {param:min_fan_out} or more resources directly (semantic fan-out >= threshold); a high-coupling hotspot"
    remediation: "See whether it can be split into several methods by responsibility; high fan-out usually means one method has swallowed several use cases"
