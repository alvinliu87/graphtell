# Contract bridge rules: do the front end and the back end actually line up?
#
# These are the **most valuable and the easiest to verify** rules: they are both product value
# (phantom calls / dead endpoints are real bugs) and an acceptance harness for the graph
# (0 hits very likely means an edge was not built).

# Why these two are not `error`:
#
# On CRMEB this rule once reported 128 errors, and after checking them one by one **not a single one
# was a real bug** — their `handler` property held a route string like `v1.marketing.liveGoods/setShow`
# or a closure; the route really exists in `route.php` and works at runtime, FKB just did not resolve
# it into a Method node. On the graph you cannot distinguish "the route really has no handler" from
# "FKB did not resolve it", and `error` is the strongest signal there is: once it is untrustworthy,
# what the user learns is to ignore the whole report.
# So until FKB gains route-string resolution, both of these stay at `warning`.
rules:
  - id: http-contract-handler-unresolved
    title: Contract declares a handler but it did not resolve to a method
    description: >-
      The contract node carries a `handler` property (the route registration names a
      `controller/method` or a closure) but has no HandledBy out-edge — meaning **the route exists,
      the graph simply did not resolve it to a method node**.
      This is first of all a signal that "the graph is incomplete": no downstream conclusion built on
      it should be treated as final.
    severity: warning
    category: contract
    params:
      - key: name_filter
        label: Only matching contracts
        description: >-
          Substring filter on the name (case-insensitive). Empty = all contracts;
          fill in a prefix (e.g. /adminapi) to watch only one batch of routes, which narrows the scope a lot.
        kind: string
        default: ""
    applies_to:
      kinds: [HttpContract]
      name_contains: "$name_filter"
    when:
      - no_outgoing: HandledBy
      - not: { property_missing: handler }
    message: "Contract {name} registers a handler but the graph did not resolve it to a method (no HandledBy out-edge) — the route is probably fine, the graph's resolution has a gap"
    remediation: "Extend FKB's route-string / closure handler resolution rules; until then do not read this as \"the endpoint is broken\""

  - id: http-contract-without-handler
    title: HTTP contract has no handler
    description: >-
      The contract node has no `handler` property at all and no HandledBy out-edge —
      its origin is unknown (auto-inferred route, a path assembled by the front end, or the other side
      never registered it at all).
      It may be a genuinely dead link or something the graph failed to recognise, so it is only a warning.

      Only contracts **only the backend has ever synthesised** are considered (`side=backend`, i.e. `sides`
      holds a single party). Otherwise this rule and the "phantom call" one report the same batch of nodes
      twice (measured on p7/p8 where all 123 / 162 entries overlapped) — saying the same thing twice and
      doubling the warnings.
    severity: warning
    category: contract
    params:
      - key: name_filter
        label: Only matching contracts
        description: Substring filter on the name (case-insensitive); empty = all contracts.
        kind: string
        default: ""
    applies_to:
      kinds: [HttpContract]
      name_contains: "$name_filter"
    when:
      - no_outgoing: HandledBy
      - property_missing: handler
      - property_is: { name: side, value: backend }
    message: "Contract {name} has neither a handler property nor a HandledBy out-edge — possibly a real dead link, possibly an unrecognised route"
    remediation: "Confirm whether the path really has a server-side implementation; for front-end callers also check the \"phantom call\" rule"

  - id: frontend-calls-missing-backend
    title: Front end calls an endpoint that does not exist on the back end (phantom call)
    description: >-
      The front end really calls the contract (a `CallsHttp` in-edge exists), but the contract has no
      HandledBy out-edge to a backend handler.
      The criterion is the **edge, not the `side` property**: several parties may write the same synthesised
      node, and the scalar `side` is only a derived label then (`bridge`), so "who knows about this node"
      belongs to the evidence, not to a property any party can overwrite.
      **Known limitation**: the baseURL prefix of front-end axios/request calls (e.g. `/adminapi/v1`)
      does not yet take part in identity normalisation, so many hits actually come from "the prefix was
      not joined" rather than a real phantom call — hence warning rather than error, and the wording
      spells out both possibilities.
    severity: warning
    category: contract
    params:
      - key: name_filter
        label: Only matching contracts
        description: Substring filter on the name (case-insensitive); empty = all front-end contracts.
        kind: string
        default: ""
    applies_to:
      kinds: [HttpContract]
      name_contains: "$name_filter"
    when:
      - has_incoming: CallsHttp
      - no_outgoing: HandledBy
    message: "The front end calls {name}, but the graph has no matching backend route (could be a real phantom call, or the front-end baseURL prefix was not normalised)"
    remediation: "Sample and check by hand; if it is a prefix problem, add baseURL resolution rules to the front-end FKB"

  - id: backend-endpoint-never-called
    title: Backend endpoint has no caller (dead endpoint)
    description: >-
      The backend has a handler, but nothing on the graph CallsHttp into it. Note that endpoints called
      by external systems / apps / third parties also match, so this is info level only.
    severity: info
    category: contract
    params:
      - key: name_filter
        label: Only matching endpoints
        description: Substring filter on the name (case-insensitive); empty = all backend endpoints.
        kind: string
        default: ""
    applies_to:
      kinds: [HttpContract]
      name_contains: "$name_filter"
    when:
      - has_outgoing: HandledBy
      - no_incoming: CallsHttp
      - not: { property_is: { name: "side", value: "frontend" } }
    message: "Endpoint {name} has a handler but no front-end caller at all; it may be a dead endpoint"
    remediation: "Confirm whether a caller still exists (app / third party / scheduled task); if not, retire it"
