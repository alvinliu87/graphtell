# Performance / cache-usage rules.
#
# These only depend on the cross-language normalised semantic edges ReadsCache / WritesCache (produced
# by both PHP and JS), so they live in the global layer. The criterion is the pure-topology
# "read but never written" and does not rely on anything language-specific.

rules:
  # Why `has_incoming ReadsCache` + `no_outgoing WritesCache` instead of a separate "write count"
  # predicate: a Cache's ReadsCache in-edge means "is read", its WritesCache out-edge means "is
  # written". Read with no write means "it is read but nothing on the graph ever writes it" — the
  # engine currently has no "count edges of a kind" predicate, and these two boolean predicates already
  # express "orphan read" precisely.
  - id: cache-never-written
    title: Cache is read but nothing on the graph writes it
    description: >-
      A Cache node has ReadsCache in-edges (some code reads it) but no WritesCache out-edges (nothing
      on the graph writes it). Two possibilities: reads always get empty / stale data (a real dead cache
      read), or the write path uses a mechanism the graph does not recognise (framework auto-caching,
      or another process filling it).
    severity: info
    category: performance
    params:
      - key: name_filter
        label: Only matching caches
        description: Substring filter on the name (case-insensitive); empty = all caches.
        kind: string
        default: ""
    applies_to:
      kinds: [Cache]
      name_contains: "$name_filter"
    when:
      - has_incoming: ReadsCache
      - no_outgoing: WritesCache
    message: "Cache {name} is read but nothing on the graph writes it — reads may always be empty / stale, or the write path is unrecognised"
    remediation: "Confirm the cache really has a writer; if a framework or another process fills it, add the corresponding write edge in FKB"
