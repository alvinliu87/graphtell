# API hygiene (REST semantics) rules.
#
# These rules only depend on the `name` / `identity` of an HttpContract node — and `name` is
# normalised across languages (PHP routes, Java @RequestMapping and JS front-end contracts all
# collapse into a shape like "GET /api/xxx"), so they live in the global layer and run without
# declaring `languages`.
#
# Why the verb list uses strong verbs only: edit / update / modify are often used for "edit form"
# GET views (returning an HTML form, itself read-only), so including them would flag a batch of
# normal pages as violations. delete / remove / destroy / truncate / insert / reset / purge /
# clear / wipe are the unambiguous write actions. To loosen it, edit the `any_of` list below.

rules:
  - id: get-with-write-verb
    title: GET endpoint performs a write
    description: >-
      An HTTP contract whose name starts with GET but contains a write verb (delete / remove /
      destroy / truncate / insert / reset / purge / clear / wipe). REST semantics require GET to be
      read-only: a GET carrying a delete / clear action breaks cache and retry safety, and is easily
      triggered by crawlers or browser prefetch.
    severity: warning
    category: api-hygiene
    params:
      - key: name_filter
        label: Only matching contracts
        description: Substring filter on the name (case-insensitive); empty = all contracts.
        kind: string
        default: ""
    applies_to:
      kinds: [HttpContract]
      name_contains: "$name_filter"
    when:
      - name_starts_with: "get "
      - any_of:
          - name_contains: delete
          - name_contains: remove
          - name_contains: destroy
          - name_contains: truncate
          - name_contains: insert
          - name_contains: reset
          - name_contains: purge
          - name_contains: clear
          - name_contains: wipe
    message: "Contract {name} is a GET but contains a write verb, violating REST read-only semantics (a retry or prefetch may trigger the write)"
    remediation: "Change the endpoint to a write method such as POST / DELETE; if it really is a read-only clear / delete preview, rename it to avoid the write verb"
