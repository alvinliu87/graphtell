# N+1: per-row database access inside a loop (Java / Spring Boot version).
#
# The criterion is **exactly isomorphic** to the PHP side; it is one fact assembled across two phases:
#   1. `CallSite.properties.in_loop` — a mark the Java parser sets when the call is collected inside the
#      **body** of a `for` / enhanced `for` / `while` / `do-while` (the only place on the graph that
#      expresses "this code runs N times");
#   2. the `db-query` / `db-write` annotation — a projection P7 leaves on the call site while turning
#      that call into a `ReadsDb` / `WritesDb` edge. It reuses P7's verb classification result (FKB
#      `db_verbs`) instead of writing its own verb list inside the rule.
#
# Why it must hang off `CallSite` rather than `Method`: see the notes in rules/php/n1-query.yaml —
# method granularity cannot distinguish "query N times inside the loop" from "query once outside it".
#
# Differences from the PHP version: the `migration` / `seeder` exclusions are gone (those are Laravel
# directory conventions; Java has no equivalent).
#
# Preconditions (only completed in this round, all of them required):
#   * the Java parser recognises loop bodies (in_loop);
#   * DAOs (JPA Repository / MyBatis Mapper) get `MapsTo` (DAO → table) via generic type arguments;
#   * field declaration types are completed into FQNs by same-package resolution — otherwise P7 cannot
#     find `MapsTo` from a short name and produces no action edge.

rules:
  - id: java-n1-query-in-loop
    title: Per-row database read inside a loop (N+1)
    description: >-
      A database **read** happens inside a loop body: N records means N round trips, which degrades into
      an N+1 query as the data grows. The fix is one batch fetch outside the loop
      (`findAllById(ids)` / `whereIn` / eager-loading the association) and pairing in memory.
      Two kinds of exceptions to exclude first: looping over a **constant-length** collection such as
      config or a dictionary (N is small, no change needed), and per-day / per-enum bucketed
      aggregation loops (N is bounded, an acceptable pattern).
    severity: info
    category: performance
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases to speed up (at the cost of missing later call sites).
        kind: number
        default: 200000
        min: 1000
        max: 2000000
    applies_to:
      kinds: [CallSite]
      languages: [java]
      limit: "$max_nodes"
    when:
      - property_is: { name: in_loop, value: "true" }
      - has_annotation: db-query
    message: "Per-row database read inside a loop ({name}) — N records = N queries; fetch in one batch outside the loop instead"
    remediation: "Hoist the per-row query out of the loop into one batch fetch (findAllById / whereIn / eager-load the association), then pair by key in memory"

  - id: java-n1-write-in-loop
    title: Per-row database write inside a loop
    description: >-
      A database **write** happens inside a loop body: N records means N INSERT / UPDATE round trips.
      Same root cause as the N+1 read, but a different fix — batch writes (`saveAll` / `insertBatch` /
      a single whereIn update) or merging several updates into one conditional update.
      Note: when the loop body carries business validation (each row must be checked individually
      before writing), per-row writes are **reasonable**; what should change then is the transaction
      boundary (wrap the whole thing in `@Transactional`), not forcing a batch.
    severity: info
    category: performance
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases to speed up (at the cost of missing later call sites).
        kind: number
        default: 200000
        min: 1000
        max: 2000000
    applies_to:
      kinds: [CallSite]
      languages: [java]
      limit: "$max_nodes"
    when:
      - property_is: { name: in_loop, value: "true" }
      - has_annotation: db-write
    message: "Per-row database write inside a loop ({name}) — N records = N writes; batch the writes or merge the updates into one"
    remediation: "Switch to batch writes (saveAll / insertBatch / a single whereIn update); if each row needs its own validation, wrap the whole loop in one @Transactional instead"
