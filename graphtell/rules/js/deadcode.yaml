# Dead-code rules for the front-end (JS / TS) ecosystem.
#
# Why `rules/js/` needs its own directory with `languages: [javascript]`:
# `EventBus` nodes and the `Emits` / `ListensTo` edges are the semantics of a **front-end event bus**,
# produced by the js / uni-app FKB. Placing them in the global layer would run them on pure backend
# projects, where the graph has none of these nodes at all — the rule would end with "0 hits" and be
# read as "no problem".
#
# The three `orphan-*` rules are PHP's **event / queue** semantics (Triggers / PublishesTo), a
# different thing from the event bus in this file, so the two live in separate directories.

rules:
  # Direction one: someone publishes, nobody listens — the broadcast is dropped.
  - id: eventbus-emitted-without-listener
    title: Event published but nobody listens
    description: >-
      An EventBus node has Emits in-edges (publisher) but no ListensTo in-edge (listener).
      The typical cause is a refactor that removed the listener but left the emit line — this kind of
      code raises no error, it just **silently stops working**, often discovered months later.
    severity: info
    category: deadcode
    applies_to:
      kinds: [EventBus]
      languages: [javascript]
    when:
      - has_incoming: Emits
      - no_incoming: ListensTo
    message: "Event {name} has a publisher but no listener on the graph — the broadcast is handled by nobody (or the listener registered under a dynamic name the graph could not resolve)"
    remediation: "Confirm whether the listener still exists; if abandoned, delete the emit rather than keeping a broadcast nobody receives"

  # Direction two: someone listens, nobody publishes — the listener becomes dead code.
  # It **must not be merged** with direction one: the fixes are opposite (delete the emit vs delete the
  # listener), and merging would force vague wording like "mismatch", pushing the judgement back to the user.
  - id: eventbus-listened-without-emitter
    title: Event listened to but never published
    description: >-
      An EventBus node has ListensTo in-edges (listener) but no Emits in-edge (publisher).
      The listener therefore never fires — it is **dead code**, and deleting it changes no behaviour.
    severity: info
    category: deadcode
    applies_to:
      kinds: [EventBus]
      languages: [javascript]
    when:
      - has_incoming: ListensTo
      - no_incoming: Emits
    message: "Event {name} has a listener but no publisher on the graph — the listener can never fire (or the publisher uses a dynamic name the graph could not resolve)"
    remediation: "Confirm whether the publisher was deleted; if so, remove this listener (it can never execute)"

  # Direction three: neither end — a total orphan. The first two require "at least one end exists"
  # before a fix can be judged (delete emit vs delete listener); this one has both ends empty, so the
  # whole bus is isolated on the graph.
  # This is not the same as `orphan-event` (PHP Triggers events) / `orphan-queue` (PHP PublishesTo
  # queues): here it is the front-end event bus (Emits / ListensTo).
  - id: eventbus-orphan
    title: Event bus with neither publisher nor listener
    description: >-
      An EventBus node has neither Emits in-edges (publisher) nor ListensTo in-edges (listener).
      Unlike the other two "asymmetric" rules, this one is a **total orphan**: both ends are missing and
      the whole bus is isolated on the graph — usually leftover from a refactor, or both publishing and
      listening use dynamic names the graph could not resolve.
    severity: info
    category: deadcode
    applies_to:
      kinds: [EventBus]
      languages: [javascript]
    when:
      - no_incoming: Emits
      - no_incoming: ListensTo
    message: "Event bus {name} has neither a publisher nor a listener — a total orphan on the graph (or dynamic names prevented resolution)"
    remediation: "Confirm whether this event bus is still used; if abandoned, delete it entirely rather than keeping a bus with both ends empty"
