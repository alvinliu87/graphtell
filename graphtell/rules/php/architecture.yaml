# PHP-only architecture rules (criteria depend on annotations produced by the PHP FKB).

rules:
  - id: pii-table-hot
    title: Hot table containing PII
    description: "Both a hotspot table and one holding personal information — blast radius and security sensitivity are both maxed out, so fix it first."
    severity: warning
    category: architecture
    params:
      - key: min_fan_in
        label: Fan-in threshold
        description: A PII table must be referenced by >= this many places to be reported; lower it to catch sensitive-asset spread earlier.
        kind: number
        default: 20
        min: 1
        max: 100000
    applies_to:
      kinds: [Table]
      languages: [php]
    when:
      - has_annotation: pii
      - fan_in_gte: "$min_fan_in"
    message: "Table {name} contains PII and is referenced by {param:min_fan_in} or more places; a sensitive asset with a large blast radius"
    remediation: "Converge the access entries first and unify the masking egress"
