# N+1: per-row database access inside a loop.
#
# The criterion is one fact **assembled across two phases**:
#   1. `CallSite.properties.in_loop` — a mark the PHP parser sets when the call is collected inside the
#      `body` of a `for` / `foreach` / `while` / `do-while` (the only place on the graph that expresses
#      "this code runs N times");
#   2. the `db-query` / `db-write` annotation — a projection P7 leaves on the call site while turning
#      that call into a `ReadsDb` / `WritesDb` edge. It reuses P7's verb classification result (FKB
#      `db_verbs`) instead of writing its own verb list inside the rule.
#
# Why it must hang off `CallSite` rather than `Method`: `ReadsDb` edges hang off methods, and P8
# propagates them upwards along the call chain — method granularity only yields "somewhere on this
# method's call chain the database was read", which cannot distinguish "query N times inside the loop"
# from "query once outside it"; the noise would be worse than the already-rejected "god method
# (a method reads and writes N tables)" rule.
#
# Read and write are split into two rules: the fixes differ (batch read / batch write) and so does the wording.

rules:
  - id: n1-query-in-loop
    title: Per-row database read inside a loop (N+1)
    description: >-
      A database **read** happens inside a loop body: N records means N round trips, which degrades into
      an N+1 query as the data grows. The fix is one batch fetch outside the loop (whereIn /
      eager-loading the association) and pairing in memory.
      Two kinds of exceptions to exclude first: looping over a **constant-length** collection such as
      config or a dictionary (N is small, no change needed), and per-day / per-enum bucketed
      aggregation loops (N is bounded, an acceptable pattern).
    severity: info
    category: performance
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases to speed up (at the cost of missing later call sites).
        kind: number
        default: 200000
        min: 1000
        max: 2000000
    applies_to:
      kinds: [CallSite]
      languages: [php]
      limit: "$max_nodes"
    when:
      - property_is: { name: in_loop, value: "true" }
      - has_annotation: db-query
      # Exclude migrations / seed scripts: looping writes there are a **one-off installation action**,
      # not a production hot path. Without this, 9 of the 11 hits measured on bagisto came from
      # `Database/Migrations` and `Database/Seeders` — noise that buries the real runtime N+1.
      - not:
          any_of:
            - fqn_contains: migration
            - fqn_contains: seeder
    message: "Per-row database read inside a loop ({name}) — N records = N queries; fetch in one batch outside the loop instead"
    remediation: "Hoist the per-row query out of the loop into one batch fetch (whereIn / eager-load the association), then pair by key in memory"

  - id: n1-write-in-loop
    title: Per-row database write inside a loop
    description: >-
      A database **write** happens inside a loop body: N records means N INSERT / UPDATE round trips.
      Same root cause as the N+1 read, but a different fix — batch writes (saveAll / insertAll / a
      single whereIn update) or merging several updates into one conditional update.
      Note: when the loop body carries business validation (each row must be checked individually
      before writing), per-row writes are **reasonable**; what should change then is the transaction
      boundary (wrap the whole thing in one transaction), not forcing a batch.
    severity: info
    category: performance
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases to speed up (at the cost of missing later call sites).
        kind: number
        default: 200000
        min: 1000
        max: 2000000
    applies_to:
      kinds: [CallSite]
      languages: [php]
      limit: "$max_nodes"
    when:
      - property_is: { name: in_loop, value: "true" }
      - has_annotation: db-write
      # Same as `n1-query-in-loop`: looped writes in migrations / seed scripts are a one-off install action.
      - not:
          any_of:
            - fqn_contains: migration
            - fqn_contains: seeder
    message: "Per-row database write inside a loop ({name}) — N records = N writes; batch the writes or merge the updates into one"
    remediation: "Switch to batch writes (saveAll / insertAll / a single whereIn update); if each row needs its own validation, wrap the whole loop in one transaction"
