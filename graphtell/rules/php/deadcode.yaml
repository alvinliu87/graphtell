# PHP-only dead code / orphan resource rules.
#
# Why `languages: [php]` must be declared:
# these criteria use edges only the PHP FKB produces — `Triggers` (event trigger) and `PublishesTo`
# (queue publish). Measured across 8 projects: these edges only appear in PHP projects (p1~p5) and
# never once in Java projects (p6~p8). Without gating on the environment, running on a pure Java
# project would report every event / queue node as "unused" — all vacuously-true false positives.
#
# Note: `Emits` / `ListensTo` (front-end event bus) are **JS** edges and are not in this file —
# they moved to `rules/js/deadcode.yaml`. Rules such as `orphan-eventbus` were once mislabelled php,
# and because the Emits edge does not exist on PHP projects they were silently skipped via
# `rules_unavailable`, i.e. never effective; they now declare javascript in `rules/js`.

rules:
  # Note: Event and EventBus use different edge kinds and **must not be merged into one rule**.
  #   Event    : caller --Triggers--> Event, Event --HandledBy--> listener method
  #   EventBus : publisher --Emits--> EventBus, listener --ListensTo--> EventBus
  # An early version put both in one rule and judged `no_incoming: Triggers` uniformly,
  # which misreported all 28 EventBus nodes (they can never have a Triggers in-edge).
  - id: orphan-event
    title: Event that is never triggered
    description: "An event node has no Triggers in-edge — declared but nobody dispatches it."
    severity: info
    category: deadcode
    applies_to:
      kinds: [Event]
      languages: [php]
    when:
      - no_incoming: Triggers
    message: "Event {name} has no trigger source (no Triggers in-edge)"
    remediation: "Confirm whether the event is still used; if abandoned, delete the declaration"

  - id: orphan-queue
    title: Queue that is never published to
    description: "A Queue / Topic node has no PublishesTo in-edge."
    severity: info
    category: deadcode
    applies_to:
      kinds: [Queue, Topic]
      languages: [php]
    when:
      - no_incoming: PublishesTo
    message: "Queue {name} has no publisher (no PublishesTo in-edge)"
    remediation: "Confirm whether the producer was removed, or extend FKB's publish verbs"
