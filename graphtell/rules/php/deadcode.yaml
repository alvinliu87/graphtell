# PHP 专属的死代码 / 孤儿资源规则。
#
# 为什么必须声明 `languages: [php]`：
# 这几条的判据是 PHP FKB 才产出的边 —— `Triggers`（事件触发）、
# `Emits` / `ListensTo`（事件总线）、`PublishesTo`（队列投递）。
# 实测 8 个工程：这些边**只存在于 PHP 工程**（p1~p5），
# Java 工程（p6/p7/p8）一条都没有。若不在环境上挡住，
# 在纯 Java 工程上跑会把每个事件 / 队列节点都报成"没人用"—— 全是恒真误报。
#
# 以后 Java / JS 的 FKB 产出同名边时，把对应规则复制到 rules/java/ 即可，
# global 层不需要改动。

rules:
  # 注意：Event 与 EventBus 的边种类不同，**不能合并成一条规则**。
  #   Event    : 调用方 --Triggers--> Event，Event --HandledBy--> 监听方法
  #   EventBus : 发布方 --Emits--> EventBus，监听方 --ListensTo--> EventBus
  # 早期版本把两者写在同一条规则里、统一判 `no_incoming: Triggers`，
  # 结果 28 个 EventBus 全被误报（它们永远不会有 Triggers 入边）。
  - id: orphan-event
    title: 从未被触发的事件
    description: "事件节点没有任何 Triggers 入边 —— 声明了但没人发。"
    severity: info
    category: deadcode
    applies_to:
      kinds: [Event]
      languages: [php]
    when:
      - no_incoming: Triggers
    message: "事件 {name} 没有任何触发方（无 Triggers 入边）"
    remediation: "确认事件是否仍在用；若已废弃则删除声明"

  - id: orphan-eventbus
    title: 从未被发布的事件总线
    description: "EventBus 节点没有任何 Emits 入边 —— 声明了但没有发布方。"
    severity: info
    category: deadcode
    applies_to:
      kinds: [EventBus]
      languages: [php]
    when:
      - no_incoming: Emits
    message: "事件总线 {name} 没有任何发布方（无 Emits 入边）"
    remediation: "确认总线是否仍在用；若已废弃则删除声明"

  - id: orphan-queue
    title: 从未被投递的队列
    description: "队列 / Topic 节点没有任何 PublishesTo 入边。"
    severity: info
    category: deadcode
    applies_to:
      kinds: [Queue, Topic]
      languages: [php]
    when:
      - no_incoming: PublishesTo
    message: "队列 {name} 没有任何投递方（无 PublishesTo 入边）"
    remediation: "确认生产者是否已被移除；或补 FKB 的投递动词"
