# Runtime smells: remote calls inside a loop, multiple writes without a transaction.
#
# Neither of these criteria **depends on a judgement such as "is there a vulnerability"** — they only
# report hard facts: a remote call happens inside a loop; a method writes several times with no visible
# transaction boundary. The fix is left to human judgement — the graph cannot see whether a batch API
# exists or whether the transaction lives further out.
#
# `ext-call-in-loop` is repeated once per stack (`rules/{js,python,java}/runtime.yaml`), each copy with its
# own `languages:` and its own id — the same shape as `n1-query` (`rules/php/n1-query.yaml` +
# `rules/java/n1-query.yaml`). P12 itself carries no language gate, but a rule declaring **no** `languages`
# must depend only on graph topology and never on an annotation, so this rule cannot move to
# `rules/global/` (enforced by `builtin_rules_are_organised_per_language`).

rules:
  # ⚠️ The `ext-call-in-loop` annotation is produced by the P12 External phase.
  - id: ext-call-in-loop
    title: External system call inside a loop
    description: >-
      A loop body calls an HTTP / SMS / email / RPC client (the list comes from FKB `external_calls`).
      One network round trip costs an order of magnitude more than one database query, and amplifying it
      N times serially is the classic cause of endpoint timeouts.
      Typical scenes: sending an SMS per user in a loop, querying shipping tracking in a loop, pulling
      remote images in a loop.
      Exception: when the loop is itself a "retry on failure / idempotent compensation" scenario
      (N is small and there is backoff), no change is needed.
    severity: warning
    category: performance
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases so one check does not get slow.
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: ext-call-in-loop
    message: "External call {name} inside a loop (at {file}:{line}) — N records = N serial network round trips"
    remediation: >-
      Prefer a batch API from the third party (pass several ids at once); when no batch API exists, push
      the in-loop calls onto a queue for async processing, or at least issue them concurrently with a
      timeout — do not let N round trips block the request serially.

  # ⚠️ The `multi-write-without-tx` annotation is produced by the P13 Tx phase (landing on a **method** node).
  #
  # The wording deliberately says "not recognised": the transaction may be opened by an outer caller,
  # which the graph cannot judge — better to under-report than to flag a method that is wrapped as
  # "not wrapped" (that would make people stop trusting this rule).
  - id: multi-write-without-tx
    title: Multiple database writes with no transaction boundary recognised
    description: >-
      One method writes directly to 2 or more different tables (the `WritesDb` edges left by P7 verb
      classification, excluding indirect edges propagated along the call chain), and the method has no
      transaction marker at all (`transaction` / `startTrans` / `commit` …).
      If any step in the middle fails, **partially successful** dirty data is left behind (the order was
      updated, the stock was not deducted).
      Two caveats: the transaction may be opened by an outer caller, which the graph cannot confirm
      across procedures; and `if/else` branches that each write the *same* table once **do not count**
      (mutually exclusive branches, so partial success is impossible).
    severity: info
    category: architecture
    params:
      - key: max_nodes
        label: Candidate method cap
        description: Cap on the number of Method nodes checked; lower it on very large codebases so one check does not get slow.
        kind: number
        default: 200000
        min: 1000
        max: 2000000
    applies_to:
      kinds: [Method]
      limit: "$max_nodes"
      languages: [php]
    when:
      - has_annotation: multi-write-without-tx
    message: "Method {name} writes to the database several times but no transaction boundary was recognised (at {file}:{line}) — a partial failure leaves dirty data"
    remediation: >-
      Confirm whether these writes must be atomic: if so, wrap them in one transaction (and do not put
      remote calls inside it); if the transaction already lives further out, ignore this entry and bring
      the entry method into the recognised scope.
