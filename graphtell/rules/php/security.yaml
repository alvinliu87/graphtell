# PHP 专属的安全类规则。
#
# 刻意不做"污点可达性分析"（source 是否真的流到 sink）—— 那需要路径可达计算，
# 代价与误报率都高。MVP 只报**已确认的事实**：图上识别到了 sink、写端点没识别到鉴权。
# 措辞也因此一律写成"未识别到 / 需确认"，而不是"存在漏洞"。

rules:
  # ⚠️ 已停用（enabled: false）—— 不要轻易打开。
  #
  # 停用原因：这条规则的判据是**反向证据**（`no_capability` + `no_annotation`），
  # 而反向证据只在"正面证据确实存在过"时才成立。实测 8 个工程的 `Capability`
  # 通道**全为空**（连一个能力标注都没有），且工程 5 的 RouteGroup 节点数为 0，
  # 于是 FKB 的 `crmeb-public-endpoint` 把 1603 个契约里的 1529 个标成了
  # `auth.public`（`none_of_capability` 恒真 = 恒等真命题）。
  # 结果：这条规则永远报 0 条 —— 不是"代码没问题"，而是"规则瞎了"。
  # 一条**永远报干净**的安全规则比没有这条规则更危险（制造虚假安全感），
  # 因此在能力推断真正跑通之前必须停用。恢复条件见 remediation。
  #
  # 注：现在即使打开也会被 `rules_unavailable` 自动拦下（Capability 通道为空），
  # 停用是双保险 —— 不为"能跑"留任何侥幸空间。
  - id: write-endpoint-without-auth
    title: 写端点未识别到鉴权能力
    description: >-
      POST / PUT / PATCH / DELETE 这类会改变状态的端点，图上既没有
      Authentication 能力标注，也没有被标为公开端点。
      （当前停用：Capability 通道尚无产出，判据不成立。）
    severity: warning
    category: security
    enabled: false
    applies_to:
      kinds: [HttpContract]
      languages: [php]
    when:
      - any_of:
          - identity_contains: "post "
          - identity_contains: "put "
          - identity_contains: "patch "
          - identity_contains: "delete "
      - no_capability: [Authentication]
      - no_annotation: auth.public
    message: "写端点 {name} 未识别到鉴权能力（可能确实没做，也可能是图没解析出中间件）"
    remediation: "确认该端点是否应当鉴权；若中间件已在 FKB 支持范围内仍未被识别，补一条 capability 规则"

  - id: raw-sql-sink
    title: 存在原始 SQL 执行点
    description: >-
      图上被 Taint 通道标为 sink 的调用点（whereRaw / query / execute / Db::raw …）。
      只报事实，不判断入参是否来自用户。
    severity: warning
    category: security
    params:
      - key: max_nodes
        label: 候选调用点上限
        description: 参与检查的 CallSite 数量上限；超大库可调低以避免一次检查过慢。
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      # Taint 标注目前只有 PHP 的 FKB 产出（Java 工程实测 0 条 Taint 标注），
      # 不声明语言的话会在 Java 工程上被 `rules_unavailable` 拦下——
      # 声明出来更能表达"这条规则属于 PHP 生态"这个先验事实。
      languages: [php]
    when:
      - has_annotation: sink
    message: "原始 SQL 执行点 {name}（位于 {file}:{line}）—— 需确认入参是否被参数化"
    remediation: "改用参数化查询；若入参来自用户输入，这是 SQL 注入风险"

  - id: pii-table-needs-review
    title: 含 PII 的表需复核
    description: >-
      表被标注为含个人信息（手机号 / 身份证等）。MVP 只提示复核，
      不判断加密与脱敏是否做到位。
      （注：`pii` 标注由 fkb/php/crmeb.yaml 产出，其余工程暂无此标注，
      届时会被 `rules_unavailable` 拦下而不是硬报 0 条。）
    severity: warning
    category: security
    applies_to:
      kinds: [Table]
      languages: [php]
    when:
      - has_annotation: pii
    message: "表 {name} 被识别为含 PII 字段，需确认加密 / 脱敏 / 访问审计是否到位"
    remediation: "核对列的存储方式与导出路径；必要时加脱敏中间件"

  # ⚠️ 由 P9 Taint 阶段产出 `tainted_raw` 标注（原始 SQL 执行点的 SQL 字符串里直接拼了变量）。
  # 与 `raw-sql-sink`（只报 sink、warning）互补：这条是"用户数据真的流进去了"的确证，故 critical。
  - id: sql-injection-raw
    title: 原始 SQL 中拼接了用户数据（SQL 注入）
    description: >-
      调用点执行原始 SQL（Db::query / Db::execute / Db::raw / whereRaw / whereExp），
      且 SQL 字符串里直接拼接了变量（来自请求或外部）。无论变量是插值进字符串，
      还是整段 SQL 由变量传入，都属于高危 SQL 注入。由 P9 Taint 阶段判出。
    severity: critical
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_raw
    message: "原始 SQL 执行点 {name} 的 SQL 直接拼接了变量（位于 {file}:{line}）—— 高危 SQL 注入"
    remediation: >-
      改用参数化查询（? / :name 占位符，或 ->where('col = ?', [$var])），
      不要将用户输入拼进 SQL 字符串；若必须拼表名/列名，走白名单校验。

  # ⚠️ 由 P9 Taint 阶段产出 `tainted_where` 标注（where 条件字符串里直接拼了变量）。
  # 区别于参数化的 ->where('col = ?', [$var])：这里变量被塞进了条件字符串本身。
  - id: sql-injection-where-interp
    title: where 条件字符串中拼接了用户数据（SQL 注入）
    description: >-
      where / whereOr 的条件字符串里直接拼接了变量（如
      ->where("CONCAT(',',roles,',') LIKE '%,$roles,%'")）。这属于 SQL 注入，
      与参数化写法（占位符 + 绑定数组）有本质区别。由 P9 Taint 阶段判出。
    severity: critical
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_where
    message: "where 条件 {name} 直接拼接了变量（位于 {file}:{line}）—— SQL 注入风险"
    remediation: "改用 ->where('col = ?', [$var]) 参数化写法；绝不要把变量写进 SQL 字符串。"

  # ⚠️ 由 P10 Cors 阶段产出 `cors_origin_reflect` 标注（Access-Control-Allow-Origin 被设为
  # 请求 Origin，反射源站）。再配合 `Access-Control-Allow-Credentials: true` 即泄露用户凭证，
  # 属高危跨域配置。所有 PHP 工程通用的代码坏味。
  - id: cors-reflect-origin
    title: CORS 反射源站（Access-Control-Allow-Origin 设为请求 Origin）
    description: >-
      响应头 Access-Control-Allow-Origin 被直接设为请求的 Origin（或整段
      Access-Control-Allow-Origin 头由变量拼接）。这会把任意站点的请求都当同源、
      并（常配合 Access-Control-Allow-Credentials: true）泄露用户凭证，属高危跨域配置。
      由 P10 Cors 阶段判出。
    severity: error
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: cors_origin_reflect
    message: "Access-Control-Allow-Origin 被设为请求 Origin（位于 {file}:{line}）—— 反射源站，凭证级跨域泄露"
    remediation: >-
      使用固定白名单来源，或按请求 Origin 做「白名单比对后回写」；绝不可把
      request->header('origin') / $_SERVER['HTTP_ORIGIN'] 原样反射回去。

  # ⚠️ 由 P11 Sign 阶段产出 `weak_sign_compare` 标注。
  #
  # 判的是「验签做得对不对」而不是「有没有验签」—— 后者判不了：PHP 排除了 vendor、
  # Java 不扫 Maven 依赖，EasyWeChat / yansongda-pay / 官方 SDK 的 verify() 不在图里，
  # 任何"链路上没有验签"的判据都会对每个回调成立（100% 误报）。
  - id: sign-compare-loose
    title: 签名用松散比较（== / !=）
    description: >-
      外部回调的签名值被 `==` / `!=` 比较。PHP 的松散比较会让 `0e...` 形式的摘要
      互判相等（`md5('240610708') == md5('QNKCDZO')`），且逐字节短路退出构成
      计时侧信道。由 P11 Sign 阶段判出：同一函数内存在签名计算（md5 / sha1 /
      hash_hmac / *Sign()），且签名值被松散比较。
    severity: warning
    category: security
    params:
      - key: max_nodes
        label: 候选调用点上限
        description: 参与检查的 CallSite 数量上限；超大库可调低以避免一次检查过慢。
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: weak_sign_compare
    message: "签名计算 {name} 的结果被用 == / != 比较（位于 {file}:{line}）—— 松散比较 + 非恒定时间"
    remediation: >-
      改用 hash_equals($expected, $actual) 做恒定时间比较；先用字符串比较会引入
      `0e...` 类型混淆与计时侧信道。注意：`===` / `!==` 虽是严格比较，仍非恒定时间，
      也建议换成 hash_equals。

  # ⚠️ 由 P11 Sign 阶段产出 `weak_sign_hash` 标注。
  #
  # 只发 info：微信支付 V2、支付宝旧版、快递鸟等网关**官方就要求 MD5** ——
  # 报成"漏洞"就是误报，文案必须写成"需确认是否为网关要求"。
  - id: sign-weak-hash
    title: 签名使用 md5 / sha1
    description: >-
      签名计算用了 md5 或 sha1。多数情况是网关官方要求的（微信支付 V2 的 MD5 签名、
      支付宝旧版、部分快递 / 打印网关），此时无需改动；需要警惕的是**自研网关**
      选了弱算法 —— 那意味着签名可被碰撞与伪造。
    severity: info
    category: security
    params:
      - key: max_nodes
        label: 候选调用点上限
        description: 参与检查的 CallSite 数量上限；超大库可调低以避免一次检查过慢。
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: weak_sign_hash
    message: "签名使用弱哈希 {name}（位于 {file}:{line}）—— 若为网关官方要求可忽略，自研网关建议升级"
    remediation: >-
      确认网关文档要求的摘要算法；若是自研 / 可选，升级到 HMAC-SHA256 或 RSA-SHA256，
      并确保密钥不参与明文拼接。
