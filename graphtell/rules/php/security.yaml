# PHP-only security rules.
#
# Deliberately no "taint reachability analysis" (whether a source really flows into a sink) — that
# needs path-reachability computation and carries a high cost and false-positive rate. The MVP only
# reports **confirmed facts**: a sink was recognised on the graph, a write endpoint has no recognised
# auth. The wording is therefore always "not recognised / needs confirmation", never "there is a vulnerability".

rules:
  # ⚠️ Disabled (enabled: false) — do not turn it on lightly.
  #
  # Why disabled: this rule's criterion is **negative evidence** (`no_capability` + `no_annotation`),
  # and negative evidence only holds when positive evidence actually existed at some point. Measured
  # across 8 projects, the `Capability` channel was **entirely empty** (not a single capability
  # annotation), and project 5 had 0 RouteGroup nodes, so a project-level public-endpoint rule marked 1529 of
  # 1603 contracts as `auth.public` (`none_of_capability` always true = a tautology).
  # Result: this rule always reports 0 — not "the code is fine", but "the rule went blind".
  # A security rule that **always reports clean** is more dangerous than having no rule at all (it
  # manufactures false reassurance), so it must stay disabled until capability inference really works.
  # See remediation for the conditions to restore it.
  #
  # Note: even if enabled now it would be blocked automatically by `rules_unavailable` (the Capability
  # channel is empty); disabling is a second lock — leaving no room for "it can run" wishful thinking.
  #
  # Status: this rule is not blocked by `rules_unavailable` (it runs on the sample project), but gets **0 hits
  # out of 1603 candidates** — because it is structurally hollowed out by `thinkphp-public-endpoint`
  # in `fkb/php/thinkphp.yaml`: the latter uses `none_of_capability` to judge "public endpoint", which is
  # exactly the complement of this rule's `no_capability`; on the **same evidence source** the two are
  # mutually exclusive and exhaustive — a write endpoint either has an auth capability or has already
  # been judged public, so they never intersect.
  # Measured: of 585 write endpoints 80 require auth (they have capability annotations), 5 have optional
  # auth, and **500 have no auth middleware at all** — the third group is exactly what this rule wants to
  # report, and `auth.public` has already excluded them.
  # To make it meaningful again, pick one (both need code changes; do not enable this entry on your own):
  #   ① Tighten `thinkphp-public-endpoint`: only judge public those with no auth middleware attached at all;
  #     this needs a new predicate that can read `route_list.guards` (engine side).
  #   ② Turn it into a positive rule — **already delivered as `write-endpoint-with-optional-auth` below**:
  #     only report write endpoints "with an auth middleware whose argument is explicitly false (optional)";
  #     small in number and each one verifiable.
  - id: write-endpoint-without-auth
    title: Write endpoint has no auth capability recognised
    description: >-
      An endpoint that changes state (POST / PUT / PATCH / DELETE) has neither an Authentication
      capability annotation on the graph nor an explicit public-endpoint annotation.
      (Currently disabled: the Capability channel produces nothing yet, so the criterion does not hold.)
    severity: warning
    category: security
    enabled: false
    applies_to:
      kinds: [HttpContract]
      languages: [php]
    when:
      - any_of:
          - identity_contains: "post "
          - identity_contains: "put "
          - identity_contains: "patch "
          - identity_contains: "delete "
      - no_capability: [Authentication]
      - no_annotation: auth.public
    message: "Write endpoint {name} has no auth capability recognised (it may genuinely have none, or the graph did not resolve the middleware)"
    remediation: "Confirm whether this endpoint should require auth; if the middleware is within FKB's supported range but still unrecognised, add a capability rule"

  # ⚠️ The positive replacement for the rule above. The difference is the **nature of the criterion**:
  #   `write-endpoint-without-auth` uses a negative criterion ("no auth evidence") — always true when the
  #   evidence does not exist, and in practice hollowed out by a project-level public-endpoint rule
  #   (complementary and exhaustive → always 0 hits);
  #   this one uses a **positive criterion** ("the graph really saw: an auth middleware is attached and
  #   its argument explicitly says false"), which only holds on hard evidence and is therefore unaffected
  #   by "the graph did not resolve it".
  # It reports "this write endpoint is reachable without login", not "it may lack auth" — wording matched
  # to evidence strength.
  - id: write-endpoint-with-optional-auth
    title: Write endpoint auth is optional (reachable without login)
    description: >-
      The endpoint has an auth middleware attached, but the attached argument explicitly says optional
      (a project's `AuthTokenMiddleware::class, false`): if you are logged in the identity is attached, if
      not you are let through anyway.
      "Optional" is not the same as "absent", so this is only reported when the graph actually saw that
      argument — if it did not see it, it stays silent (that is the graph failing to resolve, not the code
      failing to do it).
    severity: warning
    category: security
    applies_to:
      kinds: [HttpContract]
      languages: [php]
    when:
      - any_of:
          - identity_contains: "post "
          - identity_contains: "put "
          - identity_contains: "patch "
          - identity_contains: "delete "
      - has_annotation: auth.optional
    message: "Write endpoint {name} has an auth middleware but the argument makes it optional (reachable without login) — confirm this is deliberate"
    remediation: >-
      If the endpoint must be logged in to operate (letting guests through while changing state is
      usually a vulnerability), change the attached argument to true;
      if the design really is "attach identity when logged in, still offer basic features when not", keep it.

  - id: raw-sql-sink
    title: Raw SQL execution site present
    description: >-
      A call site marked as a sink by the Taint channel (whereRaw / query / execute / Db::raw …).
      Only the fact is reported; no judgement is made on whether the arguments come from the user.
    severity: warning
    category: security
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases so one check does not get slow.
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      # Taint annotations are currently only produced by the PHP FKB (Java projects measured 0 Taint
      # annotations); without declaring the language the rule would be blocked by `rules_unavailable` on
      # Java projects — declaring it also states the prior fact that "this rule belongs to the PHP ecosystem".
      languages: [php]
    when:
      - has_annotation: sink
    message: "Raw SQL execution site {name} (at {file}:{line}) — confirm whether the arguments are parameterised"
    remediation: "Switch to parameterised queries; if arguments come from user input this is an SQL injection risk"

  - id: pii-table-needs-review
    title: Table containing PII needs review
    description: >-
      The table is annotated as containing personal information (phone number / national ID, etc.).
      The MVP only asks for a review; it does not judge whether encryption and masking are adequate.
      (Note: the `pii` annotation is produced by FKB's column list — `thinkphp-pii` on the PHP side
      (`phone` / `mobile` / `tel` / `idcard` / `email`, matching `x` and `*_x`); other stacks have no such
      annotation yet and will then be blocked by `rules_unavailable` rather than hard-reporting 0 hits.)
    severity: warning
    category: security
    applies_to:
      kinds: [Table]
      languages: [php]
    when:
      - has_annotation: pii
    message: "Table {name} was recognised as containing PII fields; confirm that encryption / masking / access auditing are in place"
    remediation: "Check how the columns are stored and where they are exported; add a masking middleware if needed"

  # ⚠️ The `tainted_raw` annotation is produced by the P9 Taint phase (a variable is concatenated directly
  # into the SQL string of a raw SQL execution site).
  # Complements `raw-sql-sink` (which only reports the sink, at warning): this one is confirmation that
  # "user data really flowed in", hence critical.
  - id: sql-injection-raw
    title: User data concatenated into raw SQL (SQL injection)
    description: >-
      A call site executes raw SQL (Db::query / Db::execute / Db::raw / whereRaw / whereExp) and a
      variable is concatenated directly into the SQL string (coming from a request or outside). Whether
      the variable is interpolated into the string or the whole SQL statement is passed in as a variable,
      both count as high-risk SQL injection. Judged by the P9 Taint phase.
    severity: critical
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_raw
    message: "The SQL at raw execution site {name} concatenates a variable directly (at {file}:{line}) — high-risk SQL injection"
    remediation: >-
      Switch to parameterised queries (? / :name placeholders, or ->where('col = ?', [$var])),
      never concatenate user input into an SQL string; if a table / column name must be concatenated,
      validate it against an allowlist.

  # ⚠️ The `tainted_where` annotation is produced by the P9 Taint phase (a variable is concatenated
  # directly into the where-condition string).
  # Distinct from the parameterised ->where('col = ?', [$var]) form: here the variable is pushed into the
  # condition string itself.
  - id: sql-injection-where-interp
    title: User data concatenated into the where-condition string (SQL injection)
    description: >-
      A variable is concatenated directly into the condition string of where / whereOr (e.g.
      ->where("CONCAT(',',roles,',') LIKE '%,$roles,%'")). This is SQL injection, fundamentally different
      from the parameterised form (placeholder + bound array). Judged by the P9 Taint phase.
    severity: critical
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_where
    message: "where condition {name} concatenates a variable directly (at {file}:{line}) — SQL injection risk"
    remediation: "Use the parameterised form ->where('col = ?', [$var]); never write a variable into the SQL string."

  # ⚠️ `tainted_raw_unknown` is produced by the P9 Taint phase: a variable is concatenated into raw SQL,
  # but no request source can be traced inside this function (typically a parameter, e.g. `$sqlItem['sql']`
  # in `executeSqlItem(array $sqlItem)`).
  #
  # Why demote it instead of discarding it: a real injection and a false positive look **identical** from
  # this angle — the `$roles` concatenated into LIKE inside `SystemAdmin::searchRolesAttr($query, $roles)`
  # is also a parameter. Discarding everything would silently under-report, and `rules_silent` cannot cover
  # it (the rule above still has hits). Demoting to warning with clear "needs confirmation" wording neither
  # pretends to be critical nor lets the problem disappear.
  - id: raw-sql-unknown-source
    title: Raw SQL passed in as a variable, source to be confirmed
    description: >-
      The call site executes raw SQL, but the variable concatenated into the SQL cannot be traced to a
      request source inside this function (often a function parameter, or assembled by logic outside this
      function and passed in).
      It may be a trusted source such as an upgrade script / config file, or an upstream caller may have
      brought request data in — this phase does no cross-procedure tracking and cannot decide at the call
      site, so it only hints and never blocks.
    severity: warning
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_raw_unknown
    message: "The SQL at raw execution site {name} comes from a variable (at {file}:{line}) — no request source visible inside this function; confirm whether upstream contains user input"
    remediation: >-
      If that SQL may ultimately contain user input, switch to parameterised queries; if it definitely
      comes from a script / config shipped with the package, disable this rule for the project
      (the rule-set page supports per-project overrides).

  - id: where-sql-unknown-source
    title: where condition passed in as a variable, source to be confirmed
    description: >-
      The condition string of where / whereOr contains a variable, but no request source can be traced
      inside this function (typically a parameter, e.g. `$roles` in `searchRolesAttr($query, $roles)`).
      The only difference from `sql-injection-where-interp` is **evidence strength**: that one is proven to
      come from the request, this one needs a human to confirm the caller.
    severity: warning
    category: security
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: tainted_where_unknown
    message: "where condition {name} contains a variable (at {file}:{line}) — no request source visible inside this function; confirm whether the caller passes user input"
    remediation: "Trace one level up to the caller; if it comes from the request, parameterise it; if it is an internal constant / config, disable this rule for the project."

  # ⚠️ The `cors_origin_reflect` annotation is produced by the P10 Cors phase (Access-Control-Allow-Origin
  # is set to the request Origin — a reflected origin). Combined with
  # `Access-Control-Allow-Credentials: true` it leaks user credentials; a high-risk CORS configuration and
  # a code smell common to all PHP projects.
  - id: cors-reflect-origin
    title: CORS reflected origin (Access-Control-Allow-Origin set to the request Origin)
    description: >-
      The response header Access-Control-Allow-Origin is set directly to the request's Origin (or the whole
      Access-Control-Allow-Origin header is assembled from a variable). That treats requests from any site as
      same-origin and (often together with `Access-Control-Allow-Credentials: true`) leaks user credentials —
      a high-risk CORS configuration. Judged by an FKB rule over the call site / header-assignment graph
      (no kernel CORS phase), so the matched literals live here and not in Rust.
    severity: error
    category: security
    applies_to:
      kinds: [CallSite, HeaderAssignment]
      limit: 9000000
      languages: [php]
    when:
      - any_of:
          # Form two: a header() call whose argument embeds the CORS header and a variable (e.g. header("Access-Control-Allow-Origin: " . $origin)).
          - all_of:
              - name_contains: "header"
              - property_contains: { name: snippet, substring: "access-control-allow-origin" }
              - property_contains: { name: snippet, substring: "$" }
          # Form one: an assignment to the Allow-Origin header whose right-hand side reads the request origin
          # (e.g. $header['Access-Control-Allow-Origin'] = app()->request->header('origin')). The parser only
          # emits HeaderAssignment facts for the Allow-Origin header, so `key` is always that header.
          - all_of:
              - property_is: { name: key, value: "access-control-allow-origin" }
              - property_contains: { name: rhs, substring: "origin" }
    message: "Access-Control-Allow-Origin is set to the request Origin (at {file}:{line}) — reflected origin, credential-level cross-origin leak"
    remediation: >-
      Use a fixed allowlist of origins, or do "compare against the allowlist and echo back" per request;
      never reflect request->header('origin') / $_SERVER['HTTP_ORIGIN'] back verbatim.

  # ⚠️ The `weak_sign_compare` annotation is produced by the P11 Sign phase.
  #
  # This judges "is signature verification done correctly" rather than "is it done at all" — the latter is
  # undecidable: PHP excludes vendor and Java does not scan Maven dependencies, so the verify() of
  # EasyWeChat / yansongda-pay / official SDKs is not on the graph, and any "no verification on the chain"
  # criterion would hold for every callback (100% false positives).
  - id: sign-compare-loose
    title: Signature compared with a loose operator (== / !=)
    description: >-
      A signature value from an external callback is compared with `==` / `!=`. PHP's loose comparison makes
      digests of the `0e...` form judge each other equal (`md5('240610708') == md5('QNKCDZO')`), and the
      byte-by-byte early exit creates a timing side channel. Judged by the P11 Sign phase: a signature
      computation exists in the same function (md5 / sha1 / hash_hmac / *Sign()) and the signature value is
      compared loosely.
    severity: warning
    category: security
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases so one check does not get slow.
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: weak_sign_compare
    message: "The result of signature computation {name} is compared with == / != (at {file}:{line}) — loose comparison + non-constant time"
    remediation: >-
      Use hash_equals($expected, $actual) for a constant-time comparison; comparing as strings first
      introduces `0e...` type confusion and a timing side channel. Note: `===` / `!==` are strict but still
      not constant time, so hash_equals is recommended there too.

  # ⚠️ The `weak_sign_hash` annotation is produced by the P11 Sign phase.
  #
  # Info level only: gateways such as WeChat Pay V2, the legacy Alipay API and Kuaidi100 **officially
  # require MD5** — reporting that as a "vulnerability" would be a false positive, so the wording must be
  # "confirm whether the gateway requires it".
  - id: sign-weak-hash
    title: Signature uses md5 / sha1
    description: >-
      A signature computation uses md5 or sha1. Most of the time the gateway officially requires it
      (MD5 signatures in WeChat Pay V2, the legacy Alipay API, some shipping / printing gateways), and then
      nothing needs to change; what deserves attention is a **self-built gateway** choosing a weak algorithm
      — that means the signature can be collided and forged.
    severity: info
    category: security
    params:
      - key: max_nodes
        label: Candidate call-site cap
        description: Cap on the number of CallSite nodes checked; lower it on very large codebases so one check does not get slow.
        kind: number
        default: 5000
        min: 100
        max: 200000
    applies_to:
      kinds: [CallSite]
      limit: 9000000
      languages: [php]
    when:
      - has_annotation: weak_sign_hash
    message: "Signature uses the weak hash {name} (at {file}:{line}) — ignore if the gateway officially requires it; a self-built gateway should upgrade"
    remediation: >-
      Confirm the digest algorithm the gateway documentation requires; if it is self-built / optional,
      upgrade to HMAC-SHA256 or RSA-SHA256 and make sure the secret never takes part in plaintext concatenation.
