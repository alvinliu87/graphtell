name: Release

# 打 tag（如 v0.1.0-beta.1）即产出各平台预编译包，并推送 Docker 镜像到 GHCR。
#
# 包内容：graphtell 二进制 + 运行时资产（fkb/ rules/ views/）+ README + LICENSE。
# 运行时资产必须随包分发 —— 二进制按「可执行文件相邻目录」解析它们。
#
# 说明：默认 feature 会编译 candle / ort，构建较慢但保留完整语义编码能力；
# 若本地没有 bge-m3 权重（models/ 不入库），运行期会自动退回哈希编码器。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: graphtell

      - name: 编译
        working-directory: graphtell
        run: cargo build --release --target ${{ matrix.target }} -p gt-app

      - name: 组装目录
        shell: bash
        working-directory: graphtell
        run: |
          rm -rf dist && mkdir -p dist/graphtell
          if [ -f "target/${{ matrix.target }}/release/graphtell.exe" ]; then
            cp "target/${{ matrix.target }}/release/graphtell.exe" dist/graphtell/
          else
            cp "target/${{ matrix.target }}/release/graphtell" dist/graphtell/
          fi
          cp -r fkb rules views dist/graphtell/
          cp ../README.md ../LICENSE dist/graphtell/

      - name: 打包（tar.gz）
        if: matrix.os != 'windows-latest'
        working-directory: graphtell
        run: tar -czf "graphtell-${{ matrix.asset }}.tar.gz" -C dist graphtell

      - name: 打包（zip）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: graphtell
        run: Compress-Archive -Path dist/graphtell -DestinationPath "graphtell-${{ matrix.asset }}.zip"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            graphtell/graphtell-${{ matrix.asset }}.tar.gz
            graphtell/graphtell-${{ matrix.asset }}.zip

  docker:
    name: 推送 Docker 镜像到 GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: graphtell
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
