# GraphTell CI
#
# 三个 job 的分工：
#   backend  —— Rust 全量构建 + 测试（核心质量闸门）
#   frontend —— 前端类型检查 / 单测 / 生产构建
#   desktop  —— Tauri 桌面端打包（验证 bundle 配置与图标，发布前必须绿）
#
# 样本测试的可见性约定（重要）：
#   * `samples/frontend-backend-link` 合成样本随仓库分发，对应测试**必须**真跑；
#   * 依赖 CRMEB 真实样本的测试已标 `#[ignore]`（样本体积过大不入库），
#     因此在本文件里看到 `ignored: N` 是**预期**，不是漏跑；
#   * 如果某天某条合成样本测试出现在 ignored 里，说明 .gitignore 又把它吞了。

name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust 构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphtell
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 构建
        run: cargo build --workspace --all-targets

      - name: 测试
        run: cargo test --workspace

      - name: 产出 CLI 二进制
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --release -p gt-app

      - name: 上传 CLI 产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: graphtell-cli-${{ runner.os }}
          path: graphtell/target/release/graphtell
          if-no-files-found: error

  frontend:
    name: 前端类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphtell/ui
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: graphtell/ui/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

  desktop:
    name: 桌面端打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphtell
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: graphtell

      # Tauri 在 Linux 上链接 WebKitGTK，缺这些系统包必然失败
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: graphtell/ui/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: graphtell/ui

      - name: 打包桌面应用
        run: npm run tauri build

      - name: 上传安装包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: graphtell-desktop-${{ runner.os }}
          path: |
            graphtell/src-tauri/target/release/bundle/deb/*.deb
            graphtell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
