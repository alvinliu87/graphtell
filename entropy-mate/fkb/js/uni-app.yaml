# Uni-app 前端（与 ThinkPHP 后端通过 HttpContract 汇聚）
#
# 官网：CRMEB 标准版「系统基于 TP6 + Uni-app 开发……支持微信公众号、小程序、
# H5、PC、APP 多端适配」。
#
# 前端子工程与后端子工程各自建出 HttpContract 节点，
# 靠**同一个 identity** 合并 —— 这就是契约桥配对。
# 死端点 / 幽灵调用检测由此自动成立。

id: uni-app
display_name: Uni-app
language: javascript
version_hint: "3.x"

detectors:
  - kind: manifest_dependency
    manifest: package.json
    dependency: "@dcloudio/uni-app"
    confidence: 0.95
  - kind: file_exists
    path: pages.json
    confidence: 0.6

exclude_globs:
  - "unpackage/**"
  - "static/**"
  - "node_modules/**"

rules:
  - id: uniapp-request-contract
    phase: Synthesize
    selector:
      kind: call
      callee: "uni.request|request|http.request"
    binding:
      - Synthesize:
          node: HttpContract
          identity:
            kind: ContractId
            method:
              arg: 0
              field: "method"
              default: "GET"
              normalize: [upper]
            path:
              arg: 0
              field: "url"
              normalize:
                - strip_prefix: ["api/"]
                - leading_slash
          fields:
            - name: side
              value: { literal: "frontend" }
          link: { kind: CallsHttp, direction: incoming }
          confidence: 0.9

  - id: uniapp-frontend-platform
    phase: AnnotatePost
    selector:
      kind: node
      node_kind: HttpContract
      where:
        - property_is: { name: "side", value: "frontend" }
    binding:
      - Annotate:
          phase: Post
          channel: FkbMark
          target: matched
          annotations:
            - kind: frontend.called
              confidence: 0.9
          merge: Coexist
