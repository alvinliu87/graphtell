# EntropyMate — 代码库图化分析平台
#
# 分层（六边形架构）：
#   crates/em-domain            领域内核：实体 / 值对象 / 端口 trait（零外部 IO 依赖）
#   crates/em-application       用例编排：只依赖 domain 端口
#   crates/em-pipeline          阶段实现（P0..P7 领域服务），只依赖 domain 端口
#   crates/em-adapter-*         适配器：文件扫描 / tree-sitter / FKB / SQLite / HTTP
#   crates/em-app               组装根（Composition Root）+ CLI
#   src-tauri                   Tauri 常驻界面（inbound 适配器）
[workspace]
resolver = "2"
members = [
    "crates/em-domain",
    "crates/em-application",
    "crates/em-pipeline",
    "crates/em-adapter-fs",
    "crates/em-adapter-parser",
    "crates/em-adapter-fkb",
    "crates/em-adapter-views",
    "crates/em-adapter-sqlite",
    "crates/em-adapter-http",
    "crates/em-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/entropy-mate/entropy-mate"

[workspace.dependencies]
# --- 基础 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

# --- 运行时 ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
async-trait = "0.1"
futures = "0.3"

# --- IO / 解析 ---
walkdir = "2"
ignore = "0.4"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"

# --- HTTP ---
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http-body-util = "0.1"

# --- 内部 crate ---
em-domain = { path = "crates/em-domain" }
em-application = { path = "crates/em-application" }
em-pipeline = { path = "crates/em-pipeline" }
em-adapter-fs = { path = "crates/em-adapter-fs" }
em-adapter-parser = { path = "crates/em-adapter-parser" }
em-adapter-fkb = { path = "crates/em-adapter-fkb" }
em-adapter-views = { path = "crates/em-adapter-views" }
em-adapter-sqlite = { path = "crates/em-adapter-sqlite" }
em-adapter-http = { path = "crates/em-adapter-http" }

[profile.release]
opt-level = 2

# 让 Tauri 二进制体积更小
[profile.release.package]
tree-sitter = { opt-level = 3 }
